  <div id="__bundler_placeholder">Loading Merchsmith — Developer Index...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

12, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"29b1aa37-0c26-471c-804a-1aff7bb272ba\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"35308996-1a0a-45fe-adfc-14f3458c0307\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"4fc1a575-fa95-47a7-9a91-4bd66f7c2a12\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"00292976-3f97-4d5b-a598-53b43da9ad97\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f714dedf-48bc-4bbc-9f0c-a9767e9975cb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   MERCHSMITH — design tokens (single source of truth)\n   Link this FIRST on every page:  <link rel=\"stylesheet\" href=\"tokens.css\">\n   Change a brand colour here and every page updates.\n   ============================================================ */\n:root{\n  /* ---- brand palette ---- */\n  --periwinkle:#7B85C5; --periwinkle-deep:#5860A6; --periwinkle-ink:#3C4279;\n\n  /* one horizontal gutter for every full-bleed page: content column, breadcrumb band\n     and footer all use it, so everything shares a single left edge */\n  --page-gutter:clamp(20px,2.5vw,36px);\n  --spearmint:#36C0A0; --flare:#FF2E17; --sky:#0097D8; --blossom:#FFA2A5; --zest:#FFEB3D; --sprout:#9FD792;\n\n  /* ---- neutrals ---- */\n  --ink:#222222; --white:#fff; --paper:#F4F5F8; --paper-2:#E9EBF3;\n  --track:#E4E6EF; --line:rgba(34,34,34,.12); --line-soft:rgba(34,34,34,.07);\n  --muted:#9A9AA6;\n\n  /* ---- extended (was hardcoded; now tokenised) ---- */\n  --ink-2:#44444c;          /* primary body text on cards */\n  --ink-3:#55555c;          /* secondary body text */\n  --slate:#6f7390;          /* unbranded / neutral fill */\n  --text-soft:#6b6b73;      /* captions, meta */\n  --muted-2:#8a8a92;        /* lighter muted text */\n  --hair:#d7d9e3;           /* light outline / borders */\n  --green-deep:#1f8a5b;     /* approved text on tint */\n  --tint-green:#e3f5ee;     /* approved badge bg */\n  --tint-peri:#eceef8;      /* awaiting badge bg */\n  --tint-red:#ffe7e3;       /* feedback badge bg */\n  --brand-black:#1a1a1a;    /* co-brand logos */\n  --shadow-rgb:20,22,45;    /* base for box-shadows: rgba(var(--shadow-rgb),a) */\n\n  /* ---- type ---- */\n  --serif:\"EB Garamond\", Georgia, serif;\n  --sans:\"Mulish\", system-ui, -apple-system, sans-serif;\n}\n\n/* ============================================================\n   COLOURWAY: Woodland  (set <html data-theme=\"woodland\">)\n   Brand accent -> Woodland Green; action -> Dusty Pink;\n   success stays green, error stays red (semantics preserved).\n   ============================================================ */\n:root[data-theme=\"woodland\"]{\n  --periwinkle:#32706B; --periwinkle-deep:#295A56; --periwinkle-ink:#1E423F;\n  --spearmint:#5BA77E; --flare:#E5533D; --sky:#51768C; --blossom:#EAA59B; --zest:#EBCB5B; --sprout:#AED9A3;\n\n  --ink:#222222; --white:#fff; --paper:#F2EDE8; --paper-2:#E7E0D7;\n  --track:#E2DACF; --line:rgba(34,34,34,.12); --line-soft:rgba(34,34,34,.07);\n  --muted:#9C9488;\n\n  --ink-2:#44443e; --ink-3:#57544c; --slate:#51768C; --text-soft:#6d685f; --muted-2:#8d877c;\n  --hair:#ddd5c9; --green-deep:#2E7A57; --tint-green:#E4EFE1; --tint-peri:#E4EEEC; --tint-red:#F7E2DB;\n  --brand-black:#1a1a1a; --shadow-rgb:40,36,30;\n}\n<\u002Fstyle>\n<script src=\"898f152e-77e2-43f9-aef2-5f0fbcb68611\"><\u002Fscript>\n<style>\n*{box-sizing:border-box;margin:0;padding:0;}\nbody{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}\na{color:inherit;text-decoration:none;}\n.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(18px,4vw,40px);}\n.top{background:#fff;border-bottom:1px solid var(--line-soft);padding:26px 0;}\n.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}\n.top h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,40px);letter-spacing:-.01em;}\n.top p{color:var(--ink-2);font-size:14.5px;margin-top:6px;max-width:60ch;line-height:1.55;}\n.top .meta{font-size:12.5px;color:var(--muted);text-align:right;}\n.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;}\n.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);}\n.legend i{width:11px;height:11px;border-radius:3px;}\n.legend.rkey{margin-top:8px;}\n.legend.rkey i{border-radius:99px;width:9px;height:9px;}\n.legend.rkey .two{display:inline-flex;gap:3px;}\n/* resolution rating */\n.meta-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}\n.rate{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-soft);background:var(--paper);border-radius:999px;padding:5px 11px;font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.03em;color:var(--ink-2);cursor:pointer;}\n.rate:hover{border-color:var(--periwinkle);color:var(--periwinkle-deep);}\n.rate .dots{display:inline-flex;gap:3px;}\n.rate .dot{width:9px;height:9px;border-radius:99px;}\n.r-un{background:#d64545;} .r-sl{background:#e8912d;} .r-co{background:#1f8a5b;}\n.cmtbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-soft);background:var(--paper);border-radius:999px;padding:5px 11px;font-family:inherit;font-size:11px;font-weight:800;color:var(--ink-2);cursor:pointer;}\n.cmtbtn:hover{border-color:var(--periwinkle);color:var(--periwinkle-deep);}\n.cmtbtn svg{width:13px;height:13px;}\n.cmtbtn .n{color:var(--periwinkle-deep);}\n.cmt-prev{margin-top:8px;background:var(--tint-peri,#eef0fb);border-radius:9px;padding:8px 10px;font-size:11.5px;line-height:1.45;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}\n.cmt-prev b{color:var(--ink);}\n/* rating picker */\n.rpick{position:absolute;z-index:120;background:#fff;border:1px solid var(--line-soft);border-radius:12px;box-shadow:0 14px 38px rgba(20,22,45,.2);padding:6px;display:none;flex-direction:column;min-width:196px;}\n.rpick.open{display:flex;}\n.rpick button{display:flex;align-items:center;gap:9px;border:0;background:none;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink);text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;}\n.rpick button:hover{background:var(--paper);}\n.rpick button.cur{background:var(--tint-peri,#eef0fb);}\n.rpick .dots{display:inline-flex;gap:3px;}\n.rpick .dot{width:9px;height:9px;border-radius:99px;}\n/* comments drawer */\n.cwin{position:fixed;inset:0;z-index:200;display:none;}\n.cwin.open{display:block;}\n.cwin .scrim{position:absolute;inset:0;background:rgba(20,22,45,.35);}\n.cwin .panel{position:absolute;top:0;right:0;bottom:0;width:min(430px,92vw);background:#fff;border-left:1px solid var(--line-soft);box-shadow:-18px 0 50px rgba(20,22,45,.18);display:flex;flex-direction:column;}\n.cwin .ph{padding:18px 20px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}\n.cwin .ph h3{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:-.01em;}\n.cwin .ph .sub{font-size:11.5px;color:var(--muted);margin-top:3px;font-family:ui-monospace,monospace;}\n.cwin .x{border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:4px;}\n.cwin .x:hover{color:var(--ink);}\n.cwin .list{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;}\n.cwin .ci{background:var(--paper);border:1px solid var(--line-soft);border-radius:11px;padding:10px 13px;}\n.cwin .ci .who{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px;}\n.cwin .ci p{font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap;}\n.cwin .ci .del{border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;margin-top:6px;text-decoration:underline;text-underline-offset:2px;}\n.cwin .ci .del:hover{color:#d64545;}\n.cwin .none{font-size:13px;color:var(--muted);text-align:center;margin-top:26px;}\n.cwin .composer{border-top:1px solid var(--line-soft);padding:14px 20px 18px;}\n.cwin textarea{width:100%;font-family:inherit;font-size:13px;line-height:1.5;border:1.5px solid var(--line-soft);border-radius:10px;padding:10px 12px;resize:vertical;min-height:74px;background:var(--paper);}\n.cwin textarea:focus{outline:0;border-color:var(--periwinkle);}\n.cwin .send{margin-top:9px;font-family:inherit;font-size:12.5px;font-weight:800;color:#fff;background:var(--periwinkle-deep);border:0;border-radius:9px;padding:9px 20px;cursor:pointer;}\n.cwin .send:hover{filter:brightness(1.08);}\n.cat{margin:40px 0;}\n.cat-h{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--line-soft);}\n.cat-h h2{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:-.01em;}\n.cat-h span{font-size:13px;color:var(--muted);}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;align-items:start;}\n.card{background:#fff;border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;transition:transform .14s,box-shadow .14s;display:flex;flex-direction:column;}\n.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(40,44,80,.1);}\n.thumb{height:172px;position:relative;overflow:hidden;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-end;}\n.thumb .prev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;z-index:1;background:#fff;}\n.thumb .glyph{position:absolute;right:-8px;top:-20px;font-size:90px;font-weight:800;opacity:.18;font-family:var(--serif);line-height:1;color:#fff;}\n.thumb .badge{position:absolute;top:12px;right:12px;z-index:3;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:rgba(20,20,40,.55);padding:3px 8px;border-radius:999px;backdrop-filter:blur(3px);}\n.thumb .strip{position:relative;z-index:2;width:100%;padding:8px 12px;color:#fff;font-family:var(--serif);font-weight:500;font-size:16px;letter-spacing:-.01em;background:linear-gradient(transparent,rgba(20,20,40,.74));}\n.body{padding:14px 15px 16px;flex:1;display:flex;flex-direction:column;}\n.body p{font-size:13px;color:var(--ink-2);line-height:1.5;}\n.body .open{margin-top:12px;font-size:12.5px;font-weight:700;color:var(--periwinkle-deep);display:inline-flex;align-items:center;gap:5px;}\n.body .fname{font-size:11px;color:var(--muted);margin-top:7px;font-family:ui-monospace,monospace;word-break:break-all;}\n.body .mod{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:10px;}\n/* history card */\n.hist{margin-top:10px;background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;}\n.hist-h{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;}\n.hist ul{list-style:none;display:flex;flex-direction:column;gap:6px;}\n.hist li{font-size:11.5px;line-height:1.45;color:var(--ink-2);display:flex;gap:8px;}\n.hist li::before{content:\"\";width:5px;height:5px;border-radius:99px;background:var(--periwinkle);flex:none;margin-top:5px;}\n.hist li b{color:var(--ink);font-weight:800;white-space:nowrap;}\n.hist li span{flex:1;}\n/* category colours */\n.t-store{background:#5860A6;} .t-project{background:#1f8a5b;} .t-admin{background:#3C4279;}\n.t-settings{background:#51768c;} .t-ref{background:#9a6b1f;} .t-concept{background:#7a4f8f;} .t-mockup{background:#c0395f;}\n.note{background:#fff;border:1px solid var(--line-soft);border-left:4px solid var(--periwinkle-deep);border-radius:10px;padding:16px 18px;margin:30px 0;font-size:13.5px;color:var(--ink-2);line-height:1.6;}\n.note b{color:var(--ink);}\n.foot{padding:40px 0 60px;text-align:center;color:var(--muted);font-size:12.5px;}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"top\"><div class=\"wrap\">\n  <div><h1>Merchsmith — Developer Index<\u002Fh1><p>Every page in the prototype, grouped and summarised, with a change history per page. Cards are ordered newest-modified first within each group. The go-to starting point for building the live site.<\u002Fp>\n    <div class=\"legend\">\n      <span><i class=\"t-store\"><\u002Fi>Storefront<\u002Fspan><span><i class=\"t-project\"><\u002Fi>Projects<\u002Fspan><span><i class=\"t-admin\"><\u002Fi>Platform Admin<\u002Fspan><span><i class=\"t-settings\"><\u002Fi>Settings<\u002Fspan><span><i class=\"t-ref\"><\u002Fi>Reference / specs<\u002Fspan><span><i class=\"t-concept\"><\u002Fi>Concepts<\u002Fspan><span><i class=\"t-mockup\"><\u002Fi>Mockups<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"legend rkey\">\n      <span style=\"color:var(--muted)\">Design resolution:<\u002Fspan>\n      <span><i class=\"r-un\"><\u002Fi>Unconsidered<\u002Fspan>\n      <span><i class=\"r-sl\"><\u002Fi>Slightly considered<\u002Fspan>\n      <span><i class=\"r-co\"><\u002Fi>Considered<\u002Fspan>\n      <span><span class=\"two\"><i class=\"r-co\"><\u002Fi><i class=\"r-co\"><\u002Fi><\u002Fspan>Finished<\u002Fspan>\n      <span style=\"color:var(--muted)\">— click the tag on any card to set it<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"meta\">Prototype · localStorage data layer<br>No backend yet — see HANDOVER.md<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<div class=\"wrap\" id=\"cats\"><\u002Fdiv>\n\n<div class=\"wrap\"><div class=\"note\"><b>For the developer:<\u002Fb> this is a clickable, front-end prototype. All data persists in the browser's <b>localStorage<\u002Fb> (keys prefixed <code>ms-<\u002Fcode>) — there is no server. Shared data layers worth knowing: <b>MSCAT<\u002Fb> (product catalogue), <b>MSSTORE<\u002Fb> (store taxonomy), <b>MSBRANDS<\u002Fb> (brand tags), <b>MSBrief<\u002Fb> (project briefs), <b>DPROJ<\u002Fb> (master projects), plus the shared engines <code>product-modal.js<\u002Fcode> and <code>comments.js<\u002Fcode>. See the <b>Field Mapping Reference<\u002Fb> for how supplier API/CSV data maps to the platform model. History dates before Jul 2026 are approximate (logged retrospectively); entries are exact from here on.<\u002Fdiv><\u002Fdiv>\n\n<div class=\"foot\">Merchsmith Platform · Developer Index<\u002Fdiv>\n\n<script>\n/* h: [[ISO date, change], …] newest first — first entry drives \"Last modified\" + card order */\nconst CATS=[\n  {id:'store',name:'Storefront',cls:'t-store',sub:'Customer-facing shop',pages:[\n    {f:'Merchsmith Page.html',t:'Store pages (About, Environmental footprint, legal…)',d:'Renders the distributor\\'s store pages from site-content.js by ?p=<slug>. Platform pages (platform:true, e.g. evermerch-scoring) are published by Merchsmith for every store and edited only in Platform Admin.',h:[['2026-11-17','How products are scored: \"supplier\" changed to \"manufacturer\" (Origin pillar description and Tier B evidence).'],['2026-11-17','How products are scored: Longevity 4/5 and 2/5 descriptions no longer mention warranty (Durable design with some repair support / Short expected life, or weak repair support).'],['2026-11-17','How products are scored: removed the rules version / EPI / published by Merchsmith line under the intro.'],['2026-11-17','Fixed: links to store pages (e.g. the sustainability panel\\'s rules link) opened About us in the design viewer, which drops ?p=. chrome.js (v6, all pages) now remembers the page slug that was clicked and the page falls back to it (also accepts #p=).'],['2026-11-17','New platform page How products are scored (?p=evermerch-scoring, type scoring, sus-rules.js): Evermerch scoring rules from the handover in the store style — contents, principles, live weights table and worked example, label bands, five pillars with 0–5 descriptions, evidence, certifications, updates. Environmental footprint shows a link block when the distributor switches on Evermerch scoring. Fixed: admin view crashed when no store mark was set.']]},\n    {f:'Merchsmith Subscription Invoice.html',t:'Subscription & onboarding invoice (PDF)',d:'Preview of the A4 invoice Merchsmith sends distributors for their monthly subscription and the one-off onboarding fee, with Paid / Payment failed versions. Rendered by subinv-doc.js (MSSUBINV) from billing.js data (MSBILL.docData); the same document opens from View on any invoice in Settings › Billing and Finance › Subscription.',h:[['2026-11-17','Open in viewer uses the same in-page invoice viewer as the rest of the platform.'],['2026-11-17','When VAT is off for a distributor the invoice shows VAT not charged at £0.00 with the reason underneath (subinv-doc.js v2).'],['2026-11-17','Page created: Merchsmith-branded tax invoice — header with Merchsmith mark, invoice date, billing period (or One-off · on sign-up), account, plan, payment method and your reference; From / Bill to; line items (plan base, additional seats, or the onboarding fee marked Non-refundable); subtotal, VAT, total, paid and balance due; payment note (paid, failed with what to do, or due); an About this charge note; company footer. Print / save as PDF bar.']]},\n    {f:'Merchsmith Pay.html',t:'Pay invoices (secure link)',d:'Opened from the pay link in invoice emails, no login: every outstanding pro forma and VAT invoice for the account, tick and part-pay, commercial card (fee shown) or bank transfer with one reference; card payments raise a fee VAT invoice.',h:[['2026-11-17','Invoice documents show the project reference with the project name (proforma-doc.js v106).'],['2026-10-23','Fixed: Security code and Last name fields overflowed the payment panel at narrow widths.'],['2026-10-23','Distributor view \"Take a card payment\" (customer picker, taken by, customer contact for the receipt). Guest view asks for first name, last name and email before paying. Card area ends with Powered by Stripe and the Visa / Mastercard / Amex logos.'],['2026-10-23','Moved into the platform design: standard header, side menu, breadcrumb (Customer › Finance › Pay invoices), page title and footer. Guest view (?guest=1, the emailed link) hides the side menu, search and account tools and shows \"Sign in to your account\".'],['2026-10-23','Fixed: layout clashed with another stylesheet (pp- class names) and overflowed at narrow widths; classes renamed, collapses to one column under 1020px.'],['2026-10-23','Page created.']]},\n    {f:'Merchsmith Store.html',t:'Store',d:'The live store — merchery-style home page, departments, sub-category filters (price/colour/brand), product pages and the distributor price view. Reads the shared catalogue.',badge:'Live',h:[['2026-11-17','Sustainability panel: no dividing line under the top bar; the expanded area is now the top bar colour at 50% opacity; chart gridlines now sit at each whole score (0–5) so bars end on a line (sus-score.js v11).'],['2026-11-17','Sustainability panel body redesign: pillar icons tinted to match the chart bars (also shown on the chart labels), a score chip on each row coloured by level (green 4–5, amber 3, red 0–2), an evidence badge (Certified / Declared / Claim only, tier on hover), repeated reason text hidden, Data NA rows muted with a dashed chip, and a single line when there are no certifications (sus-score.js v10).'],['2026-11-17','Sustainability panel: the expanded area now uses the top bar colour at 75% opacity, separated from the bar by a straight full-width line (sus-score.js v9).'],['2026-11-17','The Customer view switch in the store band is now labelled Store View.'],['2026-11-17','Sustainability panel: the summary sentence and the Evidence / Rules / EPI line moved from under the certifications to below the Assessment, under their own Summary heading (sus-score.js v8).'],['2026-11-17','Trade view stock by colour: where the feed gives stock per colour, the product page Stock line shows the total across colours and how many are out (e.g. 23,950 in stock across 5 colours · 1 out); clicking a colour swatch shows that colour (Navy: 0 · 2,000 due 3 Dec) with an all colours link back. The card dot turns amber when any colour is low or out, and the hover lists the colours that are out. Placeholder stock is now per colour too.'],['2026-11-17','Product page Trade info made compact: no box or explanatory notes, aligned with the Price &amp; lead time details above, and four one-line rows (Supplier, Stock, Added via with update date, Range).'],['2026-11-17','Trade view for Platform Admin and Distributors (store-trade.js): product cards get one quiet line — supplier · stock dot and figure · how added (API / CSV / Manual) · last updated, with full detail on hover. Product page gets a Trade info box (Not shown to customers): supplier, stock with warehouse and next delivery, how added, last updated, and range status (Recommended / Featured / Added by you, with dates). A Customer view switch in the store band hides all of it and the distributor panels at the foot of the product page, and hides the supplier name in the sustainability panel, so the page reads exactly as a customer sees it. Customers never see the switch. Stock uses imported feed figures where present, otherwise placeholders until the live stock feed is connected.'],['2026-11-17','Sustainability panel: Longevity 4/5 is now based on expected life only, without a warranty minimum (sus-score.js v6).'],['2026-11-17','Fixed: the panel\\'s rules link and footer page links open the right page in the design viewer (chrome.js v6).'],['2026-11-17','Sustainability panel (i) text now links Evermerch\\'s published rules, plus Read how products are scored →, to Merchsmith Page.html?p=evermerch-scoring (sus-score.js v5).'],['2026-11-17','Sustainability panel: customers see Manufacturer certifications without the supplier’s name.'],['2026-11-17','Product page shows the same labels as the thumbnails above the product name (Featured / New / Recommended and the sustainability word).'],['2026-11-17','Sustainability panel now opens minimised (title with score, Evermerch logo, expand chevron); click to see the assessment. Evermerch logo is the supplied wordmark, traced to SVG and coloured to the panel. Certifications split into Product certifications (from the product data) and Manufacturer certifications (from the supplier), shown as logos when the library has one. Product thumbnails (grid and list) show the sustainability word (e.g. Good) in the same outline label style as Featured / New, top right; hidden when the distributor turns scores off.'],['2026-11-17','Evermerch sustainability panel added to every product page below the product details (e.g. Xoopar Pokket Wireless Mouse: Good 65/100). Hidden when the distributor turns scores off. The old 0–10 eco number is now the Evermerch score ÷ 10 on every page that loads sus-score.js, so the Eco filter, Eco picks sort and leaf badge agree with the panel. Leaf badge now reads e.g. Sustainability: Good (65/100). Distributor view Sustainability & compliance accordion shows the score, evidence status, certifications from the product data and the end-of-life route; it no longer guesses certifications from the score.'],['2026-11-12','New Best sellers sort (featured first, then most units ordered). Listing deep links: #all&sort=best|new|eco|lead open All Products with that sort chosen and the page title set to Best sellers / New in / Eco picks / Fastest delivery. A listing opened without a sort starts on Featured.'],['2026-11-05','Product page gallery: click the left or right half of the main image for the previous / next image (loops round); every thumbnail now sits in one sideways-scrolling row (was up to 6, wrapping). Enlarge is the corner button only. Matches the live dev site.'],['2026-10-15','New embed mode (?embed=1): hides header, rail, store band, footer, chat, Back link and Add to Project, for use inside the project product pop-out.'],['2026-10-15','Store search: products first, then \"Your projects and orders\"; Enter opens the results panel with price / colour / supplier / branding / lead time / eco filters and sorting; \"500 pens\" shows the price at that quantity.'],['2026-10-14','Product page (distributor): Proof warnings card under Suppliers with Edit / Add warnings.'],['2026-09-30','Product page Suppliers box: mark a product as two-supplier (blank supplier + decorator) as the store default.'],\n      ['2026-09-23','Default store: renders as the operator regardless of the Viewing-as pill, with its own rail; Store settings (homepage) and Footer editors added for it, saved separately from any distributor\\'s.'],\n      ['2026-09-23','Merchsmith default store (?store=merchsmith): the Recommended range as distributors on Recommended mode receive it, opened from Platform Admin. Product page swaps \"In your range\" for a Recommended / Featured status bar (recommend, feature, change tier, remove), plus the notes/comments/history panel filed as Merchsmith\\'s.'],\n      ['2026-09-20','Gutters tokenised as --page-gutter across the platform: breadcrumb band, content column and footer now share one left edge (previously three different clamps plus a fixed 36px on the bands).'],\n      ['2026-09-20','Store homepage now full-width, matching the category/listing pages (was capped at 1280px).'],\n      ['2026-07-09','Category listings full width with a 5→4→3→2→1 responsive product grid; hover on a product crossfades to its second image (merchery-style). Colour filter now runs on the shared 19-base-colour mapping engine (colour-map.js) with overrides from the Field Mapping tool.'],\n      ['2026-07-02','Product page: USP story blocks with quotes, collapsed reviews with summary, image zoom + swatch-linked gallery, \"You might also like\".'],\n      ['2026-06-30','Homepage made distributor-editable (Store Settings): show/hide, inline edits, duplicate/delete sections, sustainability band colour.'],\n      ['2026-06-28','Best Sellers curated + capped at 2 rows; Recently Added 1 row; category-style product thumbnails; descriptions clamped to 2 lines.'],\n      ['2026-06-24','\"All products\" top-nav link → full listing with A–Z sub-category filters and show-more.'],\n    ]},\n    {f:'Merchsmith Home.html',t:'Home / Dashboard',d:'Logged-in landing dashboard for the customer/distributor.',h:[['2026-11-18','Loads ghost-access.js: distributor admins see the Merchsmith support access request card (approve, decline, allow calls and emails) and an End access now card while access is active.'],['2026-11-17','Dashboard project lists show each project\\'s reference. Header search finds projects and orders by project reference.'],['2026-11-17','New Sustainability card under the KPI row (sus-dash.js), different for each user. Distributor: range average score, share of sales rated Good or better and average score of sales over the last 12 months with change, products with Data NA; plus the top thing to act on (low-scoring products still being ordered, or missing data) and goals in progress. Customer (only when the distributor shows scores): average score of what they buy and spend on Good or better (last 12 months, with change), products bought, one greener swap with a link to it, goals, and a link to create their report. Supplier: their average vs the platform, % complete evidence, changes in review, share of sales Good or better; the action is not-approved changes first, then the product missing the most data. Every figure links into the matching Sustainability tab.'],['2026-10-26','Footer accreditation logos link to their website (default links for B Corp, Ecologi, bpma, Living Wage).'],['2026-10-26','Fixed: theme.js had a syntax error (from the 26 Oct download-link change) that stopped colourways applying on every page. New MSTheme.distVars() / applyDist() and MS_SCOPE dist for documents the distributor sends.'],['2026-10-23','Sidebar: Finance menu (customer) gains \"Pay invoices\".'],['2026-10-15','Search pop-out 25% wider (775px minimum, capped to the window).'],['2026-10-15','Search pop-out: thumbnails doubled (84px, top result 100px).'],['2026-10-15','Search pop-out redesigned with more space: larger rows and thumbnails, top result as a highlighted card, count pills on chips, dividers between groups, quieter footer.'],['2026-10-15','Search results panel: product filters (price, colour, supplier, branding method, lead time, eco) removed from the side; type list and sort stay.'],['2026-10-15','Search: results-panel and mobile search fields no longer show a box inside the pill.'],['2026-10-15','Header search now works on every page (search.js, loaded by theme.js): dropdown under the bar (full screen on phones), / or Ctrl/⌘K, grouped results by role, top result, exact order/PO/SKU jump, chips + hidden shortcuts (in: status: customer: supplier: project:), actions, recent searches, typo / synonym / colour matching, full results panel (#search=) with product filters.'],['2026-10-15','Sidebar: \"Gallery view\" removed from the Projects pull-out menu (all roles).'],\n      ['2026-09-20','Now full-width and left-aligned, matching Chats (was capped at 1600px and centred).'],\n      ['2026-09-20','Width tiers applied: cap raised 1300→1600px (card dashboard goes sparse if fully stretched), fluid padding.'],['2026-06-15','Initial build.']]},\n    {f:'Merchsmith Basket.html',t:'Basket',d:'Basket, checkout and order-placed confirmation.',h:[['2026-11-17','Pro forma documents show the project reference with the project name (proforma-doc.js v106).'],['2026-10-23','Checkout card payment checks the card type: personal cards are declined with a message (prototype: numbers starting 4000).'],['2026-10-23','Card form states business (commercial) cards only.'],['2026-10-23','Checkout pro forma shows each product’s Project above Branding.'],['2026-10-23','The checkout pro forma number carries onto the placed order.'],['2026-10-23','Checkout pro forma uses the same changes; basket Delivery notes and new-address delivery instructions carry onto the order line (deliveryNotes) and print under the product.'],['2026-10-23','D05 checkout pro forma uses the same new design (proforma-doc.js).'],['2026-10-15','Split delivery: when there\\'s no agreed date yet, the earliest date is today + the product\\'s lead time (shown under Deliver by), so the date rule and Need it sooner? work in the basket too.'],['2026-10-15','Split delivery: suppliers without an extra-delivery rate use the distributor default, shown as estimated; more addresses than the cap shows \"price on request\"; Deliver by is a date picker that can\\'t go earlier than the agreed date, with \"Need it sooner?\" to request an earlier date (to be confirmed). Distributor notified on save.'],['2026-10-15','Split delivery: \"New address…\" now opens the same Add delivery address form as the basket (address name, recipient, company, phone, postcode finder, one field per line, instructions, validation) over the split window, instead of a cramped box in the table.'],['2026-10-15','Add delivery address rebuilt: address name, recipient, company, phone; UK postcode finder; one field per line (line 1, line 2, town, county, postcode, country) with required markers and hints; delivery instructions; validation messages.'],['2026-10-15','Split delivery: the supplier name is no longer shown to customers in the delivery limits line.'],['2026-09-30','Basket rebuilt (basket-view.js / basket.css): grouped by project, approved visual thumbnails, colour / size splits, address chips with Apply to all, order-by warnings, sticky summary with credit and terms, empty state; split one product across several addresses.'],['2026-09-30','Checkout (finance-view.js): billing address, invoice contact (Finance user by default), PO number / PO upload per customer account setting, delivery summary per address, live card fee, bank transfer details + pro-forma, credit bar, terms tick, no-refund acknowledgement before placing.'],['2026-09-30','Order placed page (confirm-view.js): success header, lines with thumbnails, timeline, delivery per address, payment block, emailed-to note, account manager card, PDF confirmation.'],['2026-09-30','Discount codes applied at checkout (promo-codes.js). BACS payment deadline shown when paying by bank transfer (bacs-deadline.js).'],['2026-06-15','Initial build.']]},\n    {f:'Merchsmith Orders.html',t:'Orders',d:'Orders list and full order detail for distributor, customer and supplier: per-product workflow with suppliers, POs, acknowledgements, proofs, dispatch, invoices, credit notes, amendments, cancellations, split deliveries and two-supplier lines.',h:[['2026-11-17','Project reference shown with the project in the orders table, order header and order lines, included in CSV export, and on pro forma / PO documents (proforma-doc.js v106). Fixed: the orders table failed to load (routeOf is not defined) because a comment added with the #q= deep link swallowed the rest of its line.'],['2026-11-17','Deep link #q=<text> fills the search and shows all statuses (used by Sustainability › What you buy).'],['2026-11-12','Fix: the Orders list failed to load for suppliers (orders-table.js called supOf, which is only defined as supOfL there).'],['2026-10-26','Delivery notes moved onto the shared A4 customer document design (proforma-doc.js kind dn): delivery note no., dispatch date, order ref, PO, courier, tracking; deliver to, customer contact and project, delivery instructions; items with SKU, quantity and colour breakdown (no prices); total units; Checking your delivery steps; received-by signature line. Split deliveries get one note per address (Delivery note 1 of 3 · address) in the documents list.'],['2026-10-26','Document links (#…&dl=doc:…) now show the finished document full page and open the print dialog; #…&as=distributor views the page as that role without changing the saved identity.'],['2026-10-24','Purchase orders print the distributor’s purchasing terms from Settings; no terms page when switched off.'],['2026-10-23','One product per purchase order: each item has its own PO (PO-1051-01, -02… matching the VAT invoice numbers), sent, previewed, chased and invoiced on its own. Supplier invoices are one per PO. Existing orders converted: sent dates carried over; a supplier invoice that covered several items is split evenly across their POs (no./1, /2…).'],['2026-10-23','Supplier purchase order (D09) moved onto the shared A4 design: PO no., date, order ref, placed by, quoted by, delivery date; supplier, supplier contact, invoice-to; numbered items at cost with variant SKUs, product, colours, dimensions, description, branding per position, notes; highlighted warnings (no fail, must match sample, repeat, incoming blank stock); deliver-to per item with split quantities; setup and delivery rows; PO total ex VAT; numbered order conditions.'],['2026-10-23','D06 order confirmation is now the Order acknowledgement on the shared A4 design: order no., date placed, PO, placed by, contact, terms; check-everything notice on every page; numbered items with project, branding, artwork status, colours, deliver-by, deliver-to; Payment box and What happens next by payment type.'],['2026-10-23','Card payment fee line on the revised pro forma no longer says \"est.\" (always 1.5% or 3%).'],['2026-10-23','Card payments (payments.js): unpaid bank-transfer pro formas get \"Pay by card instead\", which issues a revision (PF-…-R2, old one superseded, logged) showing the estimated card fee and total to pay by card; \"Pay by bank transfer instead\" issues another revision. On-account orders show \"Invoices to pay\" with a Pay invoices link. Card fee VAT invoices (INV-…-F1) listed on the order. VAT invoices show Part paid with paid to date and balance due. Credit notes against card-paid invoices add a proportional card fee refund line.'],['2026-10-23','Credit note (D10) moved onto the shared A4 design: credit note no., tax point, against invoice, reason, credited lines as negatives, net / VAT / total credit, credit status and how it’s settled (account / card / bank). VAT invoices no longer show credit notes.'],['2026-10-23','Pro forma and VAT invoice: each product shows the Project it was ordered from, above Branding (when the line has one).'],['2026-10-23','Invoice documents: tighter vertical spacing so a one-product VAT invoice fits on one A4 page in every state; the last block may use the space above the footer before moving to a new page.'],['2026-10-23','VAT invoice (D08 / D08P) moved onto the shared A4 document design: invoice no., tax point, due date, supplier and customer VAT numbers, status (Unpaid / Overdue / Paid), variant + SKU rows, its own additional charges and delivery, deliver-to with split quantities, dispatch details, credit notes and balance due, bank details.'],['2026-10-23','VAT invoices: each product\\'s invoice lists its own additional charges (qty × unit) and delivery, and its totals include them. Only order-level leftovers (older orders\\' single delivery figure, rounding) stay on the last item dispatched.'],['2026-10-23','Pro forma: footer reads Company No.; header logo 35% larger.'],['2026-10-23','Pro forma payment status: Awaiting payment in red (light red tint box + pill), Paid in green.'],['2026-10-23','Pro forma: each split-delivery address lists colour / variant × quantity (with the total), then its deliver-by date. Additional charges print with their own qty × unit.'],['2026-10-23','Pro forma: reference strip is now six fields with a hairline under each (gaps between columns, no box); logo vertically centred in the header; page count styled like the number line (pink, caps).'],['2026-10-23','Pro forma: the reference strip (no., date, PO, order ref, contact, terms) and the Invoice to / Customer contact / Payment status row now repeat at the top of every page.'],['2026-10-23','Pro forma laid out as real A4 pages: the header (logo, title, number, payment status, Page n / N) and footer repeat on every page, column headings repeat on each page with items, products never split across pages. The order keeps the checkout pro forma number.'],['2026-10-23','Pro forma: product notes removed; Paid / Awaiting payment shown in the header and a Payment status box; Deliver to moved under each product (split deliveries list every address with units, date and delivery notes); sequential PF numbers (ms-pf-register); real store SKU on new order lines; customer phone from their team record.'],['2026-10-23','D07 pro forma invoice redesigned (proforma-doc.js): distributor logo + colour, repeating header, reference strip (no., date, PO, order ref, contact, terms), invoice / delivery / customer contact, numbered products with SKU, qty, unit, amount, branding, colours, deliver-by, store product notes, setup and delivery rows, VAT box, totals, bank details and reference, PAID stamp, company footer.'],['2026-10-15','Split delivery: same cost (estimated / price on request) and date rules as the basket.'],['2026-10-14','Tabs: All orders · Stats (dashboard, #stats) · Targets (#targets). Dashboard per role with period + comparison, team cards against monthly targets, every figure links to its table.'],['2026-10-14','Targets tab (targets.js): monthly targets per team member, 12-month grid, working days per month, past months locked with actuals.'],['2026-10-14','Item card: fold-out Variants & Mojo SKUs; supplier PO shows the store Product box and Mojo SKU per variant.'],['2026-10-14','Filters: Placed / Deliver-by date range, and Route (Direct / Via us / Mixed) with Via-us tags on rows.'],['2026-10-14','Customer can confirm receipt (I\\'ve received it / Something\\'s wrong); amber \"Has it arrived?\" after 3 working days.'],['2026-10-14','Untracked couriers (Royal Mail untracked, Hand delivered, Collected): tracking optional, next step Mark delivered.'],['2026-10-14','Change supplier on an item until production (cost difference absorbed or passed on as invoice / credit note, history kept).'],['2026-10-14','Supplier adjustments: additional supplier POs and supplier credits per item or per order, printable, flow into Finance.'],['2026-10-14','Sample orders: Unbranded / Branded labels, quicker unbranded flow (Confirm stock & dispatch), default sample dates from lead times, Set / Edit dates.'],['2026-09-30','Expand all / Collapse all; table headings pin under the site header and each order’s product headings pin under them while scrolling, swapping order by order.'],['2026-09-30','Orders list rebuilt like the Projects table: stat cards, Orders + More filters (product stages, payment incl. Payment due / Payment due critical), customer / team member / project / supplier dropdowns, sortable columns, Team avatars, per-product expandable rows with column headings (Product, Progress, Price, Supplier date, Customer date, Status), bulk export (orders-table.js).'],['2026-09-30','Order page (order-detail.js): per-product flow Order received → Check & send → Acknowledged → Proof → Confirmed / Revision → In production → Dispatched → Delivered; side-by-side OA and proof checks with Yes / No / NA ticks; supplier PO print with branding, notes, price breakdown, dates and warnings; editable PO price table + extra lines.'],['2026-09-30','Order page: amendments (re-open product pop-out, customer re-approval, partial payment / refund), per-product VAT invoices at dispatch with tally, credit notes and extra invoices (Net / VAT / Total), cancel item / cancel order with refund or deduction, report a problem.'],['2026-09-30','Order page: customer + account manager contact cards, supplier logo + contact card, project team card, order- and product-level flags + comments (order-social.js), overall progress bar with per-product dots, pinned order header, section snapping, minimise products, split deliveries per address (split-delivery.js), editable delivery address with new OA request.'],['2026-09-30','Two-supplier lines (two-supplier.js): blank stock lane, blank PO with overs, handover booking-in, production gate, three document columns. See the Two-supplier workflow guide.'],\n      ['2026-09-20','Width tiers applied: full-bleed content area (was capped 1080–1320px), now uses the full window and reflows with it.'],['2026-06-15','Initial build.']]},\n    {f:'Merchsmith Brand Assets.html',t:'Brand Assets',d:'Customer brand library — logos, colours, fonts, images and product artwork (feeds the brief + builder).',h:[\n      ['2026-09-20','Width tiers applied: full-bleed content area (was capped 1080–1320px), now uses the full window and reflows with it.'],['2026-06-15','Initial build.']]},\n    {f:'Merchsmith Chats.html',t:'Chats',d:'Messaging between customer, account manager and production.',h:[\n      ['2026-09-22','Rebuilt on real platform chat: org directory with contact rules, 1-to-1 / group / project threads, saved history shared across identities, unread badges, read receipts, typing, attachments, product/project links, search and mute. History tab merged into Messages.'],\n      ['2026-09-20','Width tiers applied: full-bleed content area (was capped 1080–1320px), now uses the full window and reflows with it.'],['2026-06-15','Initial build.']]},\n  ]},\n  {id:'project',name:'Projects',cls:'t-project',sub:'Briefs, product modal, galleries',pages:[\n    {f:'Merchsmith Calendar.html',t:'Calendar',d:'Cross-organisation meeting calendar with availability, lunch breaks, holidays, blocked times, phone / virtual / face-to-face meetings and Gemini transcript upload.',h:[['2026-09-30','Added to the index. Built Sep 2026.']]},\n    {f:'Merchsmith Calls.html',t:'Calls',d:'Platform phone calls (admin + distributors): dial, recording, history, voicemail, call forwarding chain.',h:[['2026-11-18','Ghost sessions without calls-and-emails permission hide call summaries, recordings, transcripts and notes. Integrations: Prototype: simulate a broken connection, which sets Needs reconnecting, shows the banner and sends a notification (calls.js v10, calls-int.js v7).'],['2026-11-18','Connect screen now says why each permission is needed. New Private to your team note (connect screen and Integrations): call data is visible only to the distributor\\'s team; Merchsmith staff can only see it via ghost mode when the distributor asks for help and their admin permits it, logged and ended after. Same rule stated on the Platform Admin connections table (calls-int.js v6).'],['2026-11-18','RingCentral first: provider logos (RingCentral, Aircall), RingCentral listed first, no Recommended tag. Platform Admin › Integrations now starts with Merchsmith\\'s own phone system, connected the same way as a distributor, and the not-connected banner shows for admin too. Settings tab and the Your number card now come from the linked provider (forwarding, voicemail and greeting are set there); recording panel shows the provider\\'s announcement and retention (calls-int.js v5, calls.js v9).'],['2026-11-18','Integrations now offers only Aircall and RingCentral to distributors, per the Calls plan. Dialpad, Zoom Phone, 8x8 and Microsoft Teams Phone are set to Hidden (Platform Admin can switch each on). Earlier saved provider choices are reset once (calls-int.js v4).'],['2026-11-18','The no-provider banner now also shows above the Integrations tab until a provider is connected (without the link there, as the providers are just below). Disappears as soon as one is connected (calls.js v8, calls-int.js v3).'],['2026-11-18','No-provider banner above the Calls tabs given more space: more padding, gap above and below, link set to the right (calls-int.js v2).'],['2026-11-18','New Integrations tab (calls-int.js): each distributor links its own phone provider. Distributors pick from Aircall (recommended), RingCentral, Dialpad, Zoom Phone, 8x8 or Microsoft Teams Phone (coming later), sign in at the provider, match their team by email, set options and confirm the recording announcement. Platform Admin sets which providers are offered, sees every distributor\\'s connection health, sets platform rules and has developer notes. Banner on the Calls page when no provider is linked (calls.js v7).'],['2026-09-30','Added to the index. Built Sep 2026.']]},\n    {f:'Merchsmith Emails.html',t:'Emails',d:'Sent log, templates, sending domain, reply by email, compose free-form emails, signatures (admin + distributors).',h:[['2026-11-18','Mailbox: Needs reconnecting state with explanation, banner above the Emails tabs, notification, and a Prototype: simulate a broken connection link; logged email subjects hidden in ghost sessions without permission (mailbox.js v3, emails.js v11).'],['2026-11-18','Mailbox: private now means private from the team, not the company\\'s admins; platform rules now fixed (kept while the contact is in Merchsmith, attachments never copied, opens tracked on all emails sent from Merchsmith) (mailbox.js v2).'],['2026-11-18','New Mailbox tab (mailbox.js): each person can connect Google Workspace or Microsoft 365. Permission screen with the reason for each permission and a who-sees-what note (team by default, mark private, Merchsmith staff only via ghost mode with permission). Settings: send from my mailbox, log emails with people in Merchsmith, never-log list. Recently logged with Mark private, personal Bcc logging address, team connection list. Platform Admin: providers offered, distributor connection counts, platform rules and developer notes. New email shows From … from your Gmail when connected (emails.js v10).'],['2026-09-30','Added to the index. Built Sep 2026.']]},\n    {f:'Merchsmith Customer Onboarding.html',t:'Customer onboarding',d:'Invite-link flow: details, organisation, brand, delivery, team, billing, terms, notifications, tour, account manager.',h:[['2026-11-12','Invite your team step now prompts the Admin to add a second Admin while they are the only one.'],['2026-09-30','Added to the index. Built Sep 2026.']]},\n    {f:'Merchsmith Distributor Onboarding.html',t:'Distributor onboarding',d:'Invite-link flow for new distributors: details, company, plan + payment, T&Cs, brand, domain, team, email domain, Merchsmith contact.',h:[['2026-09-30','Added to the index. Built Sep 2026.']]},\n    {f:'Merchsmith Supplier Onboarding.html',t:'Supplier onboarding',d:'Invite-link flow for suppliers: details, company, type + specialisms, product feed, team, T&Cs, Merchsmith review.',h:[['2026-09-30','Added to the index. Built Sep 2026.']]},\n    {f:'Merchsmith Distributor Projects.html',t:'Projects (master table)',d:'Distributor-wide master table: every project for every customer, with expandable product rows that embed the full workspace engine. KPIs act as filters.',badge:'Key',h:[['2026-11-17','Project reference numbers: each project row shows its unique reference under the name; the search box finds projects by reference. Duplicated projects get a new reference of their own.'],['2026-10-15','\"Download PDF\" removed from the selection bar (D04 removed).'],['2026-09-30','Show all products renamed Expand all / Collapse all.'],['2026-09-30','Expanded project rows always show the list (row) view, never gallery.'],\n      ['2026-07-23','Delivery Date & Order by cells redesigned: compact Sup/Cus lines, supplier confirmation folded into one status marker, Critical shown as a left accent, calendars reveal on hover.'],\n      ['2026-07-09','Customer column gains a company-logo monogram tile; Client column gains a circular avatar.'],\n      ['2026-07-09','Filter bar decluttered: Projects row always visible; Products / Order by / Breakdown behind a \"More filters\" toggle with applied-filter tokens; quieter chip styling.'],\n      ['2026-07-08','Delivery + Order-by dual Supplier/Customer dates cascade in; supplier filter added and pushed into expanded projects.'],\n      ['2026-07-07','Filter system rebuilt: Projects (Live default/Paused/Archived/Urgent), Products, Order-by (Overdue/Today/Tomorrow/This week), Breakdown (Design/Price/Sample/Stock × My action/Customer action/Waiting/Setback/Done).'],\n      ['2026-07-06','Client + Collaborators columns; Compact/Comfortable density; comments drawer (shared comments.js); Deadline/Next-order-by columns retired in favour of filters.'],\n      ['2026-07-04','Row actions: flag, comments, brief, add product; select-project bulk bar (Pause/Archive/Duplicate/Download PDF); drag-to-reorder saved as default order.'],\n      ['2026-07-02','Page created — sortable/filterable master table, expandable product rows with full workspace parity via embedded engine.'],\n    ]},\n    {f:'Merchsmith Project - Autumn Giveaways.html',t:'Project (worked example)',d:'The flagship project workspace: product table, four-stage product modal (Design / Price / Sample / Stock), brief control panel and collaborator rail. Also powers the embedded tables on the master Projects page.',badge:'Key',h:[['2026-11-18','New Activity button next to View brief (distributors and Platform Admin only): side panel with the project\\'s emails, calls, chat and meetings (activity.js).'],['2026-11-17','Project reference moved from beside the title to underneath it.'],['2026-11-17','Project reference number shown beside the project title (for ?pid= projects too).'],['2026-11-12','Samples follow the new policy: the brief\\'s Project defaults › Sample starts from the customer\\'s setting (or the company default) and shows where it came from until someone changes it; products nobody has changed follow the project setting (sample-policy.js MSSAMPLE.cfg); a product changed by hand on its Sample stage keeps its own choice. The Ready to order check uses the same rule.'],['2026-11-08','Fix: gallery card price and lead time are now copied from the product\\'s own list row, so the two views always agree (distributor sees Cost, as in the list; customer sees Est. price / Price; ideas show a dash).'],['2026-11-08','Gallery cards: price and lead time (working days) shown under the product description.'],['2026-11-05','Gallery cards: click the left or right half of the main image for the previous / next image (loops round); thumbnails sit in one sideways-scrolling row. On cards with more than one image the corner tab opens the pop-out.'],['2026-11-05','Gallery cards: images now browse like the store product page (main image + row of thumbnails, selected one outlined) instead of the swipe carousel.'],['2026-11-05','Gallery cards: Product details button removed; the pop-out\\'s pink (i) icon now sits after the product name and opens the Product details side panel.'],['2026-11-05','Gallery cards: View product page button removed; expand-to-pop-out tab added top right, same as the list rows (image counter moved bottom right).'],['2026-11-05','Gallery cards: branding now shown as the pop-out\\'s Branding summary (product colour, each position with method, print colours, size and colour dots; Edit opens Design → Branding).'],['2026-11-05','Fix: pop-out opened from the gallery had a squashed top row (it sized itself to the hidden list); it now lines up with the gallery.'],['2026-11-05','Gallery cards: product name and View product page now open the store product page in the side panel on this page (links to the Store page were losing the product and opening the store home).'],['2026-11-05','Gallery view is now a product showcase (List = action status, Gallery = the product): large scrollable images, name, store description, branding chosen, View product page + Product details (opens the pop-out). Uses the same search and filters as the list.'],['2026-10-26','Download proof opens the new Proof preview page (data passed via ms-proof-doc) instead of a hidden print frame.'],['2026-10-23','Add to basket now carries the product pop-out\\'s Additional charges (Price section) onto the basket line, so they reach the pro forma and order (they were dropped before).'],['2026-10-15','Design › Visual: Visual images moved under the Branding summary in the right column; main visual panel now a raised white card with a soft shadow.'],['2026-10-15','Design › Branding: white panel behind the step cards removed so it matches the Visual tab.'],['2026-10-15','Selected step in the pop-out top row now uses the same full-height accent edge and tint as the section heading (floating bar removed).'],['2026-10-15','Layout A chosen: the section heading in the pop-out now matches the selected step (same pink tint, accent bar, status beside the title). Comparison switcher and options B / C removed.'],['2026-10-15','Temporary comparison (pm-variants.js): three ways to link the selected step with the section below, switchable at the bottom of the pop-out. A heading matches step · B step tabs above the content (Actions column removed from the top row) · C no heading, stronger selected step. Delete the unchosen ones after review.'],['2026-10-15','Fixed: Product details panel sat behind the header; it now moves to the page body when opened and sits in front of everything.'],['2026-10-15','Product details panel now runs the full height of the window (over the header).'],['2026-10-15','Product details panel now shows the real store product page (Store.html?embed=1#product=…) in the side panel, so data and design are identical to the store. Unlinked items still get the store link picker.'],['2026-10-15','Product pop-out: \"2 suppliers\" chip removed; the grey supplier line reads \"Blank supplier + Branding supplier\". Distributors click it to set up or change the second supplier.'],['2026-10-15','Product pop-out: the title in the top row is plain text (no link colour, underline or pointer).'],['2026-10-15','Fixed: the info icon reused the modal content class, which collapsed the Design section; icon renamed.'],['2026-10-15','Product details now opens only from an info icon at the end of the product title in the pop-out\\'s top row; the Product details button, Design summary strip, Visual tab button and image/title click removed.'],['2026-10-15','Product pop-out: new Product details panel (store-listing.js) with the store listing: image gallery + zoom, colour swatches that switch the image, description, key facts, specs, branding, price breaks with the project quantity highlighted, story blocks, reviews summary, View in store, and an \"Only you see this\" distributor strip. Opens from the Product details button or the image / title in the top row; slides over the current step (Esc closes). Design shows a slim product summary strip; Visual tab info panel replaced by a Product details button. Unlinked items can be linked to a store product by the distributor. Replaces the placeholder Product information slide-out.'],['2026-10-15','Download project sheet now opens the new D01 Quote (Merchsmith Quote.dc.html); item.quote carries SKU, store details, branding and price breaks. \"Download detailed sheet\" removed from the ⋯ menu.'],['2026-10-14','Proof stage → Warnings: saved product warnings as chips, Save to the product, Manage (edit / default / delete); proofs start with the product\\'s default warnings. Warning drafts (general, purple dashed chips) available on every proof.'],['2026-09-30','Product pop-out rebuilt (product-modal.js / pm-inset.js): opens inside the page, product row across the top as a vertical action menu, Design (Branding / Visual / Proof), Price, Sample, Stock sub-tabs with status and actions on the tab row.'],['2026-09-30','Proof: three-column sheet with notes, warnings and per-position branding, full screen view, customer Approve Proof dialog with warnings, Do Not Approve with change notes, A3 PDF download (one page per visual).'],['2026-09-30','Two-supplier support: combined lead time, carriage to decorator, two quotes, two-stage sample, stock checks against the blank supplier.'],['2026-09-30','Page stability: single layout scheduler (__msLayout) replaces page-wide watchers; closeModal clears all open state.'],\n      ['2026-07-24','Customer-view Delivery date & Order by columns restyled to match the distributor tidy cells (compact date line, black dates, Standard/Critical tag, hover calendar, confirmation folded into a status marker).'],\n      ['2026-07-24','Delivery-date controls now work inside the product modal (rail cell wired to the same picker engine; calendar / Standard-Critical / supplier-request all live and sync back to the row). Fixed refresh targeting the wrong cell after the Order-by/Delivery column swap.'],\n      ['2026-07-23','Distributor Delivery Date & Order by cells redesigned into compact Sup/Cus lines with a single supplier-status marker, Critical as a left accent, hover-only calendars.'],\n      ['2026-07-09','Breakdown + Order by rows tucked behind a \"More filters\" toggle with applied-filter tokens (matches master Projects page).'],\n      ['2026-07-09','Product modal now full screen; Breakdown t of the project product view (shares the modal).',h:[\n      ['2026-07-09','Full-width layout; consistent 4:3 image areas on tiles; filter parity with the row view (Order by + Breakdown rows); full-screen modal.'],\n      ['2026-06-18','Initial build.'],\n    ]},\n    {f:'Merchsmith Create Project.html',t:'Create Project wizard',d:'Animated 5-step project setup → writes the brief, defaults and requested items. Draft autosave; theme-aware.',badge:'Flow',h:[['2026-11-17','Each new project is issued its unique reference when the brief is completed (reaching Launch), shown under the title (Project reference PRJ-10301) and saved with the brief. Numbers come from one platform counter that only goes up, so none is ever issued twice or reused.'],['2026-10-14','Opens with ?new=1 at step 1; asks before parking an unfinished draft (up to 10 drafts); autosaves, Save & exit keeps the draft.'],['2026-06-18','Initial build.']]},\n    {f:'Merchsmith Quote.dc.html',t:'Quote (D01)',d:'A3 landscape customer quote: cover (distributor logo, customer, quote no., dates, terms, summary, company/VAT numbers, accreditations), one alternating page per product with store details and price breaks, then the distributor\\'s sales literature pages.',h:[['2026-10-26','Product pages: price table always sits above the footer. Long fields are shortened with links to the store product (See full description, +N more colours / sizes / accreditations / methods / positions / notes). If details still don\\'t fit, notes then the lowest rows drop off and a More details online link appears.'],['2026-10-26','With more than 10 products the cover lists 9 before the + more products line (up to 10 still listed in full).'],['2026-10-26','Cover totals: Total ex VAT, VAT and Total inc VAT as three equal-size rows with hairline dividers and more spacing; slightly tighter gap above the cover details so 10 products still fit.'],['2026-10-26','Cover summary: VAT and Total inc VAT shown below the bold Total ex VAT, smalle
