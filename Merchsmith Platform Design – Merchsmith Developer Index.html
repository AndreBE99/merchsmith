r and regular weight.'],['2026-10-26','Price tables: Total ex VAT row now bold and larger; Total inc VAT row regular weight and smaller.'],['2026-10-26','Cover summary shows only the Total ex VAT (inc VAT total removed).'],['2026-10-26','Removed One per page, from page 2 under Products on the cover.'],['2026-10-26','Fixed: product code links now use the store product id, so they open the product (falls back to the full store listing if there is no match).'],['2026-10-26','Links: project name → project page, product SKU → store product, prepared-by and footer email → mailto, phone → tel, website and distributor logo → distributor website, accreditation logos → their website.'],['2026-10-26','Cover summary shows 10 products before the + more line; each product (and the + more line) links to its page, and the links carry through when saved as PDF.'],['2026-10-26','Many products example now has 15 items. Cover summary lists up to 10 products; with more, it shows the first 9 and a + N more products on pages X–Y line with their total, so it always fits the cover.'],['2026-10-26','Fixed: cover summary ran into the details above it with many products; tighter rows (30px thumbnails) and a fixed gap above the summary.'],['2026-10-26','Uses the distributor’s colourway whoever is viewing (was falling back to the default); product thumbnails in the cover summary; example switch in the top bar: Live project, Few products, Many products, Long details (?ex=few|many|long).'],['2026-10-15','Page created. Cover panel in the distributor primary colour with the logo top right; prepared-by avatar; product pages with quoted-branding box over the image, additional charges as table rows, centred footer; opened from Project → Download project sheet; #print=1 auto-prints.']]},\n    {f:'Merchsmith Project Sheet.html',t:'Project Sheet',d:'Printable one-page project summary (used by the Download PDF actions).',h:[['2026-10-15','Superseded by Merchsmith Quote.dc.html (D01); kept as the previous version.'],['2026-06-22','Initial build.']]},\n    {f:'Merchsmith Project Sheet (Detailed).html',t:'Project Sheet (Detailed)',d:'Extended printable project summary with per-product detail.',h:[['2026-10-15','Retired: no longer linked from the platform (D02 removed).'],['2026-06-22','Initial build.']]},\n  ]},\n  {id:'admin',name:'Platform Admin',cls:'t-admin',sub:'Merchsmith operator console',pages:[\n    {f:'Merchsmith Users.html',t:'Users',d:'Every user across organisations with profile panel, notes, comments and history, flags, contact actions and account manager.',h:[['2026-11-12','Top bar and filters now use the same classes as Organisations › Customers (.toolbar .search, .ot-view, .btn.ghost, .ot-filters), so the platform polish styles them identically: 40px search box, 36px filter dropdowns, matching Add user button; People / Audit log switch gets icons like Table / Map.'],['2026-11-12','Restyled to match Organisations › Customers / Suppliers: summary boxes removed; one top bar with a full-width search, a People / Audit log switch styled like Table / Map, and + Add user as an outlined button like + Add customer; filters on the row below. Embedded, the page sits on the grey page background with no white card.'],['2026-11-12','+ Add user button (distributor and Platform Admin): choose the organisation (your team, a customer or a supplier) and team, then the shared person form (MSPEOPLE.userForm → addUser). The person is invited, appears in the list straight away and in the audit log. Also shows on Organisations › Users.'],['2026-11-12','New ?embed=1 mode (hides header, left menu, breadcrumb band and page title) so the page can sit inside Organisations › Users.'],['2026-09-30','Added to the index. Built Sep 2026.']]},\n    {f:'Merchsmith Recommended Standard.html',t:'Recommended — selection standard',d:'How Merchsmith chooses Recommended and Featured products: the five criteria, the six-step process, the two tiers and the placement terms.',h:[['2026-09-21','Initial build — criteria, process, tiers, terms, plus the not-yet-charging notice.']]},\n    {f:'Merchsmith Supplier Portal.html',t:'Supplier portal',d:'The supplier\\'s own view: every ingested product and its placement, the approval queue, dated placement history, and monthly Stripe Direct Debit billing.',badge:'New',h:[['2026-10-23','Supplier view lists one PO per product and one invoice upload per PO.'],['2026-10-14','Sees additional POs sent to them in their documents.'],['2026-09-30','Decorating & goods in profile (two-supplier), blank stock and incoming stock panels, blank-supplier-only order view.'],['2026-09-21','Moved into the supplier app shell (header + left rail, hash-routed sections); products table restyled to match the admin product database; billing relocated under Finance; whole-month billing model.'],['2026-09-21','Initial build — products / approvals / history / billing tabs, Direct Debit mandate setup.']]},\n    {f:'Merchsmith Admin.html',t:'Admin console',d:'Operator hub: distributors, suppliers (add/invite + field mapping), the master product database, recommended range + supplier invoicing, and store layout (sections/departments/sub-categories).',badge:'Key',h:[['2026-11-18','Ghost now needs the distributor\\'s approval (ghost-access.js): request with reason, note, duration and whether calls and emails are needed; status, prototype approve/decline, Enter ghost mode once approved, End access, audit log. Ghost opens the distributor\\'s pages in this tab with a ghost bar and Exit (admin-page.js v49).'],['2026-11-17','Distributor drawer › Subscription & billing: Onboarding fee row gains View invoice, and a new Latest invoice row (number, date, amount, status) opens that invoice in the in-page viewer.'],['2026-11-17','Distributor drawer › Subscription & billing gains a VAT switch (Platform Admin only): Charged at 20% or Not charged, with a reason (Reverse charge, Outside the scope of UK VAT, Zero-rated, VAT exempt). Default: charged for UK distributors, not charged elsewhere. Stored in ms-dist-vat (billing.js v6: MSBILL.vatOf / setVat). Applies to next payment, every invoice and the onboarding fee.'],['2026-11-17','One-off £750 + VAT onboarding fee for distributors, non-refundable (ADMIN.onboardingFee in admin-data.js v9). Invite distributor wizard shows it on the Plan and Review steps (dist-invite.js v10); the distributor drawer shows Onboarding fee · paid on their join date, or due when they sign up for invited ones (billing.js v4); Total revenue includes it (admin-page.js v48).'],['2026-11-17','Supplier import (feed-adapters.js v10): PF Concept imports now keep stock per colour — quantity, quantity on order and due date — instead of only a combined total. Fixed: PF Concept imports with a price feed crashed on a line copied from the Xoopar importer. Products imported before this need re-importing to get colour stock.'],['2026-11-17','Sustainability flyout and side menu gain Rules page (Sustainability › Rules page).'],['2026-11-17','Dashboard: Sustainability card under Recent activity / Plan mix: platform average score, supplier changes to review, % complete evidence, sales rated Good or better (last 12 months, with change); action is the review queue first, then certifications without a logo; admin goals in progress. Links into Sustainability (?scope=platform).'],['2026-11-17','Product database drawer: new Sustainability section (score, evidence, where the data came from, a change in review, pillar bars) with Edit sustainability data. Platform Admin edits save straight away with history and can be reverted to the supplier feed. Sustainability flyout gains Progress over time, Products and Review.'],['2026-11-17','Sustainability rail icon uses the Evermerch symbol; flyout gains Certifications.'],['2026-11-17','New Sustainability item in the left rail (after Team) with a flyout: Platform overview, Data quality, Scoring rules, Default design. Opens Merchsmith Sustainability.html?scope=platform.'],['2026-10-30','New Settings tab Payment marks: card logo library (upload/replace/clear logo, name, height, add/remove, reset) used by every store footer.'],['2026-10-15','Header search uses the platform search (distributors, suppliers, products, people, all projects and orders).'],['2026-10-14','Dashboard: \"Orders across the platform\" and \"Subscription finance\" sections (shared dashboard engine).'],\n      ['2026-09-23','Distributor and supplier drawers show their people (invite, edit, deactivate, manage teams) and can be edited (name, domain, address, logo, region, lead time).'],\n      ['2026-09-23','Users panel: every person across every organisation with filters and editing, plus the platform-wide audit log.'],\n      ['2026-09-23','Merchsmith team cards editable (avatar, role, deactivate); Mojo seats now come from its real users.'],\n      ['2026-09-22','Product notes, team comments and a merged change-history feed added to the product drawer (shared product-notes.js, also used by the distributor preview pane). Org-private by design; @mentions supported.'],\n      ['2026-09-21','Manage Tags added to the Product database: admin-owned tag list (many per product), tag filter with counts, Tags column, chip picker in the product drawer and a bulk apply/remove-tag action. Bulk action bar now wraps instead of overflowing the page.'],\n      ['2026-09-21','Recommended/Featured placement is free for MVP: the whole fee model stays built but dormant. Phase 2 banner on Commercial overview and Tier management (not on Change log), money tiles relabelled as projections, \"Suppliers paying\" → \"Suppliers in range\", invoicing marked projected/not charged. Supplier portal and the Recommended Standard page reworded to match.'],\n      ['2026-09-21','Trial accounts removed as a concept: status, directory filter, status badge, activity kind, the self-serve-trial platform setting and the \"Trials ending\" dashboard KPI all gone. Limelight Gifts is now an active Starter account, new invites are created active, and platform MRR rises to £6,880 accordingly.'],\n      ['2026-09-21','Subscriptions moved to a hybrid tier + seat-overage model: every plan now includes the full platform (shared \"Included on every plan\" panel), cards show only base price / included seats / per-seat rate, and Seats, Base and Overage columns added to the plans and distributor tables. Distributor drawer gained a seat-usage readout; MRR is now derived as base + overage rather than a flat plan price.'],\n      ['2026-09-21','Left-rail icons unified across all four roles: Overview renamed Dashboard with the shared bar-chart mark, Distributors moved off the storefront glyph to the organisations building, Suppliers off the cube (which Projects already used elsewhere) to a delivery truck, and Products standardised on the tag.'],\n      ['2026-09-21','Recommended-range lifecycle: supplier approval before a placement goes live, dated add/tier/remove history with a change log tab, and a one-month minimum charge carried on removals.'],\n      ['2026-09-21','Placement pricing reworked: one monthly fee per product (Recommended £5, Featured £60) from globally-editable tier rates, with a per-product override and a clear-all; the old listing+promotion fee pair retired and migrated away. Listable chip now opens a breakdown popover instead of applying a filter that selected everything.'],\n      ['2026-09-21','Recommended range: \"Curated\" renamed to \"Recommended\" across every user-facing label (internal keys unchanged); Spotlight tier retired with a migration folding it into Featured, incl. the store\\'s Spotlight homepage section; per-product List/Promo charge fields added to the range panel; data-health panel condensed to a chip in the Views row; superfluous \"imported\" tag removed from product cards.'],\n      ['2026-09-21','Slim blossom footer bar added: company number, copyright, platform terms / operator privacy / support and build version. Pinned beside the rail (left:68px) and aligned to the sign-out divider via a shared --adm-footh; rail foot made sticky so it can no longer fall below the fold, and the identity switcher + chat button lifted clear.'],\n      ['2026-09-20','Personality pass: a single extreme close-up of the multi-colour outlined wordmark fills the Overview background (brand guide §05 method — height-sized, never tiled), and the headline figures jump to 38–52px EB Garamond with small-caps labels beneath. \"All clear\" empty state uses the same artwork.'],\n      ['2026-09-20','Left rail tried in blossom: ink icons on the pink tint, white chip for the active section with an ink edge marker, translucent-white hover.'],\n      ['2026-09-20','Icon sprite fixed to the project convention — presentation attributes baked onto all 19 symbols, so grid/card/layout icons stop rendering as solid black blocks in screenshots and PDFs. Same omission swept across 11 other pages (75 more symbols).'],\n      ['2026-09-20','Top bar and primary buttons are periwinkle #7B85C5 with white text, matching styles.css .btn--primary and the Brand Guide. Scoped to the admin console only — the distributor keeps its themed periwinkle-deep bar.'],\n      ['2026-09-20','Primary buttons now spearmint with ink labels; blossom brought in on the Trial/Invited pills, the Starter plan bar and a stat accent.'],\n      ['2026-09-20','Top bar switched to the shared chrome.js header rather than a hand-built copy, so it matches the distributor view by construction: periwinkle-deep, centred 440px search, notifications + avatar chip. Store footer suppressed in the console.'],\n      ['2026-09-20','Top bar now matches the distributor header exactly (194px pill search in the right-hand tool cluster, avatar chip with photo + name + chevron, same responsive collapse); white text and wordmark on periwinkle. Overview gradient hero removed — panel opens on a standard title + stat cards.'],\n      ['2026-09-20','Top bar rebuilt to match the distributor header: periwinkle background, brand wordmark top left, centred pill search, avatar chip with photo top right. Dark ink throughout — periwinkle is too light to host white text (3.50:1 vs 5.43:1).'],\n      ['2026-09-20','Fixed the overview hero CTA stretching the full width: .btn defaulted to width:100%, so any bare .btn filled its container. Now content-width by default, full-width only in the login form.'],\n      ['2026-09-20','Top bar reduced to the wordmark alone; brand palette brought in from Brand Assets (hero gradient periwinkle-ink → sky, a colour per stat card, spearmint revenue line, sky/spearmint plan mix); nav icons de-duplicated — Products, Store layout and Curated range now have their own marks instead of sharing Overview\\'s grid.'],\n      ['2026-09-20','Panels now full-width and left-aligned (was capped at 1600px), matching the distributor pages.'],\n      ['2026-09-20','Width tiers applied: panel cap raised 1180→1600px with fluid padding.'],\n      ['2026-09-20','Adopted the platform navigation: full-width top bar (Merchsmith lockup + Platform Admin tag, global search, store preview, operator avatar) and the 68px hover rail with flyouts, replacing the 248px dark labelled sidebar. Operator card and sign-out moved into the bar/rail foot.'],\n      ['2026-09-17','Product database overhauled: gallery view (6 across, now the default), 72px table thumbnails with hover-to-enlarge, data-completeness dots + sortable Data column, saved views (6 presets + your own), prev/next stepping in the product drawer, selection review tray, group by supplier/department, keyboard triage (J/K/Space/C/Enter).'],\n      ['2026-06-29','Curated Range page given real purpose: promoted products (Spotlight / Featured) driving store placement by range mode.'],\n      ['2026-06-27','Product database refined: pagination, working select-all, pinned headers, square thumbnails, bulk add/remove to Curated Range and Departments.'],\n      ['2026-06-25','Real supplier feeds imported; seed suppliers/products removed; images-only view.'],\n    ]},\n    {f:'Merchsmith Organisations.html',t:'Organisations',d:'Org records — distributors, customers, suppliers and their relationships.',h:[['2026-11-18','Activity timeline (activity.js) on customer and supplier panels and person profiles: emails, calls, chat and meetings with filters; open an email to read it, see attachments and opens, and reply (from your connected mailbox or through Merchsmith); private emails show as Private email from … with Open as admin (audit-logged); content hidden in a Merchsmith support session without calls-and-emails permission (org-page.js v53).'],['2026-11-17','Invite wizard: onboarding fee wording now reads + VAT where it applies.'],['2026-11-17','Invite distributor wizard shows the one-off £750 + VAT onboarding fee (non-refundable) on the Plan and Review steps.'],['2026-11-12','New Admin access section on each customer (admin-access.js): lists the customer\\'s Admins and when they last signed in, warns when there is only one Admin, no active Admin, or the only Admin hasn\\'t signed in for 60+ days; the customer card shows a red flag for the last two. New Recover admin access action for the account manager: pick an existing user or invite someone new (email must be on the customer\\'s own domain), record how the request was confirmed and who confirmed it, choose a second approver at Mojo, then the current Admin is notified with 48 hours to object. On completion the new Admin is made (or invited and sets their own password) and the old Admin is deactivated, not deleted. Every step is written to the audit log. Prototype buttons simulate the 48 hours passing or an objection. Stored in ms-admin-recovery.'],['2026-11-12','Fix: first opening of the Users tab could flash the embedded page\\'s header. The embedded page now stays invisible until it has finished drawing (msRevealFrame), then fades in.'],['2026-11-12','Users tab gains + Add user (from the embedded Users page).'],['2026-11-12','New Users tab after Customers and Suppliers (the Users page embedded via Merchsmith Users.html?embed=1, loaded the first time the tab opens; #tab=users deep links). Tabs now match the left menu\\'s Organisations group.'],['2026-10-23','Customer VAT number added: Edit terms field, shown in Trading terms, printed on invoices.'],['2026-10-15','Customer and supplier search boxes now filter the list (were unwired), with a \"Search everywhere\" empty state.'],['2026-10-15','Customer drawer: new Trading terms section with Edit terms (payment terms, credit, VAT, PO, note). More credit or new on-account terms go to Finance; less credit/upfront terms apply straight away. ms-cust-account is now the one terms record (synced to the drawer + Customers table).'],['2026-10-15','Add customer → Terms step pre-fills from Settings → Customer defaults; approval only needed above the defaults.'],['2026-10-15','Edit organisation: Main contact is now a picker (team member, existing contact, or add a new contact with optional team invite).'],\n      ['2026-09-23','Citrix added as a customer; recorded activity on profiles; duplicate-email check.'],\n      ['2026-09-23','Users and organisations editable and saved: edit user with avatar upload, deactivate/reactivate, invite, manage teams, org details and logo upload.'],\n      ['2026-09-20','Width tiers applied: full-bleed content area (was capped 1080–1320px), now uses the full window and reflows with it.'],['2026-06-15','Initial build.']]},\n    {f:'Merchsmith Accept Invite.html',t:'Accept invitation',d:'What an invited person sees: confirm details, add a photo, set a password.',h:[['2026-09-23','Initial build.']]},\n    {f:'Merchsmith Profile.html',t:'My profile',d:'The signed-in person own profile: photo, details, notifications and security preferences.',h:[['2026-09-23','Initial build, linked from the header avatar menu.']]},\n    {f:'Merchsmith Team.html',t:'Team',d:'Users within an organisation and their roles.',h:[['2026-11-12','Fix: in the Customer view, Sara Kemp (role label Brand Admin) wasn\\'t recognised as an Admin, so Edit member, Add and role changes were hidden. people.js now treats Brand Admin as Admin.'],['2026-11-12','Customer Team page shows a warning when the organisation has only one Admin, no active Admin, or its only Admin hasn\\'t signed in for 60+ days, with an Add a second Admin button (opens the invite form) for people who can manage the team.'],['2026-11-12','New ?embed=1 mode (hides header, left menu, breadcrumb band and page title) so the page can sit inside Distributor Settings › Your team.'],\n      ['2026-09-23','Reads the single people seed; supplier mode; role and status filters; recorded activity; duplicate-email check; empty states.'],\n      ['2026-09-23','Team members editable and saved via the shared people store; five billable roles; deactivate instead of remove; Manage teams; live seat count recorded for billing.'],\n      ['2026-09-20','Width tiers applied: full-bleed content area (was capped 1080–1320px), now uses the full window and reflows with it.'],['2026-06-15','Initial build.']]},\n  ]},\n  {id:'settings',name:'Settings',cls:'t-settings',sub:'Per-org configuration',pages:[\n    {f:'Merchsmith Notifications.html',t:'Notifications',d:'Bell dropdown, pop-ups, full inbox with filters, per-event settings grid, quiet hours, daily digest, muting, admin announcements and the announcement bar.',h:[['2026-11-12','Distributor Announcement bar tab moved to Distributor Settings › Store › Announcement bar; this page keeps Inbox and Settings (Platform Admin keeps Announcements & bar).'],['2026-09-30','Added to the index. Built Sep 2026.']]},\n    {f:'Merchsmith Distributor Settings.html',t:'Distributor Settings',d:'Lead times, markup/pricing, discounts, branding, and the Store range (curated / curated±edits / bespoke).',h:[['2026-11-17','Billing invoice View buttons open the in-page invoice viewer; Next payment gains Preview invoice. Subscription tab links to the latest invoice, the onboarding fee invoice and All invoices (Billing › Subscription).'],['2026-11-17','Billing and Subscription follow the VAT setting Platform Admin chose for the distributor (VAT 20% or VAT not charged); distributors can\\u2019t change it.'],['2026-11-17','Billing invoices open the new Merchsmith tax invoice PDF (subinv-doc.js) for both monthly subscription and onboarding fee invoices. Mojo Promotions now has a billing address for the Bill to block (admin-data.js v10).'],['2026-11-17','Subscription tab notes the one-off £750 + VAT onboarding fee paid at sign-up (non-refundable). Billing invoices list includes the onboarding fee invoice (MS-ONB-…), marked Onboarding fee; the printable invoice says it is non-refundable.'],['2026-11-17','Pages list shows Merchsmith-managed platform pages (How products are scored) as Managed by Merchsmith with View only. Environmental footprint editor gains an Evermerch scoring switch that adds a How we score product sustainability block linking to the rules page.'],['2026-11-12','New Operations › Samples tab: company default (Required / Not needed) for whether a sample must be approved before a product can move to Ready to order, plus a per-customer override (Company default / Required / Not needed). Stored by sample-policy.js (ms-sample-policy).'],['2026-11-12','Same no-flash loading for the Your team tab (msRevealFrame).'],['2026-11-12','Settings tabs now match the left menu\\'s Settings panel in order, grouping and names: ORGANISATION (Organisation profile, Domain, Subscription, Bank details, Your team) then OPERATIONS (Lead times, Customer defaults, Purchasing terms, Sales literature, Warning drafts). New Bank details tab (finance-invoices.js MSFIN.panel(…,\"bank\") without Finance\\'s sub-tabs) and Your team tab (Team page embedded via Merchsmith Team.html?embed=1). With no #tab the page opens on Organisation profile; breadcrumb reads Settings › group › tab.'],['2026-11-12','Announcement bar is now a Store › Storefront tab on this page (it used to open the Notifications page). notifications.js mount(root,{only:\"bar\"}) draws just the bar editor.'],['2026-11-12','Store tabs: the MANAGE and STOREFRONT group names now sit above their tabs, each with a thin rule spanning its group, so they read as headings rather than tabs.'],['2026-11-12','Store settings tabs now match the left menu\\'s Store panel in order, grouping and names: MANAGE (Product range, Markup & pricing, Discounts, Search insights) then STOREFRONT (Appearance, Homepage, Pages, Footer, Branding, Announcement bar, which opens Notifications › Announcement bar). Product range, Pages, Footer and Branding moved here from the Settings tab bar; \"Store appearance\" renamed Appearance; breadcrumb reads Store › Manage/Storefront › tab.'],['2026-10-30','Footer → Accreditations: emblem picker and qualifier field removed; crop tool for uploaded logos; per-logo colour (Original / Mono white / Mono black). Payment card list and logos now come from Platform Admin → Payment marks.'],['2026-10-26','Footer → Accreditations: new link field per logo (used in the website footer and on documents).'],['2026-10-24','New Purchasing terms tab: switch the PO terms on or off, edit, reorder, remove or add terms, reset to the Merchsmith defaults (po-terms.js).'],['2026-10-15','Lead times: new Split deliveries card (default cost per extra address, markup, price-on-request cap).'],['2026-10-15','New Store settings tab: Search insights (top searches, searches with no results, no clicks; 30/90 days; customers / everyone; Find in catalogue).'],['2026-10-15','New tabs: Sales literature (A3 pages appended to quotes) and Customer defaults (default terms for new customers, with history).'],['2026-10-15','Branding → Logos now holds every logo: square logo (moved from Organisation profile), favicon (new, applied on distributor + customer pages), header and PDF. Organisation profile shows a read-only logo strip linking to Branding.'],['2026-10-15','Organisation profile: Main contact chosen from the team or added as a new contact.'],['2026-10-14','Warning drafts tab: general proof warnings for every proof, add / edit / delete with change history.'],['2026-09-30','Finance → Billing & payments now has sub-tabs: Subscription, Customer invoices (bank details shown to customers, payment reference, instructions, bank transfer payment window, invoice + credit note register) and Supplier invoices (every PO with its invoice status). finance-invoices.js.'],['2026-09-30','Store settings sub-tabs: Homepage, Markup & pricing, Discounts, Store appearance. Discount codes (promo-codes.js). Customer payments card: BACS payment window (default 4 hours).'],\n      ['2026-09-22','Product range preview pane gained notes, team comments and change history (org-private, shared with Platform Admin via product-notes.js).'],\n      ['2026-09-21','Merchsmith platform tags hidden in fully-bespoke mode (no baseline, so the labels don\\'t apply); badge contrast raised across the range pills — distributor tags, Recommended badge and connected-supplier pill were 3.67–3.83:1 on the pink colourway, now 6.1–6.7:1.'],\n      ['2026-09-21','Store range gains tagging: the distributor manages their own tag list (Merchsmith\\'s platform tags stay read-only), with a grouped tag filter, Tags column and gallery chips, a per-product tag popover and a bulk apply/remove action.'],\n      ['2026-09-21','Store range table now shows sub-category (read-only, from the store taxonomy) in place of department, with sub-category filter chips and sorting.'],\n      ['2026-09-21','Store range rebuilt on the Platform Admin product-database table: same search / supplier select / chip filters / sort / select-all / bulk actions / load-more, re-scoped to suppliers the distributor has an approved relationship with. Department is a read-only tag, per-product add/remove toggles inclusion, and a supplier strip shows which suppliers are connected.'],\n      ['2026-09-21','New Subscription tab: current plan, seats used vs included, overage being billed, what counts as a billable seat, and a tier comparison at the distributor\\'s current team size.'],\n      ['2026-09-20','Now full-width and left-aligned, matching Chats (was a 1040px centred column) — one page format across the app.'],\n      ['2026-09-20','Fixed silent data loss in Settings → Footer: the card editor still worked in plain strings after the payment marks became objects, so every save wrote an empty card list and the Visa/Mastercard/Amex logos disappeared. Editor is now object-aware and the merge restores defaults from an already-damaged config.'],\n      ['2026-09-20','Footer now has a single width on every page — no cap, sharing the page gutter. Replaces both the old 1280px centred block and the short-lived per-page --page-max matching.'],\n      ['2026-09-20','Content width no longer shifts between tabs — `margin:0 auto` in a column-flex parent was sizing .main to its content. Pinned to a single 1040px reading cap.'],\n      ['2026-09-18','Card payment marks: supplied Visa/Mastercard/Amex artwork converted to white-on-transparent and split into individual files (assets/pay-*.png), replacing the text chips. Mastercard keeps a visible overlap seam; Amex lettering is knocked out of the box.'],\n      ['2026-09-18','Real accreditation logos in: supplied black artwork converted to white-on-transparent and trimmed (assets/accred-0*.png), placeholder emblems retired as the default, Mojo wordmark replaced by the real logo. Ecologi/climate-positive collapsed to one entry since the supplied lockup covers both.'],\n      ['2026-09-18','Footer rebuilt on the brand-led editorial arrangement (option C): display “Let’s Talk.” hero, newsletter on its own band, accreditation/social strip, hairline bottom rule.'],\n      ['2026-09-18','Footer panel rebuilt for the new footer (link columns, newsletter, contact, marketing-site link, accreditation logo uploads, socials, payment marks, legal row, powered-by toggle). New Pages panel edits the 11 content pages on their type templates.'],\n      ['2026-06-29','Store range rule: any curated mode shows Merchsmith promoted products; fully bespoke opts out.'],\n      ['2026-06-16','Initial build.'],\n    ]},\n\n    {f:'Merchsmith Sidebar Concept - Hover Rail.html',t:'Sidebar concept — hover rail',d:'Alternative navigation: a permanently narrow icon rail where every section opens a flyout panel on hover. Built for comparison against the current collapsible menu.',h:[['2026-11-17','Sustainability menu added for Customers (hidden when the distributor turns scores off) and Suppliers; distributor and Platform Admin menus gain Progress over time, and admin gains Products and Review.'],['2026-11-17','Sustainability icon is now the supplied Evermerch symbol (distributor rail, Platform Admin rail and the admin console). Admin Sustainability flyout gains Certifications.'],['2026-11-17','Distributor: new Sustainability item (placeholder tree icon until the Evermerch icon arrives) before Settings: Go to Sustainability, Overview, Your range, Projects & orders, Pillars, Settings. Platform Admin rail outside the console also gets Sustainability, and the Sustainability page uses the admin header and rail.'],['2026-11-12','Customer Store menu: removed Browse store (it duplicated Go to Store). Go to Store is now at the top, followed by Quick links: All products, Best sellers, New in, Eco picks, Fastest delivery, Shop by category, and Basket with the number of lines in it.'],['2026-11-12','Customer Settings menu: Your team now opens Customer Settings #tab=team instead of the separate Team page. All customer-view menu links checked: each opens the right page and tab.'],['2026-11-12','Settings menu: Samples added under Operations.'],['2026-11-12','Left menus: the section link (\"Go to …\" / \"All … →\") now sits at the top of each panel, at the same 14px size as the menu items (was 12px at the bottom); + actions stay at the bottom.'],['2026-11-12','Organisations menu: an Organisations group (Customers, Suppliers, Users) named and ordered like the page\\'s tabs; Users now opens the Organisations › Users tab.'],['2026-11-12','Settings menu: two groups like the Store menu (Organisation, Operations); Customer defaults, Purchasing terms and Sales literature added; Bank details and Your team now open their Distributor Settings tabs.'],['2026-11-12','Store › Announcement bar now opens the Distributor Settings tab instead of the Notifications page.'],['2026-11-12','Left-menu group headings (Manage, Storefront, Setup, Show, Organisation, Operations) now read as labels, not links: smaller and quieter, more space above, and their items indented beneath them with a faint guide line.'],['2026-11-12','Store menu: Browse store removed from the top (the menu opens straight on Manage); Go to Store → reinstated at the bottom under + Add products. Panels with no top list now start at their first group.'],['2026-11-12','Store menu: \"Go to Store →\" removed (it opened the same page as Browse store); + Add products added as the action, opening Store › Manage › Product range.'],['2026-11-12','Store menu: Search insights added under Manage, so the menu and the Store settings tabs list the same items in the same order.'],['2026-11-12','Fix: in the design editor, a left-menu link to a tab on the page you are already on (e.g. Store › Markup & pricing while on Distributor Settings) did nothing, because the editor treats #tab=… as a scroll-to-section. The menu now switches the tab itself (sets the hash and fires hashchange), acting on mouseup since the editor claims the click; menu actions (ms-do) also run on the same page.'],['2026-11-12','Fix: in the design editor, left-menu links that open a tab or section (e.g. Store › Markup & pricing) landed on the page\\'s default tab, because the editor drops the #… part when it opens another page. The menu now remembers the link\\'s #… / ?… as it is clicked and the opened page puts it back before its own scripts run (ms-nav-carry in sidebar.js).'],['2026-11-12','Every left-menu link checked for each role (distributor, customer, supplier, Platform Admin): each opens the right page and tab, and each action (Add customer, Add supplier, New meeting, Make a call, New email, New conversation, order filters) opens what it says.'],['2026-11-12','All left-menu panels follow one pattern (sidebar.js): the things you open first, then a divider, then + actions and an \"All … →\" link. Lists are live: Needs attention (Dashboard), recent orders with Needs action / In production / Dispatched filters, recent customers, recent conversations (unread first), next 3 meetings, recent calls (missed first). Store gains Manage + Storefront groups (Footer, Pages, Branding, Announcement bar moved from Settings); Users folded into Organisations; Team moved to Settings; Subscription and Bank details moved from Finance to Settings; supplier Distributors icon and dead Finance › Invoices link removed; single-link menus show one compact line. New #ms-do=<selector or button text> deep link clicks / focuses an element once the page has drawn it.'],['2026-11-11','Projects menu: Recent Projects (up to 6), then + Create Project and All Projects →.'],\n      ['2026-09-20','Adopted: the hover rail is now the platform-wide navigation (sidebar.js rewritten). This page kept as the rationale.'],\n      ['2026-09-20','Initial build — 68px rail, hover/focus flyouts with counts, active marker on the rail edge, hover bridge + open delay, tap fallback for touch.'],\n    ]},\n    {f:'Merchsmith Page.html?p=about',t:'Content pages',d:'The distributor\\'s own footer-linked pages — one renderer, four section templates (editorial, legal, FAQ, contact) across 11 pages. Editable in Settings → Pages.',h:[\n      ['2026-09-20','Now full-width and left-aligned, in line with the rest of the app (was a 1080px centred column).'],\n      ['2026-09-18','Put in the real store chrome: header with identity lockup and basket/search/account tools, the shared left sidebar, and a Store › Section › Page breadcrumb band — replacing the standalone wordmark + “back to store” stub bar.'],\n      ['2026-09-18','Initial build — 11 pages (About us, Environmental footprint, Value chain, People & culture, FAQ, Terms, Privacy, Returns, Contact us, Cookie policy, Accessibility) on four sectioned templates. Legal pages ship as scaffolding with no invented wording.'],\n    ]},\n    {f:'Footer Option A.html',t:'Footer options (A/B/C)',d:'Three footer directions shown side by side before the rebuild. C was chosen.',h:[['2026-09-18','C chosen and built into the live footer.'],['2026-09-18','Built as options: A full marketing, B compact utility, C brand-led editorial.']]},    {f:'Merchsmith Customer Settings.html',t:'Customer Settings',d:'Customer-side preferences and account configuration.',h:[['2026-11-12','Customer view: new Your team tab after Account, so the tabs match the Settings menu (Organisation profile, Platform logos, Account, Your team). It embeds the Team page (?embed=1), loaded the first time the tab opens and faded in once ready. Deep link #tab=team.'],['2026-10-15','Trading terms now read-only for everyone; distributors get \"Edit in Organisations\".'],['2026-09-30','Invoice contact on the organisation; On account payment terms now set PO number only or PO number + PO upload.'],\n      ['2026-09-20','Now full-width and left-aligned, matching Chats (was a 1040px centred column).'],\n      ['2026-09-20','Content width pinned to a single 1040px reading cap (was 860px and content-dependent).'],['2026-06-16','Initial build.']]},\n  ]},\n  {id:'ref',name:'Reference / specs',cls:'t-ref',sub:'Living documentation',pages:[\n    {f:'Merchsmith Statement of Account Preview.html',t:'Statement of account preview (D21)',d:'Customer statement on the shared A4 design: account details, running-balance ledger of invoices, payments and credit notes, ageing, balance due, how to pay. Switch: live account, overdue & part paid, all paid, long history.',h:[['2026-10-26','Fixed: credits column heading ran into Balance; heading shortened to Credits (£) and columns rebalanced. Example switch wraps inside its own bar on narrow screens.'],['2026-10-26','Page created.']]},\n    {f:'Merchsmith Remittance Advice Preview.html',t:'Remittance advice preview (D23)',d:'Supplier remittance on the shared A4 design: paid to / paid into, invoices paid with credits deducted, amount paid, payment reference. Switch: live payment, one invoice, with a credit, payment run.',h:[['2026-10-26','Fixed: credits column heading ran into Balance; heading shortened to Credits (£) and columns rebalanced. Example switch wraps inside its own bar on narrow screens.'],['2026-10-26','Page created.']]},\n    {f:'Merchsmith Delivery Note Preview.html',t:'Delivery note preview (D11)',d:'Sample-data preview of the customer delivery note on the shared A4 design, with a switch: single delivery, split delivery (1, 2 and 3 of 3) and samples. ?print=1 opens the print dialog.',h:[['2026-10-26','Delivery instructions moved to line up with the middle column (Dispatch date / Courier).'],['2026-10-26','Delivery instructions now line up with the third column of the reference strip (Our order ref / Tracking no.).'],['2026-10-26','Removed the received-by / signature / date lines.'],['2026-10-26','Removed the Customer contact column (and project); Deliver to and Delivery instructions now share the row.'],['2026-10-26','Fixed: item details (project, branding, colours) were hidden by the price-column rule; prices are now removed from the column layout only.'],['2026-10-26','Page created.']]},\n    {f:'Merchsmith Proof Preview.html',t:'Proof preview (D03)',d:'The A3 landscape product proof as a page, like the Quote: top bar with Back and Save as PDF / Print, example switch (live product, one position, several positions). Rendered by proof-doc.js.',h:[['2026-11-18','Example switch (Live product / One position / Several positions) now works inside the design viewer: it re-renders in the page instead of reloading with ?ex=, which the viewer dropped; the choice is kept as #ex= in the address.'],['2026-10-26','Page indicator redesigned: small pink caps PAGE 1 / 2 with page dots, under the version line (was a solid pink block).'],['2026-10-26','Fixed: with 3+ branding positions the cards are compact (colours in two columns) so the last one is no longer cut off; the Please read list is a fixed two-column grid so nothing clips on screen.'],['2026-10-26','Page created. The product pop-out Download proof button and the PDF documents link now open this page.']]},\n    {f:'Merchsmith Purchase Order Preview.html',t:'Purchase order preview',d:'Sample-data preview of the supplier purchase order (D09): two items, split delivery, warnings, conditions.',h:[['2026-10-26','Added Blank stock PO (?ex=blank) and Additional PO (?ex=additional) examples and ?print=1 auto-print.'],['2026-10-24','Purchasing terms intro now references the standard Terms & Conditions.'],['2026-10-24','Print colours in each branding position show colour swatches, matching the item colour rows.'],['2026-10-24','Removed the pink left edge from the purchasing term cards.'],['2026-10-24','Last page now starts with Next steps, then Our purchasing terms; term numbers are small grey figures instead of pink circles.'],['2026-10-24','Colour row always shown under the item, including single-colour orders.'],['2026-10-24','Three switchable examples: 1 split delivery (3 colours, 3 addresses), 2 simple (one colour, one address, one position), 3 complex (two-supplier branding, repeat, no fail, 5 colours, 4 positions, 4 addresses, long instructions).'],['2026-10-24','Removed the sample-matching term from the default purchasing terms (three defaults now).'],['2026-10-24','More breathing room on the terms page: purchasing terms intro and cards, and Next steps heading, panel and steps.'],['2026-10-24','Every delivery address leads with the recipient name (address label after it); a missing recipient shows Recipient name needed in red.'],['2026-10-24','Stock note removed from the product line (per-colour stock stays).'],['2026-10-24','Next steps has its own serif heading above the panel, matching Our purchasing terms.'],['2026-10-24','Branding label shortened to Print cols.'],['2026-10-24','Removed the hairline border around the product thumbnail.'],['2026-10-24','No fail pill in the brand colour instead of red.'],['2026-10-24','Removed the See the next page for our purchasing terms line.'],['2026-10-24','Doubled the gap above the Continued on page pill.'],['2026-10-24','Continued on page pill now sits directly under the page content (centred) instead of above the footer.'],['2026-10-24','Terms page reads from Settings → Purchasing terms.'],['2026-10-24','Purchasing terms now come before Your next steps (next steps close the document).'],['2026-10-24','Delivery addresses stacked one line per address line.'],['2026-10-24','More space between the Continued pill and the footer.'],['2026-10-24','Continued on page pill centred.'],['2026-10-24','Continued on page X of Y pill bottom right of every page except the last.'],['2026-10-24','A little more space above and below the reference strip.'],['2026-10-24','Branding position panels use the distributor paper tint (#F4F5F8).'],['2026-10-24','More vertical space: bigger gaps between sections, hairline under each section heading, roomier rows, position panels, delivery cards, warning bars and next steps.'],['2026-10-24','Delivery address tag reads No fail instead of Critical.'],['2026-10-24','Branding position panels size to the number of positions: 1 full width, 2 halves, 3 or more thirds.'],['2026-10-24','PO no. removed from the reference strip (it\\'s already in the header).'],['2026-10-24','Item column heading left-aligned with the thumbnail, in the brand colour.'],['2026-10-24','Instructions moved above Product details.'],['2026-10-24','Must match the sample is now a standard Sample row in Product details (no longer a highlighted bar). Other warnings stay as bars.'],['2026-10-23','Artwork thumbnail removed from each branding position (file name only).'],['2026-10-23','Stock moved to its own column in the price table (product line + per colour); Instructions is now plain text; Product colours row removed; branding positions on a light background without the pink line.'],['2026-10-23','Colour rows show quantity only (unit and amount just on the product line); warning bars moved below Product details.'],['2026-10-23','Colour breakdown under the product (swatch, SKU, qty, unit, amount per colour); Product colours row in Product details; split deliveries shown as numbered cards with each address\\'s colour split, date, Critical tag, service and notes, plus a check that the drops add up to the PO quantity. Preview shows 3 colours across 3 addresses.'],['2026-10-23','Proof & artwork note is now a highlighted bar under Branding details; delivery cell has its label back, a smaller date and No fail on the right.'],['2026-10-23','Conditions moved to their own page as Our purchasing terms (intro + numbered cards); page 1 says See the next page for our purchasing terms.'],['2026-10-23','Delivery cell shows just the date and No fail; branding positions side by side (up to 3 per row) with print colours from the product pop-out and a Proof & artwork files pill; Instructions trimmed to Stock (reserved with / until from the Stock step, or the supplier feed) and Notes; delivery service and notes moved into Deliver to (pink heading).'],['2026-10-23','Space saving: order ref, supplier address and supplier contact removed; delivery date is a compact highlighted cell in the reference strip; tighter detail labels; conditions in two small columns. New Your next steps (acknowledge, send proof / check stock, dispatch, invoice).'],['2026-10-23','Fixed: long items now flow across pages (each section and position is its own block), so Deliver to no longer gets cut off.'],['2026-10-23','Branding details grouped per position (Position n · name, then method, colours, size, artwork), as in the product pop-out.'],['2026-10-23','Delivery date panel back beside Supplier and Your contact. Item details full width in three titled sections: Product details (dimensions, description, material), Branding details (position, method, colours, size, artwork per position) and Instructions (sample, stock, delivery service, delivery notes, packing, notes, warnings) from the product pop-out.'],['2026-10-23','Delivery date panel moved to the top (full width, No fail pill, agreed with); warnings full width and left aligned; supplier name smaller.'],['2026-10-23','Setup, delivery and PO total rows sit to the right of the thumbnail.'],['2026-10-23','Supplier name now in the same font as the Purchase order title; Sent pill removed.'],['2026-10-23','Setup, delivery and PO total now sit directly under the product line; thumbnail 3× larger; item number removed.'],['2026-10-23','Supplier name shown large in the header under Purchase order.'],['2026-10-23','Documents always use the distributor\\'s colourway from Settings → Branding, even when a supplier or admin opens them (suppliers were getting the Merchsmith colours).'],['2026-10-23','Now one product (PO-1051-02).'],['2026-10-23','Product thumbnail (visual or coloured product) on each item; Artwork row per position with thumbnail and file name; Product and Product colours rows removed; Invoice to removed; Delivery date is now a highlighted panel with a No fail pill and who it was agreed with.'],['2026-10-23','Fixed: item detail labels wrapped; PO labels now have a wider column.'],['2026-10-23','Page created.']]},\n    {f:'Merchsmith Order Acknowledgement Preview.html',t:'Order acknowledgement preview',d:'Sample-data preview of the customer order acknowledgement (D06) with Bank transfer / On account / Paid by card states.',h:[['2026-10-23','Notice background is now a tint of the distributor colour; \"Please check all details\" removed from the header line.'],['2026-10-23','What happens next: payment is step 1, check and send to production step 2, proof step removed. Artwork and Deliver by lines removed from items.'],['2026-10-23','Check-everything notice shortened (delivery-dates sentence removed).'],['2026-10-23','Fixed: header title wrapped and overlapped the reference line; title now stays on one line.'],['2026-10-23','Page created.']]},\n    {f:'Merchsmith Card Payments Developer Guide.dc.html',t:'Card payments, fees & invoices guide',d:'Developer guide: commercial-card rules, card fee invoices, pro forma revisions, part payments, fee refunds, the pay page, the shared invoice documents, Finance tables, data model, APIs and going-live notes.',h:[['2026-10-23','Page created.']]},\n    {f:'Merchsmith Credit Note Preview.html',t:'Credit note preview',d:'Sample-data preview of the credit note (D10) with On account / Card refund / Bank refund states.',h:[['2026-10-23','VAT number removed from the header line (still in the footer).'],['2026-10-23','Credit status box and How this credit is settled now change with the settlement: on account (two numbered options), card refund, bank refund.'],['2026-10-23','How this credit is settled: two numbered options, 1 Default (settlement + refund reference) and 2 On request (repay to bank), same text size.'],['2026-10-23','How this credit is settled: added repayment on request (card → original card; bank transfer → details from the accounts department, verified before transfer).'],['2026-10-23','Removed the VAT reclaim note from the How this credit is settled box.'],['2026-10-23','Removed the Supplier VAT no. line from the notes box (already in the header).'],['2026-10-23','Page created.']]},\n    {f:'Merchsmith VAT Invoice Preview.html',t:'VAT invoice preview',d:'Sample-data preview of the VAT invoice (D08 / D08P) with Unpaid / Paid / Overdue / With credit note states.',h:[['2026-10-26','Added an Additional invoice example (?state=additional) and ?print=1 auto-print.'],['2026-10-23','VAT number removed from the header line (still in the footer).'],['2026-10-23','\"Part paid\" state.'],['2026-10-23','With credit note state removed; credit notes are their own document.'],['2026-10-23','Project row added.'],['2026-10-23','Fixed: credit-note state overlapped the footer. Content never overflows into the footer now (blocks move to a new page instead); totals with a credit note read Supplies, VAT, Less credit note, Balance due. All four states fit on one page.'],['2026-10-23','Invoice documents: tighter vertical spacing so a one-product VAT invoice fits on one A4 page in every state; the last block may use the space above the footer before moving to a new page.'],['2026-10-23','Page created.']]},\n    {f:'Merchsmith Pro Forma Preview.html',t:'Pro forma invoice preview',d:'Sample-data preview of the pro forma invoice design (D05 / D07) rendered by proforma-doc.js.',h:[['2026-10-23','Pro forma footer no longer shows the distributor VAT number (VAT invoices and credit notes keep it).'],['2026-10-23','Card fee line moved above VAT and shown ex VAT; VAT line includes the fee\\'s VAT.'],['2026-10-23','Revised (card) pro forma: card fee is now a line above the total, and Total due is one figure including the fee.'],['2026-10-23','Card payment fee line on the revised pro forma no longer says \"est.\" (always 1.5% or 3%).'],['2026-10-23','\"Switched to card (R2)\" state: revision note, card fee, total to pay by card, pay-by-card box.'],['2026-10-23','Project row added (one item from a second project).'],['2026-10-23','Awaiting payment / Paid switcher (top right); ?paid shows the paid version.'],['2026-10-23','Pro forma: footer reads Company No.; header logo 35% larger.'],['2026-10-23','Pro forma payment status: Awaiting payment in red (light red tint box + pill), Paid in green.'],['2026-10-23','Split addresses show colour × quantity.'],['2026-10-23','Reference strip hairlines, centred logo, pink page count.'],['2026-10-23','Reference strip and address row repeat on every page (now 5 pages).'],['2026-10-23','Shows the paginated A4 pages (Page 1 / 4 …).'],['2026-10-23','Example now 8 items with split deliveries across 4 addresses, running over 2+ A4 pages.'],['2026-10-23','Page created.']]},\n    {f:'Merchsmith PDF Documents.dc.html',t:'PDF documents audit',d:'Every PDF download / print across all user views (D01–D19) with what it’s for, who uses it, where it is, page size and design state, plus five suggested missing documents (D20–D24) and a suggested order of work.',badge:'Audit',h:[['2026-10-26','D21 and D23 built, with Download PDF links to the examples.'],['2026-10-26','D11 Delivery note link opens the new preview (split delivery 1 of 3) with the print dialog.'],['2026-10-26','D03 Proof link opens Merchsmith Proof Preview.html with the print dialog.'],['2026-10-26','Proof sheet prints as A3 landscape (page size set by name so Chrome picks landscape).'],['2026-10-26','Fixed: D03 Proof download now opens the A3 proof sheet full page with the print / Save as PDF dialog (the download button only existed for customers with an approved proof).'],['2026-10-26','Download PDF links open in the same window (inside the design tool) instead of a new browser tab.'],['2026-10-26','Every Download PDF link now opens an example document straight into the print / Save as PDF dialog: redesigned documents use their preview pages (?print=1), others open the real order document full page.'],['2026-10-23','D09 purchase order marked redesigned.'],['2026-10-23','D06 renamed Order acknowledgement and marked redesigned.'],['2026-10-23','D05 and D07 marked as redesigned.'],['2026-10-15','D01 redesigned as the Quote; D02 and D04 removed from the platform and the sheet. Download links now open the document and start the download/print automatically.'],['2026-10-07','Created.']]},\n    {f:'Merchsmith Sustainability.html',t:'Sustainability (Evermerch)',d:'Prototype. Distributor: Overview, Your range, Projects & orders, Pillars, Settings (show scores, panel colourway). Platform Admin (?scope=platform): Platform overview, Data quality, Scoring rules, Default design. Scores from sus-score.js over the product data in sus-data.js.',h:[['2026-11-17','Scoring rules: Longevity 4/5 no longer needs a minimum warranty — only expected life (the 4/5 warranty field is removed). 5/5 still needs life, warranty and repairability. Rules page wording for 4/5 and 2/5 updated to match (sus-score.js v6).'],['2026-11-17','New Platform Admin tab Rules page (sus-rules.js): edit the public How products are scored page — title, standfirst and every section, with Save and Reset to default. Weights, label bands and the worked example stay live from the scoring rules.'],['2026-11-17','Platform Admin goals: as well as the platform-wide suggestions, admin gets its own measures and suggestions: clear the review queue (supplier changes waiting), % of suppliers with 80%+ complete evidence, % of suppliers averaging Good or better, and certifications without a logo; admin-specific suggestions are listed first and up to six show. Customer What you buy: every column sorts (click again to reverse) and adds Category; product name opens it in the store, category opens that store department, score and pillars open the full assessment, spend opens Orders filtered to that product when it is on a real order (otherwise Progress over time), and the greener alternative opens that product in the store, with See assessment beside it. Customers no longer see the supplier name on the panel.'],['2026-11-17','Progress over time: new Last 12 months vs the 12 months before (now the default), Choose dates… (from / to months, compared with the same months a year earlier), and a Show £ figures switch: off shows percentage changes and shares only, the chart becomes each month’s share by score band, and the statements and printable report drop £ amounts. All comparisons use complete months only (to the end of last month). The chart shows just the two compared ranges with a dotted line between them. What you can say is rebuilt from the data every visit, so it rolls forward monthly; a line only appears when both periods have at least 8 order lines, and each is marked ▲ (to advertise) or ▼. Settings and Default design: the panel preview now uses the real panel size (32px heading), not the compact version. Choices are remembered per user type (ms-sus-prog-<role>). Sample history now covers Jan 2024 onwards.'],['2026-11-17','Sustainability for every user type. Distributor: new Progress over time tab; Goals now tracked: adopt a suggestion or add your own (measure, target, deadline, note), progress worked out from the data, auto-moves to Achieved when reached, edit / archive / restore / delete (ms-sus-goals-<role>). Progress over time: this year to date, last 3 months or this month vs the same months last year; sales, Good-or-better sales, share Good-or-better and sales-weighted score with change; plain-English statements; monthly chart by score band with the Good-or-better share line; Create printable report (print / save as PDF) with highlights, figures, chart, pillars, top products, goals and method. Customer (shown only when the distributor shows scores): Overview of what they buy (spend-weighted score, spend on Good-or-better, goals, greener swaps from the store, spend by band, pillars), Progress over time with their own report, What you buy with alternatives. Supplier: Overview vs platform average, quickest wins, goals; Progress over time; Your products with Update data (submitted for review, status shown); Certifications (manufacturer certs, request new ones with evidence). Platform Admin: Progress over time, Products (edit any product’s sustainability data, filters for edited / in review / Data NA), Review (approve or reject supplier changes with a before/after and score change; reason required to reject). Sales history is generated sample data valued at today’s scores (sus-hist.js).'],['2026-11-17','Overview: new Goals section with up to five suggestions worked out from the data (biggest missing-data pillar, weakest pillar with advice, low-scoring products still being ordered with a higher-scoring alternative from the same department, share rated Good or better with a +10 point target, claims capped by tier C evidence), each with now/target and a link. Platform Admin: new Certifications tab: logo library (upload, Original / Mono White / Mono Black with Mono White default and automatic Mono Black on light colourways, crop, remove), editable names, matches and type (product or manufacturer), a matching table showing how every certification name in the data is matched, and manufacturer certifications saved against each supplier (company or production site). Scoring rules: weights card explains it is the only set that totals 100; threshold cards relabelled as thresholds. Panel previews open expanded.'],['2026-11-17','New page. Scoring follows the Evermerch developer handover v1.0: five pillars (Origin EPI 15, Raw Materials 25, Longevity 20, Packaging 15, End of Life 25) each scored 0–5 from the product data, weighted to 0–100; a missing pillar shows Data NA and scores 0 with its weight kept; tier C evidence capped at 2/5; certifications and initiatives listed but not scored; evidence status Complete / Partial / Insufficient. Labels: Excellent 80+, Good 60+, Fair 40+, Limited 20+, Poor. Distributor stats: range average, band split, pillar averages, scores weighted by project adds, orders and order value, highest/lowest products, per-pillar histograms. Admin can edit weights (must total 100), labels, EPI bands and country table, pillar thresholds, tier C cap; saving bumps the rules version and rescores. Admin sets the default panel colourway; distributors can follow it or choose their own. EPI values are prototype placeholders. Sample product data (hand-entered for the 15 live products, generated with gaps for the rest).']]},\n    {f:'Merchsmith Finance.html',t:'Finance (Billing & payments)',d:'Subscription, Customer invoices and Supplier invoices tables (KPIs, filters, bulk actions, CSV), Bank details. Example data: orders MS-1030 to MS-1041 (demo-orders.js) cover every invoice and payment state.',badge:'Page',h:[['2026-11-17','Fixed: invoice View buttons did nothing in the design viewer (new windows are blocked) — invoices now open in an in-page document viewer with Download PDF (billing.js v7, MSBILL.showDoc). Next payment gains Preview invoice (the upcoming invoice, status Due). Subscription shows links to the latest invoice, the onboarding fee invoice and All invoices.'],['2026-11-17','Subscription invoices follow the distributor\\u2019s VAT setting set by Platform Admin.'],['2026-11-17','Subscription invoices open the new Merchsmith tax invoice PDF (subinv-doc.js / billing.js v5).'],['2026-11-17','Subscription invoices include the one-off £750 + VAT onboarding fee invoice from sign-up (non-refundable).'],['2026-11-17','Invoice drawer shows the project reference beside the project; the invoices CSV includes it.'],['2026-10-26','Supplier invoices → Record supplier payment: new tick box (on by default) opens the remittance advice (D23) for the supplier paid.'],['2026-10-23','Fixed: older orders now convert to one PO per product when any page loads (po-lines.js), so Supplier invoices no longer shows grouped POs.'],['2026-10-23','Supplier invoices table lists one row per PO (product).'],['2026-10-23','Customer invoices: \"Take a card payment\" per unpaid invoice and as a bulk action (one customer at a time), opening the pay page with those invoices ticked. Finance menu: Take a card payment.'],['2026-10-23','Customer invoices: Part paid status and chip (paid and remaining shown under the status; Outstanding counts the balance), card fee invoices listed as their own type, invoice totals include each product\\'s own charges and delivery, card-paid invoices show as paid. Fee invoices and card payments register with the accounting sync like other invoices / payments.'],['2026-10-14','Dashboard tab (first): finance figures from the shared dashboard engine.'],['2026-10-14','Supplier invoices include Additional POs and Supplier credits (Credit to use → Credit used).'],['2026-10-01','Integrations tab: Stripe card payments + accounting sync for 7 packages (Xero, Sage, QuickBooks, FreeAgent, Zoho Books, KashFlow, Clear Books). See HANDOVER.md → Supported accounting packages.'],['2026-10-01','Moved out of Settings onto its own page; demo orders added.']]},\n    {f:'Merchsmith Emails Plan.dc.html',t:'Emails plan',d:'How we\\'ll approach emails: automatic emails stay on the sending service; each person can connect their own Gmail (Google Workspace, first, for Mojo) or Outlook (Microsoft 365, second). Emails they write go from their mailbox; emails with known contacts are logged, shared with the team unless marked private. Covers what gets logged, who sees what, Bcc address, phases, data and legal, risks, developer notes and open questions.',badge:'Plan',h:[['2026-11-18','Still-to-design items built: activity timeline, reply from Merchsmith, needs-reconnecting banner and notification, ghost permission step.'],['2026-11-18','Decisions recorded: admins can read private emails (audit-logged), never required by the company, kept while the contact is in Merchsmith, attachments opened from the mailbox (never copied), opens tracked on automatic and personal emails. Added Google approval timeline (about 4–8 weeks; testing-mode limits for the pilot).'],['2026-11-18','New page.']]},\n    {f:'Merchsmith Calls Plan.dc.html',t:'Calls plan',d:'How we\\'ll approach calls: each distributor links its own phone provider (bring your own), launching with RingCentral (first, for Mojo) and Aircall only. How it works, who does what, launch providers and why, what distributors get, phases, recording and data rules, risks, platform changes still to make and open questions.',badge:'Plan',h:[['2026-11-18','Ghost permission step marked as built.'],['2026-11-18','Recording & data rules: added ghost mode only with permission, and why each permission is asked for.'],['2026-11-18','Updated: RingCentral built first with Mojo Promotions (first distributor, already on RingCentral) as the pilot, Aircall second; Calls in every plan; Merchsmith uses a provider too; referral plan noted for the future; platform changes brought up to date.'],['2026-11-18','Platform changes section updated: showing only Aircall and RingCentral is now done.'],['2026-11-18','New page.']]},\n    {f:'Merchsmith Two-Supplier Developer Guide.dc.html',t:'Two-supplier workflow guide',d:'How blank supplier + decorator lines work end to end: registry, project lead times and quotes, blank stock lane, production gate, POs, invoices, documents, supplier views, data model and the MSTWO API — with screenshots.',badge:'Guide',h:[['2026-10-01','Ship via us (goods-in, book in, ship together) + printable delivery notes.'],['2026-10-01','Sample lead times: supplier (per supplier) + customer (Distributor Settings), per-product overrides on the Sample tab.'],['2026-09-30','Created: full developer guide for two-supplier orders.']]},\n    {f:'Merchsmith Search Spec.dc.html',t:'Search spec',d:'Working spec for search across all user views: what exists today (S01–S08), what each user type searches for, header search behaviour, result types and who sees them, matching and ranking, list search pattern, store search, permissions, build order and open questions (Q1–Q9).',badge:'Spec',h:[['2026-10-15','Marked as built: all four build steps live in the prototype.'],['2026-10-15','Draft 2: decisions Q1–Q9 agreed (dropdown, store products first, chips + hidden shortcuts, actions for everyone, AMs own customers first, admin always searchable, fixed synonyms, search insights, messages in step 4); supplier ranges added as a chip.'],['2026-10-15','Created (draft 1).']]},\n    {f:'Merchsmith Status Reference.html',t:'Status Reference',d:'Every status value used across products/projects and what it means — the source of truth now applied to both project tables.',h:[\n      ['2026-09-20','Now full-width and left-aligned (was capped at 1320px).'],\n      ['2026-07-24','Delivery Date section: distributor cell visual gallery (Standard/Critical/awaiting/can’t-meet/Urgent/Missed states), Supplier/Customer split rules, Standard supplier-date auto-fill, order-by = supplier −4 wkg hrs. Removed the Order-deadline row from Product Status and folded its \"deadlines & reminders\" note into Delivery Date. Missed dates now black + struck (matches tables).'],\n      ['2026-07-05','Adopted as the vocabulary for all product action pills and derived statuses in the project tables.'],\n      ['2026-06-21','Initial build.'],\n    ]},\n    {f:'Merchsmith Field Mapping Reference.html',t:'Field Mapping Reference',d:'Master list of supplier API/CSV input field types and how each maps to the platform model — with gaps highlighted. Includes the colour → base-colour mapping tool.',h:[\n      ['2026-07-09','Colour mapping tool added: 19-colour master palette, ordered roll-up rules, live coverage of every raw feed colour with per-colour overrides (shared with the store filter).'],\n      ['2026-06-24','Initial build.'],\n    ]},\n    {f:'Merchsmith Product Feed Spec.html',t:'Product Feed Spec',d:'The normalised product feed shape the platform expects from suppliers.',h:[['2026-06-24','Initial build.']]},\n    {f:'Xoopar Single Product Fields.html',t:'Xoopar — one product, every field',d:'Every attribute supplied for one fully-described product (ICE-P white), the raw value and what Merchsmith stores after transformation.',h:[['2026-08-10','Initial build — all 77 attributes on record XP61145.14A, grouped, with raw values beside their transformed Merchsmith values.']]},\n    {f:'Xoopar Field Map.html',t:'Xoopar → Merchsmith field map',d:'Every attribute the Xoopar API supplies, the Merchsmith field it maps to and how it is handled — the worksheet for mirroring the mapping on the development site.',h:[['2026-08-10','Initial build — all 107 supplied attributes plus 6 record-level fields, grouped by purpose with record counts, sample values, target fields and handling notes.']]},\n    {f:'Xoopar API Product Preview.html',t:'Xoopar API — product preview',d:'The live Xoopar API export run through the adapter: a complete product as the store renders it, tier-pricing findings, and the adapter fixes made.',h:[\n      ['2026-08-10','Full 1,188-record export analysed. Tier pricing adopted (GIFT_BRONZE_T3 + qty-suffixed breaks). Adapter fixed: money-array attributes (decoration + setup fees were silently null for 185 products), French print-method names, compliance URLs vs certification names, weight kg→g, short_description name fallback. Corrected the earlier \"wrong endpoint\" conclusion — 223 of 1,188 records carry full content.'],\n      ['2026-08-10','Extended to 3 records: side-by-side field comparison; findings on licensed (unbrandable) PopGrips, flat tier pricing, weight-unit and colour-conflict faults.'],\n      ['2026-08-10','Initial build — single Xoopar API record run through the adapter: field-by-field mapping, gaps, tier-price findings.'],\n    ]},\n    {f:'Merchsmith Platform Brief.html',t:'Platform Brief',d:'The overall product vision and scope — updated to reflect the built platform.',h:[\n      ['2026-07-09','Rewritten against the latest design: Platform Admin actor, supply-side flow (feeds → curation → range → store), all built surfaces re-statused, dual delivery/order-by dates, commercial model, revised next steps.'],\n      ['2026-06-14','Initial build.'],\n    ]},\n    {f:'Merchsmith Org and User Model.html',t:'Org & User Model',d:'How organisations, roles and permissions fit together.',h:[\n      ['2026-09-23','Rewritten as the developer reference: org types, entities, lifecycle, live permissions matrix and file map.'],\n      ['2026-07-09','File renamed (an old “&amp;amp;” encoding accident in the filename broke links to it).'],\n      ['2026-06-14','Initial build.'],\n    ]},\n    {f:'Merchsmith Site Map.html',t:'Site Map',d:'High-level map of the platform structure.',h:[['2026-06-14','Initial build.']]},\n    {f:'Merchsmith Brand Guide.html',t:'Brand Guide',d:'Merchsmith visual identity — colour, type, logo usage.',h:[['2026-06-14','Initial build.']]},\n    {f:'Merchsmith Logos.html',t:'Logos',d:'Logo lockups and exports.',h:[['2026-06-14','Initial build.']]},\n  ]},\n  {id:'concept',name:'Concepts',cls:'t-concept',sub:'Exploration & rationale',pages:[\n    {f:'Price Matrix Concept.html',t:'Price Matrix Concept',d:'The pricing model — quantity breaks, branding cost, markup and the distributor matrix. Now mirrored in full inside the product modal\\'s distributor Price tab.',h:[['2026-06-17','Initial build.']]},\n    {f:'Supplier Connections Concept.html',t:'Supplier Connections Concept',d:'How suppliers connect (API / CSV / manual / branding-only) and match criteria.',h:[['2026-06-17','Initial build.']]},\n    {f:'Branding Builder Concept.html',t:'Branding Builder Concept',d:'Product decoration builder — methods, positions, colours.',h:[['2026-06-17','Initial build.']]},\n    {f:'Gallery Concept - Product Showcase.html',t:'Gallery Concept — Product Showcase',d:'Proposal: the project Gallery view as a marketing page per product (description, lead time, MOQ, colours, branding methods, why-it-works, links to the store product page). List view unchanged.',h:[['2026-11-05','Built into the Autumn Giveaways project page Gallery view; this page is now the reference.'],['2026-11-05','Framed as the Gallery view of the project page (List = action status, Gallery = the product); List switch links to the list view; card button renamed Product details (opens the pop-out).'],['2026-11-05','Cards now image-first: large scrollable image carousel on top, then name, description and Branding chosen (when set). Facts, colours and details removed from the card.'],['2026-11-05','Initial build (proposal, Autumn Giveaways items + product feed).']]},\n    {f:'Design Split Concept.html',t:'Design Split Concept',d:'Visual vs proof split within the Design stage.',h:[['2026-06-17','Initial build.']]},\n    {f:'Organisations Concept.html',t:'Organisations Concept',d:'Early thinking on the org/relationship model.',h:[['2026-06-17','Initial build.']]},\n  ]},\n  {id:'mockup',name:'Mockups',cls:'t-mockup',sub:'Standalone studies (not wired)',pages:[\n    {f:'Merchsmith Store Home (Merchery Style).html',t:'Store Home — Merchery style',d:'Standalone style study (platform fonts + Mojo colours). The basis for the live store home.',h:[['2026-06-16','Initial build.']]},\n    {f:'Merchsmith Store Home (Mockup).html',t:'Store Home — first mockup',d:'The original e-commerce home-page concept.',h:[['2026-06-16','Initial build.']]},\n  ]},\n];\nconst fmtD=iso=>{ const d=new Date(iso+'T12:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'}).replace(/ /g,' '); };\n/* ---- reviewer meta: resolution rating + comments (localStorage, survives rebuilds of this page) ---- */\nconst METAKEY='ms-devindex-meta';\nconst meta=()=>{ try{ return JSON.parse(localStorage.getItem(METAKEY))||{}; }catch(e){ return {}; } };\nconst saveMeta=m=>{ try{ localStorage.setItem(METAKEY,JSON.stringify(m)); }catch(e){} };\nconst metaFor=f=>meta()[f]||{};\nconst setMeta=(f,patch)=>{ const m=meta(); m[f]=Object.assign({},m[f],patch); saveMeta(m); };\nconst RATES={ un:{l:'Unconsidered',d:['r-un']}, sl:{l:'Slightly considered',d:['r-sl']}, co:{l:'Considered',d:['r-co']}, fi:{l:'Finished',d:['r-co','r-co']} };\nconst rateDots=r=>`<span class=\"dots\">${(RATES[r]||RATES.un).d.map(c=>`<span class=\"dot ${c}\"><\u002Fspan>`).join('')}<\u002Fspan>`;\nconst esc2=s=>String(s).replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/\"/g,'&quot;');\nconst host=document.getElementById('cats');\nfunction render(){\nhost.innerHTML=CATS.map(c=>{\n  const pages=[...c.pages].sort((a,b)=>(b.h[0][0]).localeCompare(a.h[0][0]));\n  return `<section class=\"cat\"><div class=\"cat-h\"><h2>${c.name}<\u002Fh2><span>${c.sub} · ${pages.length}<\u002Fspan><\u002Fdiv>\n  <div class=\"grid\">${pages.map(p=>{const slug=p.f.replace(/&amp;/g,'&').replace(/\\.html$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');return `<a class=\"card\" href=\"${p.f.replace(/&amp;/g,'&')}\">\n    <div class=\"thumb ${c.cls}\"><span class=\"glyph\">${p.t.slice(0,1)}<\u002Fspan><img class=\"prev\" loading=\"lazy\" alt=\"\" src=\"screenshots/idx/${slug}.png\" onerror=\"this.remove()\">${p.badge?`<span class=\"badge\">${p.badge}<\u002Fspan>`:''}<span class=\"strip\">${p.t}<\u002Fspan><\u002Fdiv>\n    <div class=\"body\"><p>${p.d}<\u002Fp>\n      ${(()=>{ const mm=metaFor(p.f); const r=mm.r||'un'; const cs=mm.c||[]; const last=cs[cs.length-1];\n        return `<div class=\"meta-row\">\n          <button class=\"rate\" data-rate=\"${esc2(p.f)}\" title=\"Set design resolution\">${rateDots(r)}${RATES[r].l}<\u002Fbutton>\n          <button class=\"cmtbtn\" data-cmts=\"${esc2(p.f)}\" data-t=\"${esc2(p.t)}\" title=\"Comments for the developer\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 14a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z\"/><\u002Fsvg>${cs.length?`<span class=\"n\">${cs.length}<\u002Fspan>`:'Comment'}<\u002Fbutton>\n        <\u002Fdiv>${last?`<div class=\"cmt-prev\"><b>${new Date(last.d).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}:<\u002Fb> ${esc2(last.t)}<\u002Fdiv>`:''}`; })()}\n      <div class=\"hist\"><div class=\"hist-h\">History<span>last modified ${fmtD(p.h[0][0])}<\u002Fspan><\u002Fdiv>\n        <ul>${p.h.map(([d,txt])=>`<li><b>${fmtD(d)}<\u002Fb><span>${txt}<\u002Fspan><\u002Fli>`).join('')}<\u002Ful><\u002Fdiv>\n      <span class=\"open\">Open page →<\u002Fspan><span class=\"fname\">${p.f}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fa>`;}).join('')}<\u002Fdiv><\u002Fsection>`;}).join('');\n}\nrender();\n\n/* ---- rating picker ---- */\nconst rpick=document.createElement('div'); rpick.className='rpick'; document.body.appendChild(rpick);\nlet rpickFor=null;\nfunction openRpick(btn,f){ rpickFor=f; const cur=(metaFor(f).r)||'un';\n  rpick.innerHTML=Object.entries(RATES).map(([k,v])=>`<button data-r=\"${k}\" class=\"${k===cur?'cur':''}\">${rateDots(k)}${v.l}<\u002Fbutton>`).join('');\n  rpick.classList.add('open');\n  const r=btn.getBoundingClientRect();\n  rpick.style.top=(scrollY+r.bottom+7)+'px';\n  rpick.style.left=(scrollX+Math.max(10,Math.min(r.left,innerWidth-216)))+'px';\n  rpick.querySelectorAll('[data-r]').forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); setMeta(rpickFor,{r:b.dataset.r}); rpick.classList.remove('open'); render(); });\n}\n\n/* ---- comments drawer ---- */\nconst cwin=document.createElement('div'); cwin.className='cwin';\ncwin.innerHTML=`<div class=\"scrim\"><\u002Fdiv><div class=\"panel\"><div class=\"ph\"><div><h3><\u002Fh3><div class=\"sub\"><\u002Fdiv><\u002Fdiv><button class=\"x\" title=\"Close\">×<\u002Fbutton><\u002Fdiv><div class=\"list\"><\u002Fdiv><div class=\"composer\"><textarea placeholder=\"Note for the developer…\"><\u002Ftextarea><br><button class=\"send\">Add comment<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\ndocument.body.appendChild(cwin);\nlet cwinFor=null;\nfunction renderCwin(){ const cs=(metaFor(cwinFor).c)||[];\n  cwin.querySelector('.list').innerHTML=cs.length?cs.map((c,i)=>`<div class=\"ci\"><div class=\"who\"><span>You<\u002Fspan><span>${new Date(c.d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})} · ${new Date(c.d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}<\u002Fspan><\u002Fdiv><p>${esc2(c.t)}<\u002Fp><button class=\"del\" data-di=\"${i}\">Delete<\u002Fbutton><\u002Fdiv>`).join(''):'<div class=\"none\">No comments yet — leave the first note for the developer.<\u002Fdiv>';\n  cwin.querySelectorAll('.del').forEach(b=>b.onclick=()=>{ const m=meta(); (m[cwinFor].c||[]).splice(+b.dataset.di,1); saveMeta(m); renderCwin(); render(); });\n}\nfunction openCwin(f,title){ cwinFor=f; cwin.querySelector('h3').textContent=title; cwin.querySelector('.sub').textContent=f; cwin.classList.add('open'); renderCwin(); cwin.querySelector('textarea').focus(); }\nfunction closeCwin(){ cwin.classList.remove('open'); render(); }\ncwin.querySelector('.scrim').onclick=closeCwin;\ncwin.querySelector('.x').onclick=closeCwin;\ncwin.querySelector('.send').onclick=()=>{ const ta=cwin.querySelector('textarea'); const t=ta.value.trim(); if(!t) return;\n  const m=meta(); m[cwinFor]=m[cwinFor]||{}; (m[cwinFor].c=m[cwinFor].c||[]).push({t,d:Date.now()}); saveMeta(m); ta.value=''; renderCwin(); };\ncwin.querySelector('textarea').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); cwin.querySelector('.send').click(); } });\n\n/* delegated clicks (cards are links — suppress navigation on the controls) */\ndocument.addEventListener('click',e=>{\n  const rb=e.target.closest('[data-rate]');\n  if(rb){ e.preventDefault(); e.stopPropagation(); const was=rpick.classList.contains('open')&&rpickFor===rb.dataset.rate; rpick.classList.remove('open'); if(!was) openRpick(rb,rb.dataset.rate); return; }\n  const cb=e.target.closest('[data-cmts]');\n  if(cb){ e.preventDefault(); e.stopPropagation(); rpick.classList.remove('open'); openCwin(cb.dataset.cmts,cb.dataset.t); return; }\n  if(!e.target.closest('.rpick')) rpick.classList.remove('open');\n});\ndocument.addEventListener('keydown',e=>{ if(e.key==='Escape'){ rpick.classList.remove('open'); if(cwin.classList.contains('open')) closeCwin(); } });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
