<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchsmith — Project Sheet</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<script src="theme.js?v=13"></script>
<script src="logos.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#54566b;}
  body{font-family:var(--sans,'Inter',sans-serif);color:var(--ink,#23232a);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  /* screen: show the A3 page on a grey backdrop with a print bar */
  .printbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:#2c2d3a;color:#fff;padding:12px 22px;font-size:13.5px;}
  .printbar b{font-weight:700;}
  .printbar .pb-actions{display:flex;gap:10px;}
  .printbar button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;}
  .pb-print{background:var(--periwinkle-deep,#5860a6);color:#fff;}
  .pb-back{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3);}
  .stage-wrap{display:flex;justify-content:center;padding:28px 20px 60px;}

  /* ---- A3 portrait sheet ---- */
  .sheet{width:1123px;min-height:1587px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.4);
    padding:54px 58px;display:flex;flex-direction:column;}

  /* header */
  .sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:22px;border-bottom:2px solid var(--ink,#23232a);}
  .sh-lockup{display:flex;align-items:center;gap:16px;}
  .sh-lockup .lk{height:38px;display:flex;align-items:center;}
  .sh-lockup .lk svg, .sh-lockup .lk img{height:38px;width:auto;display:block;}
  .sh-x{font-size:20px;color:var(--muted,#9a9aa3);font-weight:300;}
  .sh-meta{text-align:right;font-size:12.5px;color:var(--ink-2,#55555f);line-height:1.6;}
  .sh-meta b{color:var(--ink,#23232a);}
  .sh-titlewrap{margin:22px 0 8px;}
  .sh-kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--periwinkle-deep,#5860a6);}
  .sh-title{font-family:var(--serif,'Fraunces',serif);font-weight:500;font-size:48px;line-height:1;letter-spacing:-.01em;margin:8px 0 0;}
  .sh-sub{font-size:14px;color:var(--ink-2,#55555f);margin-top:10px;}

  /* summary stats */
  .sh-stats{display:flex;gap:0;margin:22px 0 26px;border:1px solid var(--line-soft,#e7e6e1);border-radius:14px;overflow:hidden;}
  .sh-stat{flex:1;padding:14px 18px;border-right:1px solid var(--line-soft,#e7e6e1);}
  .sh-stat:last-child{border-right:0;}
  .sh-stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.01em;}
  .sh-stat span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#9a9aa3);}

  /* product grid */
  .sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;align-content:start;}
  .pc{border:1px solid var(--line-soft,#e7e6e1);border-radius:14px;padding:15px 16px;display:flex;flex-direction:column;gap:12px;break-inside:avoid;}
  .pc-top{display:flex;gap:14px;align-items:flex-start;}
  .pc-img{width:84px;height:84px;flex:none;border-radius:11px;background:var(--paper-2,#f4f3ee);display:grid;place-items:center;overflow:hidden;}
  .pc-img img{width:100%;height:100%;object-fit:contain;padding:7px;}
  .pc-info{flex:1;min-width:0;}
  .pc-name{font-size:16.5px;font-weight:700;line-height:1.2;letter-spacing:-.01em;margin:0;}
  .pc-line{font-size:12.5px;color:var(--ink-2,#55555f);margin-top:5px;}
  .pc-line b{color:var(--ink,#23232a);}
  .pc-badge{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line-soft,#e7e6e1);border-radius:999px;padding:4px 13px 4px 5px;font-size:12px;font-weight:700;color:var(--ink,#23232a);margin-top:8px;}
  .pc-badge .statcircle{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;flex:none;}
  .pc-badge .statcircle .icn{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .sc-peri{border:1.8px solid var(--periwinkle,#7b85c5);color:var(--periwinkle-deep,#5860a6);}
  .sc-green{border:1.8px solid var(--spearmint,#3bbf8a);color:var(--green-deep,#1f8a5b);}
  .sc-ink{border:1.8px solid var(--ink,#23232a);color:var(--ink,#23232a);}
  .sc-muted{border:1.8px solid var(--hair,#d8d6cf);color:var(--muted,#9a9aa3);}
  .ov-idea{background:#f3effb;color:#7048a6;}
  .ov-paused{background:#f0f0f2;color:#6a6a73;}
  .ov-archived{background:#f0f0f2;color:#9a9aa3;}

  /* the STATUS section — 4 stages */
  .pc-stages{border-top:1px dashed var(--line-soft,#e7e6e1);padding-top:11px;}
  .pc-stages-h{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#9a9aa3);margin-bottom:9px;}
  .stage-row{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;padding:5px 0;}
  .stage-name{font-size:12px;font-weight:700;color:var(--ink,#23232a);}
  .stage-bar{height:6px;border-radius:3px;background:var(--paper-2,#eceae3);overflow:hidden;}
  .stage-fill{height:100%;border-radius:3px;}
  .stage-state{font-size:11.5px;font-weight:700;white-space:nowrap;justify-self:end;}
  /* stage state semantic colours */
  .st-ok   .stage-fill{background:#1f8a5b;}  .st-ok   .stage-state{color:#1f8a5b;}
  .st-wait .stage-fill{background:#d39a32;}  .st-wait .stage-state{color:#a9651b;}
  .st-act  .stage-fill{background:#5860a6;}  .st-act  .stage-state{color:#5860a6;}
  .st-bad  .stage-fill{background:#c0395f;}  .st-bad  .stage-state{color:#c0395f;}
  .st-none .stage-fill{background:transparent;} .st-none .stage-state{color:#b6b6bd;}

  /* footer */
  .sh-foot{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line-soft,#e7e6e1);font-size:11.5px;color:var(--muted,#9a9aa3);}
  .sh-foot .ms{display:flex;align-items:center;gap:8px;}
  .sh-foot .ms svg, .sh-foot .ms img{height:16px;width:auto;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

  @media print{
    html,body{background:#fff;}
    .printbar{display:none;}
    .stage-wrap{padding:0;}
    .sheet{box-shadow:none;width:auto;min-height:auto;}
    @page{size:A3 portrait;margin:0;}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7zM9 8V6a3 3 0 0 1 6 0v2"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.6-1 1.2-1 2.5H9c0-1.3-.3-1.9-1-2.5A6 6 0 0 1 12 3z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><path d="M4 7h16v3H4zM5 10v10h14V10M10 14h4"/></symbol>
</defs></svg>
<div class="printbar">
  <span><b>Project status sheet</b> · A3 · ready to print or save as PDF</span>
  <span class="pb-actions">
    <button class="pb-back" onclick="history.length>1?history.back():window.close()">← Back</button>
    <button class="pb-print" onclick="window.print()">Save as PDF / Print</button>
  </span>
</div>
<div class="stage-wrap">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function(){
  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const gbp=n=>'£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});

  // ---- default (seed) data so the sheet renders even opened directly ----
  const DEFAULT={
    title:'Autumn Giveaways', client:'Citrix', distributor:'Mojo Promotions',
    owner:'Jess Doyle', created:'22 Aug 2025', deliverBy:'Fri. 17th Oct',
    items:[
      {name:'Eco Wheat-Straw Charging Cable', img:'cable', qty:100, each:8.45, delivery:'Fri. 10th Oct', overall:'progress', sts:['approved','awaiting','approved','withacm']},
      {name:'Xoopar Pokket Wireless Mouse', img:'mouse', qty:50, each:12.95, delivery:'Fri. 10th Oct', overall:'ready', sts:['approved','approved','approved','instock']},
      {name:'Tech Travel Bag', img:'bag', qty:250, each:16.40, delivery:'Fri. 10th Oct', overall:'progress', sts:['feedback','approved','awaiting','withacm']},
      {name:'RPET Document Pouch', img:'bag', qty:150, each:9.20, delivery:'asap', overall:'progress', sts:['approved','notapproved','approved','notinstock']},
      {name:'Recycled Cotton Tote', img:'bag', qty:300, each:3.40, delivery:'Fri. 17th Oct', overall:'progress', sts:['unbranded','approved','approved','instock']},
      {name:'Prodir Ds8 True Biotic Pen', img:'pen', qty:250, each:1.85, delivery:'Fri. 31st Oct', overall:'progress', sts:['withacm','withacm','sampleorder','withacm']},
      {name:'Seed Pencil Set', img:'pen', qty:500, each:0.95, delivery:'Fri. 26th Sep', overall:'ordered', sts:['approved','approved','ordered','instock']},
      {name:'Hoton A5 Kraft Paper Notebook', img:'book', qty:250, each:4.25, delivery:'asap', overall:'idea', sts:['dash','dash','sampleorder','dash']},
      {name:'Desktop Garden', img:'garden', qty:250, each:9.75, delivery:'asap', overall:'paused', sts:['pause','pause','pause','pause']},
      {name:'Cork Cover Notebook (2024)', img:'book', qty:200, each:5.10, delivery:'Tue. 12th Aug', overall:'archived', sts:['approved','approved','ordered','instock']}
    ]
  };

  let DATA=DEFAULT;
  try{ const saved=JSON.parse(localStorage.getItem('ms-project-sheet')||'null'); if(saved&&saved.items&&saved.items.length) DATA=saved; }catch(e){}

  const OVERALL={ progress:['sc-peri','i-clock','In progress'], ready:['sc-green','i-bag','Ready to order'], ordered:['sc-ink','i-box','Ordered'],
    idea:['sc-peri','i-bulb','Idea'], paused:['sc-muted','i-pause','Paused'], archived:['sc-muted','i-archive','Archived'] };

  // canonical (role-neutral) stage labels + semantic class + progress, by stage × state
  const STAGES=['Design','Price','Sample','Stock'];
  const STAGE_MAP={
    Design:{ approved:['Approved','st-ok',1], awaiting:['Awaiting approval','st-wait',.67], feedback:['Feedback required','st-bad',.67],
      reworking:['In rework','st-act',.5], withacm:['With studio','st-act',.33], notstarted:['Not started','st-none',0],
      unbranded:['Unbranded','st-none',0], dash:['Not started','st-none',0], pause:['Paused','st-none',.5] },
    Price:{ approved:['Approved','st-ok',1], awaiting:['Awaiting approval','st-wait',.67], withacm:['Being prepared','st-act',.33],
      notapproved:['Not approved','st-bad',1], dash:['—','st-none',0], pause:['Paused','st-none',.5] },
    Sample:{ approved:['Approved','st-ok',1], awaiting:['Awaiting approval','st-wait',.67], ordered:['Sample ordered','st-ok',1],
      sampleorder:['To order','st-wait',0], notapproved:['Not approved','st-bad',1], withacm:['Being checked','st-act',.33],
      dash:['Not required','st-none',0], pause:['Paused','st-none',.5] },
    Stock:{ instock:['In stock','st-ok',1], notinstock:['Not in stock','st-bad',1], awaiting:['Awaiting','st-wait',.67],
      withacm:['Being checked','st-act',.33], ordered:['Reserved','st-ok',1], dash:['—','st-none',0], pause:['Paused','st-none',.5] }
  };
  function stageInfo(stage,state){ const m=STAGE_MAP[stage]||{}; return m[state]||['—','st-none',0]; }

  function lockup(){
    // Client × Distributor lockup using logos.js marks when available, else text
    const L=window.MSLOGOS;
    const mk=(name)=>{ try{ if(window.MSLOGOS&&MSLOGOS.has){ let key=null; if(MSLOGOS.has(name))key=name; else { const f=String(name||'').split(' ')[0]; if(MSLOGOS.has(f))key=f; else if(MSLOGOS.has(f.toLowerCase()))key=f.toLowerCase(); } if(key) return '<span class="lk">'+MSLOGOS.svg(key,38)+'</span>'; } }catch(e){}
      return '<span class="lk" style="font-family:var(--serif);font-size:26px;font-weight:500">'+esc(name)+'</span>'; };
    return mk(DATA.client)+'<span class="sh-x">×</span>'+mk(DATA.distributor);
  }

  function card(it){
    const ov=OVERALL[it.overall]||OVERALL.progress;
    const stagesHTML=STAGES.map((stg,i)=>{
      const [label,cls,pct]=stageInfo(stg,(it.sts&&it.sts[i])||'dash');
      return `<div class="stage-row ${cls}">
        <span class="stage-name">${stg}</span>
        <span class="stage-bar"><span class="stage-fill" style="width:${Math.round(pct*100)}%"></span></span>
        <span class="stage-state">${esc(label)}</span>
      </div>`;
    }).join('');
    const isIdea=it.overall==='idea';
    return `<div class="pc">
      <div class="pc-top">
        <span class="pc-img"><img src="assets/products/${esc(it.img)}.png" alt="" onerror="this.style.display='none'"></span>
        <div class="pc-info">
          <p class="pc-name">${esc(it.name)}</p>
          <div class="pc-line"><b>${it.qty}</b> units${isIdea?'':` · <b>${gbp(it.each)}</b>/unit · <b>${gbp(it.qty*it.each)}</b>`}</div>
          <div class="pc-line">Delivery: <b>${esc(it.delivery==='asap'?'ASAP':it.delivery||'—')}</b></div>
          <span class="pc-badge"><span class="statcircle ${ov[0]}"><svg class="icn"><use href="#${ov[1]}"/></svg></span>${ov[2]}</span>
        </div>
      </div>
      <div class="pc-stages">
        <div class="pc-stages-h">Status</div>
        ${stagesHTML}
      </div>
    </div>`;
  }

  // summary
  const live=DATA.items.filter(it=>it.overall!=='paused'&&it.overall!=='archived'&&it.overall!=='idea');
  const totalVal=live.reduce((s,it)=>s+it.qty*it.each,0);
  const ordered=DATA.items.filter(it=>it.overall==='ordered').length;
  const ready=DATA.items.filter(it=>it.overall==='ready').length;
  const progress=DATA.items.filter(it=>it.overall==='progress').length;

  const today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const msMark=(function(){ try{ if(window.MSLOGOS&&MSLOGOS.svg){ const s=MSLOGOS.svg('Merchsmith',16); if(s) return s; } }catch(e){} return '<b style="color:var(--periwinkle-deep)">Merchsmith</b>'; })();

  document.getElementById('sheet').innerHTML=`
    <div class="sh-head">
      <div class="sh-lockup">${lockup()}</div>
      <div class="sh-meta">
        <div><b>${esc(DATA.distributor)}</b></div>
        <div>Owner · <b>${esc(DATA.owner)}</b></div>
        <div>Created <b>${esc(DATA.created)}</b></div>
      </div>
    </div>
    <div class="sh-titlewrap">
      <div class="sh-kicker">Project status sheet</div>
      <h1 class="sh-title">${esc(DATA.title)}</h1>
      <div class="sh-sub">Prepared for <b>${esc(DATA.client)}</b> · all items delivered by <b>${esc(DATA.deliverBy||'—')}</b></div>
    </div>
    <div class="sh-stats">
      <div class="sh-stat"><b>${DATA.items.length}</b><span>Products</span></div>
      <div class="sh-stat"><b>${progress}</b><span>In progress</span></div>
      <div class="sh-stat"><b>${ready}</b><span>Ready to order</span></div>
      <div class="sh-stat"><b>${ordered}</b><span>Ordered</span></div>
      <div class="sh-stat"><b>${gbp(totalVal)}</b><span>Est. value</span></div>
    </div>
    <div class="sh-grid">${DATA.items.map(card).join('')}</div>
    <div class="sh-foot">
      <div class="legend">
        <span><i style="background:#1f8a5b"></i>Approved / done</span>
        <span><i style="background:#5860a6"></i>In progress</span>
        <span><i style="background:#d39a32"></i>Awaiting approval</span>
        <span><i style="background:#c0395f"></i>Needs attention</span>
      </div>
      <div>Generated ${today}${DATA.validUntil?` · prices valid until <b style="color:var(--ink-2)">${esc(DATA.validUntil)}</b>`:''}</div>
    </div>`;
})();
</script>
</body>
</html>
