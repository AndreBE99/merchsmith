<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;}
a{color:var(--periwinkle-deep);} a:hover{color:var(--periwinkle-ink);}
.header{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line-soft);position:relative;z-index:25;}
.main{width:100%;max-width:none;padding:28px var(--page-gutter) 90px;}
.crumbband{background:var(--periwinkle);color:#fff;padding:13px var(--page-gutter);}
.crumb{font-size:14px;font-weight:600;display:flex;gap:9px;align-items:center;}
.crumb .sep{opacity:.6;}
.ptitle{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1;margin:0;}
.psub{font-size:14px;color:var(--text-soft);margin-top:9px;max-width:680px;line-height:1.55;}
</style>
</head>
<body>
<header class="header"><div class="brand" data-identity-lockup></div><div class="headtools"></div></header>
<div class="crumbband"><div class="crumb"><span class="crumb-org">Mojo Promotions</span><span class="sep">›</span><span class="here">Notifications</span></div></div>

  <div id="ntRoot"></div>
</div>
<script src="logos.js"></script>
<script src="avatars.js"></script>

<script src="names.js?v=2"></script>
<script src="address.js?v=1"></script>
<script src="people.js?v=19"></script>

<script src="chrome.js?v=5"></script>

<script>(function(){ let n=0; const iv=setInterval(()=>{ if(window.MSNOTIF||n++>30){ clearInterval(iv); if(window.MSNOTIF) MSNOTIF.mount(document.getElementById('ntRoot')); } },60); })();</script>
