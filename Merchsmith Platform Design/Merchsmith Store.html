<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchsmith — Store</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600&family=Fredoka:wght@500;600&family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script>if(/[?&]store=merchsmith\b/.test(location.search)) window.MS_SCOPE='platform';</script>
<script>if(/[?&]embed=1\b/.test(location.search))document.documentElement.classList.add('embed');</script>
<script src="theme.js?v=10"></script>
<script src="store-appearance.js?v=4"></script>
<script>if(!/[?&]store=merchsmith\b/.test(location.search)&&window.MSAPPEAR) MSAPPEAR.apply();</script>
<style>
*{box-sizing:border-box;}
body{margin:0;background:#fff;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;}
.icn{width:20px;height:20px;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
a{color:inherit;}
/* header */
.header{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line-soft);position:relative;z-index:25;}
.brand{display:flex;align-items:center;gap:14px;}
.crt-txt{font-weight:800;font-size:12px;line-height:1.04;color:var(--brand-black);}
.xsep-lg{color:#222;font-size:15px;}
.mojo{font-family:"Fredoka",var(--sans);font-weight:600;font-size:28px;line-height:1;color:var(--flare);}
.topnav{display:flex;align-items:center;gap:6px;}
.topnav a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink-3);font-weight:600;font-size:14px;padding:8px 13px;border-radius:999px;}
.topnav a.active,.topnav a:hover{color:var(--periwinkle-deep);}
.headtools{display:flex;align-items:center;gap:14px;}
.headtools .it{position:relative;color:var(--ink-2);cursor:pointer;}
.headtools .badge{position:absolute;top:-7px;right:-9px;background:var(--flare);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 3px;}
.account .av{width:30px;height:30px;border-radius:50%;background:var(--periwinkle);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;}
/* store sub-nav band */
.storeband{background:var(--slate,#51768c);color:#fff;padding:13px var(--page-gutter);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.crumb{font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center;opacity:.92;}
.crumb a{text-decoration:none;cursor:pointer;}
.crumb a:hover{text-decoration:underline;}
.crumb .here{font-weight:700;}
.storecats{display:flex;gap:20px;font-size:14px;font-weight:600;}
.storecats a{text-decoration:none;cursor:pointer;opacity:.92;}
.storecats a.active{text-decoration:underline;text-underline-offset:5px;opacity:1;}
.storecats a:hover{opacity:1;}
.main{max-width:none;margin:0;padding:30px var(--page-gutter) 90px;}
.main.home{max-width:none;margin:0;padding:30px var(--page-gutter) 90px;}
h1.page{font-family:var(--serif);font-weight:500;font-size:38px;margin:0 0 12px;letter-spacing:-.01em;}
.intro{font-size:14px;color:var(--text-soft);max-width:75ch;line-height:1.7;margin:0 0 30px;}
.dept-head{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start;margin-bottom:30px;}
.dept-head .intro{margin:0;}
.dept-hero{aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--paper-2);}
.dept-hero img{width:100%;height:100%;object-fit:cover;display:block;}
.dept-hero image-slot{display:block;width:100%;height:100%;}
@media(max-width:900px){.dept-head{grid-template-columns:1fr;}}
.featrow{margin:0 0 30px;}
.featrow-hd h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line-soft);letter-spacing:-.01em;}
.featcards{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;scrollbar-width:thin;}
.featcards::-webkit-scrollbar{height:7px;}
.featcards::-webkit-scrollbar-thumb{background:var(--line-soft);border-radius:99px;}
.featcard{border:0;background:none;padding:0;cursor:pointer;text-align:left;flex:0 0 230px;scroll-snap-align:start;}
.featcard .featimg{aspect-ratio:16/10;border-radius:4px;overflow:hidden;background:var(--paper-2);margin-bottom:9px;}
.featcard .featimg img{width:100%;height:100%;object-fit:cover;display:block;}
.featcard .featimg image-slot{display:block;width:100%;height:100%;}
.featcard span{font-size:15px;color:var(--ink);}
.featcard:hover span{text-decoration:underline;text-underline-offset:3px;}
.divider{border:0;border-top:1px solid var(--line-soft);margin:0 0 24px;}

/* department grid */
.deptgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 22px;}
@media(max-width:1000px){.deptgrid{grid-template-columns:repeat(2,1fr);}}
.depttile{cursor:pointer;}
.depttile .img{aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--paper-2);}
.depttile .img img,.depttile .img image-slot{width:100%;height:100%;object-fit:cover;}
.depttile h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:12px 0 0;}
.depttile:hover h3{color:var(--periwinkle-deep);}

/* listing layout */
.listing{display:grid;grid-template-columns:230px minmax(0,1fr);gap:30px;}
@media(max-width:900px){.listing{grid-template-columns:1fr;}}
.filters .fgroup{border-bottom:1px solid var(--line-soft);padding:16px 0;}
.filters .fgroup h4{cursor:pointer;position:relative;padding-right:20px;user-select:none;}
.fopt .fcnt{color:var(--muted);font-size:11px;font-weight:600;}
/* single-handle slider (delivery time, sustainability) — same look as the price slider */
.srange{position:relative;padding:8px 0 2px;max-width:230px;}
.srange .sr-track{height:1.5px;background:var(--ink-3);border-radius:2px;margin:8px 8px 0;position:relative;}
.srange .sr-track::before,.srange .sr-track::after{content:'';position:absolute;top:-5px;width:1px;height:6px;background:var(--line);}
.srange .sr-track::before{left:-7px;}
.srange .sr-track::after{right:-7px;}
.srange input[type=range]{position:absolute;left:0;right:0;top:8px;width:100%;height:18px;margin:0;-webkit-appearance:none;appearance:none;background:none;}
.srange input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:99px;background:var(--blossom,#eaa59b);border:2.5px solid var(--blossom,#eaa59b);box-shadow:inset 0 0 0 2.5px #fff;cursor:grab;transition:transform .15s,box-shadow .15s;}
.srange input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);box-shadow:inset 0 0 0 2.5px #fff,0 0 0 5px rgba(234,165,155,.25);}
.srange input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;}
.srange input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:99px;background:var(--blossom,#eaa59b);border:2.5px solid var(--blossom,#eaa59b);box-shadow:inset 0 0 0 2.5px #fff;cursor:grab;}
.srange .pr-vals{display:flex;justify-content:space-between;margin-top:12px;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-3);}
.srange .pr-vals span:last-child,.prange .pr-vals span{color:var(--ink);}
/* info icon + note */
.finfo{width:17px;height:17px;border-radius:99px;border:1.4px solid var(--ink-3);background:none;color:var(--ink-3);font-family:var(--serif);font-style:italic;font-size:11px;font-weight:600;line-height:1;cursor:pointer;display:inline-grid;place-items:center;padding:0;flex:none;}
.finfo:hover{border-color:var(--ink);color:var(--ink);}
.finote{display:none;position:absolute;z-index:30;left:0;right:-10px;top:calc(100% + 8px);background:var(--ink);color:#fff;font-size:12px;font-weight:500;line-height:1.5;letter-spacing:0;text-transform:none;border-radius:10px;padding:10px 13px;box-shadow:0 10px 30px rgba(20,22,45,.25);}
.finote.open{display:block;}
.fgroup h4{position:relative;}
/* dual-handle price slider */
.prange{position:relative;padding:8px 0 2px;max-width:230px;}
.prange .pr-track{position:relative;height:1.5px;background:var(--line-soft);border-radius:2px;margin:8px 8px 0;}
.prange .pr-fill{position:absolute;top:0;bottom:0;background:var(--ink);border-radius:2px;}
.prange input[type=range]{position:absolute;left:0;right:0;top:8px;width:100%;height:18px;margin:0;-webkit-appearance:none;appearance:none;background:none;pointer-events:none;}
.prange input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:99px;background:var(--blossom,#eaa59b);border:2.5px solid var(--blossom,#eaa59b);box-shadow:inset 0 0 0 2.5px #fff;cursor:grab;pointer-events:auto;transition:transform .15s,box-shadow .15s;}
.prange input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);box-shadow:inset 0 0 0 2.5px #fff,0 0 0 5px rgba(234,165,155,.25);}
.prange input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;}
.prange input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:99px;background:var(--blossom,#eaa59b);border:2.5px solid var(--blossom,#eaa59b);box-shadow:inset 0 0 0 2.5px #fff;cursor:grab;pointer-events:auto;}
.prange .pr-vals{display:flex;justify-content:space-between;margin-top:12px;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink);}
.fcal-hd{display:flex;gap:6px;align-items:center;margin-bottom:8px;}
.fcal-hd select{font-family:var(--sans);font-size:12px;font-weight:700;border:1px solid var(--line-soft);border-radius:8px;padding:5px 6px;background:#fff;color:var(--ink);cursor:pointer;}
.fcal-hd select:focus{outline:0;border-color:var(--periwinkle);}
.fcal-nav{margin-left:auto;display:flex;gap:2px;}
.fcal-nav button{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:11px;padding:4px 5px;}
.fcal-nav button:hover{color:var(--ink);}
.fcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;text-align:center;}
.fcal-grid .dow{font-size:10.5px;font-weight:700;color:var(--muted);padding:4px 0;}
.fcal-grid .day{border:0;background:none;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink);padding:6px 0;cursor:pointer;border-radius:7px;transition:background .15s;}
.fcal-grid .day:hover{background:var(--paper-2);}
.fcal-grid .day.off{color:var(--line);cursor:default;background:none;}
.fcal-grid .day.sel{background:var(--ink);color:#fff;}
.fcal-clear{margin-top:8px;border:0;background:none;font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--periwinkle-deep);cursor:pointer;padding:0;text-decoration:underline;}
.filters .fgroup h4::after{content:'';position:absolute;right:4px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .18s ease;}
.filters .fgroup.closed h4::after{transform:translateY(-35%) rotate(-135deg);}
.filters .fgroup.closed h4{margin-bottom:0;}
.filters .fgroup.closed>*:not(h4){display:none;}
.filters .fgroup:first-child{padding-top:0;}
.fgroup h4{font-size:14px;font-weight:700;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;}
.fopt{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);padding:4px 0;cursor:pointer;}
.fopt input{width:15px;height:15px;accent-color:var(--periwinkle-deep);}
.fopt .sw{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}
.fmore{margin-top:8px;background:none;border:0;padding:2px 0;font:inherit;font-size:12.5px;font-weight:700;color:var(--periwinkle-deep);cursor:pointer;}
.ptag.promo{background:transparent;color:#b08424;border:1px solid currentColor;font-weight:600;}
.hm-spot{position:relative;border-radius:22px;background:var(--periwinkle-ink,#3C4279);color:#fff;overflow:hidden;padding:0;}
.hm-spotslide{display:none;}
.hm-spotslide.on{display:grid;grid-template-columns:1fr 1.1fr;gap:0;align-items:stretch;animation:hmqfade .4s ease both;}
.hm-spotimg{background:#fff;display:grid;place-items:center;min-height:280px;}
.hm-spotimg img{width:100%;height:100%;max-height:340px;object-fit:contain;padding:24px;box-sizing:border-box;}
.hm-spotcopy{padding:38px 40px;display:flex;flex-direction:column;justify-content:center;gap:12px;}
.hm-spottag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;}
.hm-spotcopy h2{font-family:var(--serif);font-weight:500;font-size:clamp(24px,3vw,34px);line-height:1.12;margin:0;letter-spacing:-.01em;}
.hm-spotcopy p{font-size:14.5px;line-height:1.55;opacity:.85;margin:0;max-width:46ch;}
.hm-spotrow{display:flex;align-items:center;gap:18px;margin-top:6px;}
.hm-spotrow b{font-size:17px;}
.hm-spotdots{position:absolute;bottom:16px;right:20px;}
.hm-spotdots i{background:rgba(255,255,255,.35);}
.hm-spotdots i.on{background:#fff;}
@media(max-width:760px){.hm-spotslide.on{grid-template-columns:1fr;}.hm-spotimg{min-height:200px;}}
.fmore:hover{text-decoration:underline;}
/* grouped colour swatches */
.colsw:hover i{box-shadow:0 0 0 1px rgba(0,0,0,.08),0 0 0 2px #fff,0 0 0 3.5px var(--ink-3);}
.colsw:hover{z-index:2;}
.colsw:hover span{opacity:1;}
.colswatches{display:flex;flex-wrap:wrap;gap:9px;padding-top:8px;}
.colsw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;padding:0;width:40px;}
.colsw i{width:20px;height:20px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.08);transition:box-shadow .18s ease;}
.colsw i.rainbow{background:conic-gradient(#e0393e,#f28a00,#efe12a,#2cb567,#3d6be0,#7a0fae,#ef3f96,#e0393e)!important;}
.colsw span{font-size:10.5px;color:var(--ink-2);line-height:1;opacity:0;transition:opacity .15s;}
.colsw.on i{box-shadow:0 0 0 1px rgba(0,0,0,.08),0 0 0 2px #fff,0 0 0 3.5px var(--periwinkle-deep);}
.colsw.on span{color:var(--periwinkle-deep);font-weight:700;opacity:1;}
/* editable image overlay */
[data-editimg]{position:relative;}
.img-edit{position:absolute;top:7px;right:7px;width:28px;height:28px;border:0;border-radius:7px;background:rgba(20,22,45,.62);color:#fff;font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .15s;z-index:3;}
[data-editimg]:hover .img-edit{opacity:1;}
.img-edit:hover{background:var(--periwinkle-deep);}
.frange{margin-top:8px;}
.frange input[type=range]{width:100%;accent-color:var(--periwinkle-deep);}
.frange .rl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:3px;}
.listtop{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:12px;margin-bottom:22px;}
.listtop{margin-bottom:18px;}
.listtop .cnt{font-size:13px;color:var(--text-soft);}
.listtools{display:flex;align-items:center;gap:14px;}
.viewseg{display:inline-flex;background:var(--paper-2);border-radius:9px;padding:3px;}
.viewseg .vs-b{border:0;background:none;border-radius:7px;padding:5px 9px;cursor:pointer;color:var(--muted);display:grid;place-items:center;}
.viewseg .vs-b .icn{width:16px;height:16px;}
.viewseg .vs-b.on{background:#fff;color:var(--periwinkle-deep);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.sortsel-w{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;}
.sortsel{font:inherit;font-size:13px;font-weight:600;color:var(--ink);border:1px solid var(--line-soft);border-radius:9px;padding:7px 10px;background:#fff;cursor:pointer;}
.sortsel:focus{outline:0;border-color:var(--periwinkle);}
/* list view */
.pgrid.listview{display:flex;flex-direction:column;gap:14px;container-type:inline-size;}
.pgrid.listview .pcard.prow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:22px;align-items:center;background:#fff;border-radius:12px;padding:14px 20px 14px 14px;}
.pgrid.listview .prow-main{min-width:0;}
.pgrid.listview .pcard.prow .pimg{aspect-ratio:1;width:150px;padding:10px;border:0;background:#fff;}
.pgrid.listview .pcard.prow h3{white-space:normal;font-size:15px;margin:0 0 5px;}
.pgrid.listview .pcard.prow .pdesc{-webkit-line-clamp:2;margin-bottom:8px;}
.pgrid.listview .prow-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0;}
.pgrid.listview .prow-main .pmeta{margin-top:8px;}
.pgrid.listview .prow-side .pmeta{white-space:normal;text-align:right;}
@container (max-width:640px){.pgrid.listview .pcard.prow{grid-template-columns:96px minmax(0,1fr);}.pgrid.listview .pcard.prow .pimg{width:96px;}.pgrid.listview .prow-side{grid-column:2;align-items:flex-start;}.pgrid.listview .prow-side .pmeta{text-align:left;}}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:46px 30px;}
@media(max-width:1680px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(max-width:1360px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(max-width:1150px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:600px){.pgrid{grid-template-columns:minmax(0,1fr);}}
.pcard{cursor:pointer;min-width:0;}
.pcard .pimg{aspect-ratio:1;border-radius:6px;overflow:hidden;background:#fff;display:grid;place-items:center;position:relative;padding:12%;box-sizing:border-box;}
.pcard .pimg img,.pcard .pimg image-slot{width:100%;height:100%;object-fit:contain;}
/* hover: second product image crossfades in (merchery-style) */
.pcard .pimg .pc-alt{position:absolute;inset:12%;width:76%;height:76%;object-fit:contain;background:#fff;opacity:0;transition:opacity .28s ease;z-index:2;}
.pcard:hover .pimg .pc-alt{opacity:1;}
.pcard .pimg img:first-of-type{transition:transform .35s ease;}
.pcard:hover .pimg img:first-of-type{transform:scale(1.03);}
.pcard .ptag{position:absolute;top:9px;left:9px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--periwinkle-deep);border:1px solid currentColor;border-radius:5px;padding:3px 8px;}
.pcard h3{font-family:var(--serif);font-weight:500;font-size:15.5px;letter-spacing:0;margin:14px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard:hover h3{color:var(--periwinkle-deep);}
.pcard .pdesc{font-size:12.5px;color:var(--text-soft);line-height:1.5;margin:0 0 11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pcard .pmeta{font-size:12.5px;color:var(--ink-2);}
.pcard .pmeta b{color:var(--ink);}
.susc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--green-deep);background:var(--tint-green);border-radius:999px;padding:2px 9px;margin-top:6px;}
.empty{color:var(--muted);font-size:14px;padding:40px 0;}

/* distributor: is this product stocked? */
.dv-range{margin:34px 0 0;display:flex;align-items:center;gap:13px;background:#fff;border:1.5px solid var(--line-soft);border-radius:13px;padding:14px 17px;}
.dv-range.in{border-color:var(--spearmint,#36C0A0);background:var(--tint-green,#f0fbf7);}
.dv-range.locked{background:var(--paper-2);}
.dv-rdot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none;}
.dv-range.in .dv-rdot{background:var(--spearmint,#36C0A0);}
.dv-rtx{display:flex;flex-direction:column;line-height:1.35;margin-right:auto;}
.dv-rtx b{font-size:14.5px;}
.dv-rtx span{font-size:12.5px;color:var(--ink-2);}
.dv-rbtn{font:inherit;font-size:13px;font-weight:800;white-space:nowrap;border:1.5px solid var(--periwinkle-deep);background:#fff;color:var(--periwinkle-deep);border-radius:999px;padding:8px 17px;cursor:pointer;}
.dv-rbtn.on{background:var(--spearmint,#36C0A0);border-color:var(--spearmint,#36C0A0);color:#fff;}
.dv-rbtn:hover{opacity:.9;}
.dv-rlink{font-size:12.5px;font-weight:700;color:var(--periwinkle-deep);text-decoration:none;white-space:nowrap;}
.dv-rlink:hover{text-decoration:underline;}

/* product page */
.pp{display:grid;grid-template-columns:1.1fr 1fr;gap:46px;}
@media(max-width:900px){.pp{grid-template-columns:1fr;}}
.pp-gallery{display:flex;flex-direction:column;align-self:stretch;height:100%;}
.pp-gallery .stage{position:relative;width:min(100%,640px);aspect-ratio:1;border-radius:6px;background:#fff;display:grid;place-items:center;overflow:hidden;margin:auto;}
.pp-gallery .pp-galrow{margin-top:auto;}
.pp-gallery .stage img,.pp-gallery .stage image-slot{width:100%;height:100%;object-fit:contain;}
.pp-info .swrow .sw.on,.pp-info .swrow .sw2.on{box-shadow:0 0 0 2px var(--periwinkle-deep);}
.pp-info h1{font-family:var(--serif);font-weight:500;font-size:30px;margin:0 0 4px;letter-spacing:-.01em;}
.pp-sku{font-size:12.5px;color:var(--muted);margin-bottom:18px;}
.addproj{position:relative;display:inline-block;margin-bottom:22px;}
.addproj .btn{display:inline-flex;align-items:center;gap:9px;background:var(--blossom,#eaa59b);color:var(--ink);border:0;border-radius:11px;padding:11px 18px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;}
.addproj .menu{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line-soft);border-radius:12px;box-shadow:0 14px 34px rgba(20,22,45,.16);padding:6px;min-width:200px;display:none;z-index:5;}
.addproj.open .menu{display:block;}
.addproj .menu button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:13.5px;padding:9px 12px;border-radius:8px;cursor:pointer;}
.addproj .menu button:hover{background:var(--paper-2);}
.addproj .menu .new{font-style:italic;color:var(--periwinkle-deep);border-top:1px solid var(--line-soft);}
.spec{border-top:1px solid var(--line-soft);padding-top:18px;}
.spec h4{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 12px;}
.spec .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13.5px;}
.spec .kv .k{color:var(--text-soft);}
.spec .kv .v{color:var(--ink);font-weight:600;}
.swrow{display:flex;gap:7px;align-items:center;}
.swrow .sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}
/* USP strip (phase 1) */
.usps{background:var(--paper);border-radius:14px;padding:26px 30px;margin-top:34px;}
.usps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
@media(max-width:760px){.usps-grid{grid-template-columns:repeat(2,1fr);}}
.usp{display:flex;flex-direction:column;gap:9px;}
.usp .ic{width:40px;height:40px;border-radius:11px;background:#fff;border:1px solid var(--line-soft);display:grid;place-items:center;color:var(--periwinkle-deep);}
.usp .ic .icn{width:21px;height:21px;}
/* distributor view panel + accordions */
.dv-notes{margin-top:12px;background:#fff;border:1.5px solid var(--periwinkle);border-radius:16px;padding:16px 18px;}
.dv-nhd{border-bottom:1px solid var(--line-soft);padding-bottom:11px;}
.dv-nhd{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.dv-nhd .icn{width:17px;height:17px;color:var(--periwinkle-deep);}
.dv-nhd b{font-size:13.5px;}
.msdef-banner{padding:12px var(--page-gutter,clamp(20px,2.5vw,36px)) 0;font-size:13px;}
.msdef-banner a{color:var(--ink-3);font-weight:700;text-decoration:none;}
.msdef-banner a:hover{color:var(--ink);text-decoration:underline;}
.dv-racts{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:nowrap;margin-left:auto;}
.dv-range .dv-rtx{flex:1 1 220px;min-width:0;}
.dv-range:has(.dv-racts){flex-wrap:wrap;}
.dv-rbtn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line-soft);}
.dv-rbtn.ghost:hover{border-color:var(--periwinkle);}
.dv-rsel{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--ink);background:#fff;
  border:1.5px solid var(--line-soft);border-radius:999px;padding:9px 14px;cursor:pointer;}
.dv-range.rec-pend{background:#fbeccd;border-color:#e3b24f;}
.dv-range.rec-pend .dv-rdot{background:#c98a14;}
.dv-range.rec-feat{background:var(--tint-peri,#eceefb);border-color:var(--periwinkle);}
.dv-range.rec-feat .dv-rdot{background:var(--periwinkle-deep);}
.dv-panel{margin-top:12px;border:1.5px solid var(--periwinkle);border-radius:16px;overflow:hidden;background:#fff;}
.dv-head{display:flex;align-items:center;gap:13px;padding:16px 20px;background:var(--tint-peri);border-bottom:1px solid var(--line-soft);width:100%;border:0;cursor:pointer;font:inherit;text-align:left;}
.dv-head .dv-pchev{width:18px;height:18px;color:var(--periwinkle-deep);transform:rotate(90deg);transition:transform .2s;flex:none;}
.dv-panel.collapsed .dv-head{border-bottom:0;}
.dv-panel.collapsed .dv-head .dv-pchev{transform:rotate(0deg);}
.dv-panel.collapsed .dv-acclist{display:none;}
.dv-head>div{flex:1;}
.dv-head>.icn{width:22px;height:22px;color:var(--periwinkle-deep);flex:none;}
.dv-head b{display:block;font-size:15px;color:var(--ink);}
.dv-head span{font-size:12.5px;color:var(--ink-2);}
.dv-badge{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--periwinkle-deep);border-radius:999px;padding:4px 11px;}
.dv-acc{border-top:1px solid var(--line-soft);}
.dv-acc:first-of-type{border-top:0;}
.dv-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;padding:15px 20px;cursor:pointer;font:inherit;text-align:left;}
.dv-h b{font-size:14.5px;color:var(--ink);}
.dv-h>span{display:flex;flex-direction:column;gap:1px;}
.dv-h>span>span{font-size:12px;color:var(--muted);font-weight:500;}
.dv-chev{width:16px;height:16px;color:var(--muted);transform:rotate(90deg);transition:transform .2s;flex:none;}
.dv-acc.open .dv-chev{transform:rotate(-90deg);}
.dv-b{display:none;padding:4px 20px 20px;}
.dv-acc.open .dv-b{display:block;animation:dvFade .25s ease both;}
@keyframes dvFade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.dv-kv{display:grid;grid-template-columns:170px 1fr;gap:9px 16px;font-size:13.5px;}
.dv-kv .k{color:var(--text-soft);}
.dv-kv .v{color:var(--ink);font-weight:600;}
.dv-kv .v .sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block;vertical-align:-3px;}
.dv-matrix{width:100%;border-collapse:collapse;font-size:13px;}
.dv-matrix th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 14px 8px 0;border-bottom:1.5px solid var(--line-soft);}
.dv-matrix th:not(:first-child),.dv-matrix td:not(:first-child){text-align:right;}
.dv-matrix td{padding:9px 14px 9px 0;border-bottom:1px solid var(--paper-2);color:var(--ink-2);}
.dv-matrix td b{color:var(--periwinkle-deep);}
.dv-note{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 0 0;}
.dv-mtx2 td:first-child,.dv-mtx2 th:first-child{white-space:nowrap;}
.dv-mtx2 .dv-sub td{border-top:1.5px solid var(--line-soft);font-weight:700;color:var(--ink);}
/* sample cost — store backend */
.sc-intro{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin:0 0 14px;}
.sc-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:680px){.sc-cards{grid-template-columns:1fr;}}
.sc-card{border:1px solid var(--line-soft);border-radius:12px;padding:14px;background:#fff;}
.sc-h{margin-bottom:10px;}
.sc-h b{font-size:14px;color:var(--ink);}
.sc-modes{display:flex;gap:6px;margin-bottom:11px;}
.sc-mode{flex:1;font:inherit;font-size:11px;font-weight:700;padding:7px 5px;border-radius:8px;border:1px solid var(--line-soft);background:#fff;color:var(--ink-2);cursor:pointer;}
.sc-mode.on{background:var(--periwinkle-deep);border-color:var(--periwinkle-deep);color:#fff;}
.sc-grid{display:flex;gap:7px;}
.sc-cell{flex:1;background:var(--paper);border-radius:9px;padding:7px 8px;text-align:center;}
.sc-cell span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.sc-cell b{font-size:13px;color:var(--ink);}
.sc-cell.sell{background:#fdf2e3;}
.sc-cell.sell b{color:#9a6b1f;}
.sc-edit{display:inline-flex;align-items:center;gap:2px;}
.sc-pound{font-size:12px;font-weight:700;color:var(--muted);}
.sc-cost,.sc-sell{border:0;outline:0;border-bottom:1.5px solid var(--line-soft);background:none;font:inherit;font-size:13px;font-weight:700;width:54px;text-align:center;color:var(--ink);}
.sc-cell.sell .sc-sell{color:#9a6b1f;border-color:#f0d9b0;}
.sc-await{color:var(--muted);font-size:12px;}
.sc-custom{color:#9a6b1f;}
.sc-reset{border:0;background:none;font-size:13px;color:var(--periwinkle-deep);cursor:pointer;padding:0 0 0 4px;vertical-align:middle;}
.sc-reset:hover{color:var(--periwinkle-ink);}
.sc-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.sc-act{font:inherit;font-size:12px;font-weight:700;background:none;border:1px solid var(--line-soft);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink-2);}
.sc-act.req{color:var(--sky,#0097D8);border-color:color-mix(in srgb,var(--sky) 40%,#fff);}
.sc-act.req:hover{background:color-mix(in srgb,var(--sky) 8%,#fff);}
.sc-act.quiet{color:var(--muted);}
.sc-act.quiet:hover{border-color:var(--muted);}
.sc-chip{margin-top:10px;border-radius:9px;padding:9px 11px;}
.sc-chip b{display:block;font-size:11px;letter-spacing:.02em;text-transform:uppercase;}
.sc-chip span{font-size:12px;color:var(--ink-2);line-height:1.45;}
.sc-chip.pending{background:#fff8e6;border:1px solid #e7c98f;}
.sc-chip.pending b{color:#9a6b1f;}
.sc-chip.received{background:var(--tint-green,#e8f4ec);border:1px solid color-mix(in srgb,var(--green-deep,#2f8f5b) 35%,#fff);}
.sc-chip.received b{color:var(--green-deep,#2f8f5b);}
.sc-form{margin-top:10px;border:1px solid var(--line-soft);border-radius:10px;padding:11px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--paper);}
.sc-form label{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px;}
.sc-form input,.sc-form select{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--line-soft);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);width:92px;text-transform:none;letter-spacing:0;}
.sc-form input.sc-ffrom{width:150px;}
.sc-form input.sc-fref{width:104px;}
.sc-form select{width:auto;}
.sc-form input:focus,.sc-form select:focus{outline:0;border-color:var(--periwinkle-deep);}
.sc-factions{display:flex;gap:8px;}
.sc-hint{margin:10px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5;}
/* distributor per-field overrides */
.ov-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink-2);margin:0 0 8px;flex-wrap:wrap;}
.ov-summary b{color:var(--periwinkle-deep);}
.ov-clearall{font:inherit;font-size:12px;font-weight:700;color:var(--flare);background:none;border:1px solid color-mix(in srgb,var(--flare) 35%,#fff);border-radius:8px;padding:6px 11px;cursor:pointer;}
.ov-clearall:hover{background:color-mix(in srgb,var(--flare) 7%,#fff);}
.ov-note{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 14px;}
.ov-group{margin:0 0 16px;}
.ov-group h5{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
.ov-row{display:grid;grid-template-columns:180px 1fr 1fr;gap:12px;align-items:start;padding:9px 10px;border:1px solid var(--paper-2);border-radius:10px;margin-bottom:6px;background:#fff;}
.ov-row.ov-on{border-color:var(--periwinkle);background:var(--tint-peri);}
.ov-lbl b{display:block;font-size:12.5px;color:var(--ink);}
.ov-aud{display:inline-block;margin-top:3px;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 6px;}
.ov-aud.customer{background:var(--tint-green);color:var(--green-deep);}
.ov-aud.dist{background:var(--paper-2);color:var(--muted);}
.ov-feedv{font-size:12px;color:var(--muted);line-height:1.5;word-break:break-word;max-height:64px;overflow:hidden;}
.ov-feedv i{display:block;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);opacity:.7;}
.ov-edit{display:flex;gap:6px;align-items:flex-start;}
.ov-in{flex:1;font:inherit;font-size:12.5px;font-weight:600;border:1.5px solid var(--line-soft);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);min-width:0;}
.ov-in:focus{outline:0;border-color:var(--periwinkle-deep);}
.ov-row.ov-on .ov-in{border-color:var(--periwinkle);}
textarea.ov-in{resize:vertical;}
.ov-reset{border:1.5px solid var(--line-soft);background:#fff;border-radius:8px;width:30px;height:32px;font-size:14px;color:var(--periwinkle-deep);cursor:pointer;flex:none;}
.ov-reset:hover{border-color:var(--periwinkle-deep);}
.ov-imgrow{flex:1;}
.ov-img{width:150px;height:96px;}
/* product-page: USP stories, team reviews, also-like */
.pp-stories{display:flex;flex-direction:column;gap:26px;margin:44px 0 10px;}
.pp-story{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;padding:6px 0;}
.pp-story.flip{grid-template-columns:1fr 1.05fr;}
.pp-story.flip .pp-storyimg{order:2;}
.pp-storyimg{height:300px;}
.pp-storyimg image-slot{width:100%;height:100%;}
.pp-storycopy{padding:6px 12px;}
.pp-q{font-family:var(--serif);font-weight:500;font-size:clamp(21px,2.6vw,30px);line-height:1.22;letter-spacing:-.01em;color:var(--ink);margin:0 0 14px;text-wrap:pretty;}
.pp-qby{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.pp-reviews{margin:44px 0 10px;border:1px solid var(--line-soft);border-radius:20px;background:#fff;overflow:hidden;}
.pp-revhd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer;padding:20px 26px;}
.pp-revhd:hover{background:var(--paper);}
.pp-revsum{font-size:13px;color:var(--ink-2);}
.pp-revchev{width:16px;height:16px;margin-left:auto;transform:rotate(90deg);transition:transform .18s;stroke:var(--muted);flex:none;}
.pp-reviews.open .pp-revchev{transform:rotate(-90deg);}
.pp-revbody{display:none;padding:0 26px 26px;}
.pp-reviews.open .pp-revbody{display:block;}
.pp-revhd h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0;}
.pp-revpriv{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);background:none;border:0;padding:0;white-space:nowrap;}
/* gallery: variant thumbs + zoom */
.pp-gallery .stage{cursor:zoom-in;}
.pp-zoom{position:absolute;right:12px;bottom:12px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line-soft);background:rgba(255,255,255,.92);font-size:17px;color:var(--ink-2);cursor:pointer;line-height:1;}
.pp-gallery .pp-zoom:hover{color:var(--periwinkle-deep);border-color:var(--periwinkle-deep);}
.pp-galrow{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap;}
.pp-galth{width:56px;height:56px;border:1.5px solid var(--line-soft);border-radius:10px;background:#fff;padding:3px;cursor:pointer;}
.pp-galth.on{border-color:var(--periwinkle-deep);}
.pp-galth img{width:100%;height:100%;object-fit:contain;}
.pp-lightbox{position:fixed;inset:0;z-index:400;background:rgba(20,22,28,.82);backdrop-filter:blur(4px);display:grid;place-items:center;cursor:zoom-out;}
.pp-lightbox img{max-width:min(92vw,1000px);max-height:88vh;object-fit:contain;background:#fff;border-radius:16px;padding:18px;box-sizing:border-box;}
.pp-lbx{position:absolute;top:18px;right:22px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px;line-height:1;cursor:pointer;}
.pp-lbx:hover{background:rgba(255,255,255,.28);}
.pp-revavg{margin-left:auto;font-size:13px;color:var(--ink-2);}
.pp-revavg b{color:#c9962a;letter-spacing:1px;}
.pp-revlist{display:flex;flex-direction:column;gap:10px;margin:0 0 18px;}
.pp-rev{border:1px solid var(--paper-2);border-radius:12px;padding:13px 15px;background:var(--paper);}
.pp-revtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px;}
.pp-revstars{color:#c9962a;letter-spacing:1.5px;font-size:13px;}
.pp-revwho{font-size:12.5px;font-weight:700;color:var(--ink);}
.pp-revdate{margin-left:auto;font-size:11.5px;color:var(--muted);}
.pp-rev p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55;}
.pp-revempty{font-size:13.5px;color:var(--muted);margin:0 0 18px;}
.pp-revform{border-top:1px solid var(--paper-2);padding-top:16px;}
.pp-revform h4{margin:0 0 10px;font-size:13.5px;}
.pp-revform h4 span{font-weight:500;font-size:12px;color:var(--muted);margin-left:6px;}
.pp-revstarsin{display:flex;gap:2px;margin:0 0 10px;}
.pp-revstarsin button{border:0;background:none;font-size:24px;line-height:1;color:#d8d2c4;cursor:pointer;padding:2px;}
.pp-revstarsin button.on{color:#c9962a;}
.pp-revform textarea{width:100%;font:inherit;font-size:13.5px;border:1.5px solid var(--line-soft);border-radius:10px;padding:10px 12px;resize:vertical;background:var(--paper);box-sizing:border-box;}
.pp-revform textarea:focus{outline:0;border-color:var(--periwinkle-deep);background:#fff;}
.pp-revrow{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.pp-revrow input{font:inherit;font-size:13px;border:1.5px solid var(--line-soft);border-radius:10px;padding:9px 12px;background:#fff;flex:1;min-width:140px;}
.pp-revrow input:focus{outline:0;border-color:var(--periwinkle-deep);}
.pp-also{margin:44px 0 10px;}
.pgrid.pgrid4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:900px){.pgrid.pgrid4{grid-template-columns:repeat(2,1fr);}.pp-story,.pp-story.flip{grid-template-columns:1fr;}.pp-story.flip .pp-storyimg{order:0;}.pp-storyimg{height:220px;}}
@media(max-width:760px){.ov-row{grid-template-columns:1fr;}}
.sc-reqquote{margin-top:10px;font:inherit;font-size:12px;font-weight:700;color:var(--sky,#0097D8);background:none;border:1px solid color-mix(in srgb,var(--sky) 40%,#fff);border-radius:8px;padding:7px 12px;cursor:pointer;}
.sc-reqquote:hover{background:color-mix(in srgb,var(--sky) 8%,#fff);}
.sc-quote{margin-top:10px;background:color-mix(in srgb,var(--sky) 9%,#fff);border:1px solid color-mix(in srgb,var(--sky) 40%,#fff);border-radius:9px;padding:9px 11px;}
.sc-quote b{display:block;font-size:11px;letter-spacing:.02em;text-transform:uppercase;color:var(--sky,#0097D8);}
.sc-quote span{font-size:12px;color:var(--ink-2);line-height:1.45;}
.sc-cv{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px;}
.sc-cv h5{margin:0 0 9px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;}
/* brand-builder swatches & variants (match the modal) */
.bb-swatches{display:flex;gap:9px;flex-wrap:wrap;}
.bb-sw{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line-soft);border-radius:10px;padding:6px 11px 6px 7px;background:#fff;}
.bb-sw.on{border-color:var(--periwinkle-deep);box-shadow:inset 0 0 0 1px var(--periwinkle-deep);}
.bb-sw i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.12);flex:none;}
.bb-sw span{display:flex;flex-direction:column;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.2;}
.bb-sw small{font-weight:600;color:var(--muted);font-size:10.5px;}
.bb-vars{display:flex;gap:7px;flex-wrap:wrap;}
.bb-var{font-size:12.5px;font-weight:700;border:1.5px solid var(--line-soft);border-radius:8px;padding:6px 12px;color:var(--ink-2);background:#fff;}
.bb-var.on{border-color:var(--periwinkle-deep);color:var(--periwinkle-deep);}
.dv-mtx2 .dv-sell td{background:var(--tint-peri);color:var(--periwinkle-ink);}
.dv-mtx2 .dv-sell td b{color:var(--periwinkle-ink);}
.dv-mtx2 .dv-profit td{color:var(--green-deep);font-weight:700;}
.dv-mtx2 .dv-deliv td{color:var(--ink-2);}
/* deep price matrix (per Price Matrix Concept) */
.mx-tabs{display:flex;gap:4px;background:var(--paper-2);border-radius:10px;padding:3px;margin:0 0 14px;width:max-content;max-width:100%;}
.mx-tab{border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-3);padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.mx-tab.on{background:#fff;color:var(--periwinkle-deep);box-shadow:0 1px 4px rgba(20,22,45,.1);}
.mx-bar{display:flex;align-items:center;gap:12px;margin:0 0 10px;flex-wrap:wrap;}
.mx-mode{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line-soft);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;}
.mx-mode .mx-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:.15s;}
.mx-mode.on{border-color:var(--periwinkle-deep);color:var(--periwinkle-deep);}
.mx-mode.on .mx-dot{border-color:var(--periwinkle-deep);background:var(--periwinkle-deep);box-shadow:inset 0 0 0 2.5px #fff;}
.mx-legend{font-size:12px;color:var(--muted);}
.mx-deep{min-width:840px;}
.mx-deep td,.mx-deep th{padding-right:10px;}
.mx-deep .mx-unb td{background:var(--tint-peri);font-weight:700;color:var(--periwinkle-ink);}
.mx-deep .mx-method td{padding-top:14px;border-bottom:0;}
.mx-deep .mx-method b{font-size:13.5px;color:var(--ink);}
.mx-deep .mx-code{color:var(--muted);font-weight:700;font-size:11.5px;}
.mx-deep .mx-setup td{background:var(--paper);font-size:11.5px;color:var(--text-soft);font-weight:600;}
.mx-deep .mx-deliv td{background:var(--paper);font-weight:700;color:var(--ink);border-top:1.5px solid var(--line-soft);}
.mx-deep .mx-profit td{background:var(--tint-green);font-weight:700;color:var(--green-deep);}
.mx-deep .mx-ptotal td{font-weight:800;border-top:1px solid rgba(47,143,91,.3);}
.mx-calc{font-size:13px;max-width:520px;}
.mx-calc .line{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--paper-2);}
.mx-calc .line .k{color:var(--ink-2);}
.mx-calc .line .v{font-weight:700;color:var(--ink);text-align:right;}
.mx-calc .line.total{font-weight:800;border-top:1.5px solid var(--line-soft);}
.mx-calc .line .v b{color:var(--periwinkle-deep);}
.usp b{font-size:14px;}
.usp span{font-size:12.5px;color:var(--text-soft);line-height:1.5;}
.ppback{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--periwinkle-deep);background:none;border:0;cursor:pointer;margin-bottom:18px;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:200;opacity:0;transition:opacity .25s,transform .25s;}
.toast.on{opacity:1;transform:translateX(-50%);}
/* ---- HOME (merchery-style) ---- */
.hm-hero{padding:8px 0 0;}
.hm-hero h1{font-family:var(--serif);font-size:clamp(36px,6.5vw,72px);line-height:1;letter-spacing:-.02em;font-weight:500;max-width:15ch;margin-bottom:24px;}
.hm-heroact{display:flex;gap:14px;margin-bottom:34px;flex-wrap:wrap;}
.hm-btn{border-radius:999px;padding:14px 26px;font-size:15px;font-weight:700;border:1.5px solid var(--periwinkle-deep);cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--periwinkle-deep);text-decoration:none;}
.hm-btn.solid{background:var(--periwinkle-deep);color:#fff;}
.hm-btn.solid:hover{filter:brightness(.93);}
.hm-btn.ghost:hover{background:var(--periwinkle-deep);color:#fff;}
.hm-heroimg{position:relative;width:100%;aspect-ratio:21/9;border-radius:10px;overflow:hidden;background:var(--paper-2);}
.hm-heroimg img{width:100%;height:100%;object-fit:cover;}
.hm-herocap{position:absolute;left:18px;bottom:16px;background:rgba(255,255,255,.88);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:700;backdrop-filter:blur(4px);}
.hm-marquee{overflow:hidden;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);margin-top:42px;padding:24px 0;}
/* trust USP bar (under hero) */
.hm-usps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;}
.hm-usp{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line-soft);border-radius:14px;padding:16px 18px;}
.hm-uspic{width:40px;height:40px;border-radius:11px;background:var(--tint-peri);color:var(--periwinkle-deep);display:grid;place-items:center;flex:none;}
.hm-uspic .icn{width:19px;height:19px;}
.hm-uspic img{width:24px;height:24px;object-fit:contain;border-radius:5px;}
.hm-mlogo{display:flex;align-items:center;}
.hm-mlogo img{height:30px;width:auto;max-width:120px;object-fit:contain;opacity:.72;}
.hm-usp b{display:block;font-size:14px;color:var(--ink);}
.hm-usp span{font-size:12.5px;color:var(--muted);}
/* green eco-stats band */
.hm-ecoband{background:var(--green-deep);color:#fff;border-radius:22px;padding:clamp(36px,5vw,52px) clamp(28px,5vw,56px);display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;}
.hm-ecocopy h2{font-family:var(--serif);font-size:clamp(28px,3.8vw,42px);font-weight:500;letter-spacing:-.01em;margin:0 0 14px;}
.hm-ecocopy p{font-size:15px;line-height:1.6;opacity:.93;margin:0;max-width:46ch;}
.hm-ecostats{display:grid;grid-template-columns:1fr 1fr;gap:26px 30px;}
.hm-ecostats .s b{font-family:var(--serif);font-size:clamp(30px,3.6vw,40px);font-weight:500;display:block;line-height:1;margin-bottom:6px;}
.hm-ecostats .s span{font-size:13px;opacity:.9;}
/* how it works */
.hm-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
.hm-step{background:#fff;border:1px solid var(--line-soft);border-radius:14px;padding:22px;}
.hm-stepn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--tint-peri);color:var(--periwinkle-deep);font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:14px;}
.hm-step b{display:block;font-size:15.5px;margin-bottom:6px;}
.hm-step p{font-size:13px;color:var(--text-soft);line-height:1.55;margin:0;}
.hm-mrow{display:flex;gap:60px;align-items:center;width:max-content;animation:hmscroll 34s linear infinite;}
.hm-mrow span{font-size:20px;font-weight:800;color:var(--muted);letter-spacing:.02em;white-space:nowrap;opacity:.6;}
@keyframes hmscroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.hm-statement{padding:clamp(56px,9vw,92px) 0 clamp(44px,7vw,72px);}
.hm-statement h2{font-family:var(--serif);font-size:clamp(28px,4.4vw,50px);line-height:1.08;letter-spacing:-.02em;font-weight:500;max-width:21ch;}
.hm-statement h2 .hl{color:var(--periwinkle-deep);}
.hm-statement .hm-more{display:inline-block;margin-top:26px;font-weight:700;border-bottom:2px solid var(--periwinkle-deep);padding-bottom:3px;color:var(--periwinkle-deep);text-decoration:none;}
.hm-sec{margin:46px 0;}
.hm-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
.hm-hd h2{font-family:var(--serif);font-size:clamp(26px,3.4vw,36px);font-weight:500;margin:0;letter-spacing:-.01em;}
.hm-hd a{font-size:14px;font-weight:700;color:var(--periwinkle-deep);text-decoration:none;border-bottom:1.5px solid var(--periwinkle-deep);padding-bottom:2px;}
.hm-pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 20px;}
.hm-pc{text-decoration:none;color:inherit;cursor:pointer;}
.hm-pimg{aspect-ratio:1;background:#fff;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;margin-bottom:12px;position:relative;}
.hm-pimg img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}
.hm-pc:hover .hm-pimg img{transform:scale(1.04);}
.hm-badge{position:absolute;top:11px;left:11px;background:var(--paper);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:999px;}
.hm-badge.eco{background:var(--green-deep);color:#fff;}
.hm-pc h3{font-size:15px;font-weight:700;margin-bottom:3px;}
.hm-from{font-size:14px;color:var(--ink-2);}
.hm-disc{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.hm-disc a{display:flex;flex-direction:column;color:var(--ink);text-decoration:none;}
.hm-disc img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;}
.hm-disc a:hover img{opacity:.93;}
.hm-disc h3{font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:-.01em;margin:14px 0 4px;}
.hm-disc a:hover h3{color:var(--periwinkle-deep);}
.hm-disc p{font-size:13.5px;color:var(--ink-2);line-height:1.5;max-width:34ch;margin:0;}
.hm-brandrow{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.hm-brandtile{display:flex;flex-direction:column;}
.hm-brandtile img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;}
.hm-brandtile .bt{margin-top:14px;color:var(--ink);}
.hm-brandtile .bt b{font-family:var(--serif);font-size:21px;font-weight:500;display:block;margin-bottom:2px;}
.hm-brandtile .bt span{font-size:13.5px;color:var(--ink-2);}
.hm-quotes{background:var(--periwinkle-deep);color:#fff;border-radius:14px;padding:clamp(48px,8vw,74px) clamp(28px,5vw,56px);text-align:center;}
.hm-q{font-family:var(--serif);font-size:clamp(24px,3.6vw,38px);line-height:1.18;letter-spacing:-.01em;font-weight:500;max-width:24ch;margin:0 auto 18px;}
.hm-qslide{display:none;}
.hm-qslide.on{display:block;animation:hmqfade .4s ease both;}
@keyframes hmqfade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.hm-qdots i[data-qdot]{cursor:pointer;}
.hm-by{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.82;}
.hm-qdots{display:flex;gap:8px;justify-content:center;margin-top:28px;}
.hm-qdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);}
.hm-qdots i.on{background:#fff;}
.hm-faq{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;}
.hm-faq .intro h2{font-family:var(--serif);font-size:clamp(26px,3.4vw,36px);font-weight:500;letter-spacing:-.01em;margin-bottom:12px;}
.hm-faq .intro p{font-size:14.5px;color:var(--ink-2);line-height:1.6;max-width:34ch;}
.hm-faq .list{border-top:1px solid var(--line-soft);}
.hm-faq details{border-bottom:1px solid var(--line-soft);}
.hm-faq summary{list-style:none;cursor:pointer;padding:20px 0;font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
.hm-faq summary::-webkit-details-marker{display:none;}
.hm-faq summary::after{content:"+";font-size:22px;font-weight:400;color:var(--periwinkle-deep);}
.hm-faq details[open] summary{color:var(--periwinkle-deep);}
.hm-faq details[open] summary::after{content:"–";}
.hm-faq .ans{padding:0 0 20px;font-size:14.5px;color:var(--ink-2);line-height:1.6;max-width:60ch;}
.hm-news{padding:clamp(48px,6vw,72px) clamp(28px,5vw,60px);text-align:center;background:var(--periwinkle-deep);color:#fff;border-radius:22px;}
.hm-news h2{font-family:var(--serif);font-size:clamp(30px,4.6vw,46px);font-weight:500;letter-spacing:-.01em;max-width:20ch;margin:0 auto 24px;line-height:1.05;color:#fff;}
.hm-newsform{display:flex;max-width:480px;margin:0 auto;border:1.5px solid #fff;border-radius:999px;overflow:hidden;background:#fff;}
.hm-newsform input{flex:1;border:0;outline:0;padding:16px 22px;font:inherit;font-size:15px;background:none;}
.hm-newsform button{background:var(--periwinkle-ink,#3C4279);color:#fff;border:0;padding:0 30px;font:inherit;font-weight:700;cursor:pointer;}
@media(max-width:1100px){.hm-pgrid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:820px){.hm-pgrid{grid-template-columns:repeat(3,1fr);}.hm-disc,.hm-brandrow,.hm-faq{grid-template-columns:1fr;}.hm-heroimg{aspect-ratio:16/10;}.hm-usps{grid-template-columns:repeat(2,1fr);}.hm-ecoband{grid-template-columns:1fr;gap:28px;}.hm-steps{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.hm-pgrid{grid-template-columns:repeat(2,1fr);}.hm-heroact{flex-direction:column;align-items:stretch;}.hm-btn{justify-content:center;}.hm-newsform{flex-direction:column;border-radius:16px;}.hm-newsform button{padding:14px;}.hm-mrow span{font-size:16px;}.hm-usps{grid-template-columns:1fr;}.hm-ecostats{grid-template-columns:1fr 1fr;}}
</style>
