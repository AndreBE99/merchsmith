<style>
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;}
.icn{width:20px;height:20px;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.header{min-height:62px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line-soft);position:relative;z-index:25;}
.headtools{display:flex;align-items:center;gap:14px;}
.account .av{width:32px;height:32px;border-radius:50%;background:var(--periwinkle);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;}
.crumbband{background:var(--periwinkle);color:#fff;padding:13px var(--page-gutter);}
.crumb{font-size:14px;font-weight:600;display:flex;gap:9px;align-items:center;}
.crumb .sep{opacity:.6;}
.main{width:100%;max-width:none;padding:30px var(--page-gutter) 90px;}
.ptitle{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1;letter-spacing:-.01em;margin:0;}
.psub{font-size:14.5px;color:var(--text-soft);margin-top:10px;max-width:640px;line-height:1.55;}
.settabs{display:flex;gap:4px;margin-top:26px;border-bottom:1px solid var(--line-soft);overflow-x:auto;scrollbar-width:none;}
.settabs::-webkit-scrollbar{display:none;}
.settab{white-space:nowrap;flex:none;cursor:pointer;border:0;background:none;font:inherit;font-size:14.5px;font-weight:700;padding:11px 16px;border-bottom:2.5px solid transparent;margin-bottom:-1px;}
.settab.active{color:var(--periwinkle-deep);border-bottom-color:var(--periwinkle-deep);}
.card{background:#fff;border:1px solid var(--line-soft);border-radius:16px;padding:24px 26px;box-shadow:0 1px 3px rgba(20,22,45,.04);margin-top:22px;}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.card-h h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0;}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--periwinkle-deep);background:var(--paper-2);border-radius:6px;padding:3px 9px;}
.lede{font-size:14px;color:var(--text-soft);line-height:1.6;margin:0 0 20px;max-width:62ch;}
.logoslot{display:flex;flex-direction:column;gap:7px;max-width:420px;}
.logoslot-lbl{font-size:12px;font-weight:700;color:var(--ink-3);}
.logoslot-drop{height:120px;border:1.5px dashed var(--line-soft);border-radius:12px;overflow:hidden;background:var(--paper);}
.logoslot-drop image-slot{width:100%;height:100%;display:block;}
.logoslot-hint{font-size:11.5px;color:var(--muted);}
.logomono{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.logomono>span{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-right:2px;}
.logomono-btn{font:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--line-soft);background:#fff;color:var(--ink-2);border-radius:7px;padding:5px 10px;cursor:pointer;}
.logomono-btn.on{background:var(--periwinkle-deep);border-color:var(--periwinkle-deep);color:#fff;}
.logodel{font:inherit;font-size:11.5px;font-weight:700;border:0;background:none;cursor:pointer;text-decoration:underline;}
.logodel[data-crop-logo]{margin-left:auto;color:var(--periwinkle-deep);}
.logodel[data-del-logo]{color:var(--muted);}
.btn{font:inherit;font-size:13.5px;font-weight:700;background:var(--periwinkle-deep);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;}
.crop-scrim{position:fixed;inset:0;z-index:1300;background:rgba(22,24,28,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:24px;}
.crop-scrim.open{display:flex;}
.crop-modal{background:#fff;width:min(520px,100%);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(20,22,45,.3);}
.crop-hd{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line-soft);}
.crop-hd b{font-family:var(--serif);font-weight:500;font-size:19px;}
.crop-x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;}
.crop-stage{margin:18px 20px 0;border-radius:12px;overflow:hidden;background:var(--paper-2);background-image:linear-gradient(45deg,#e9e7e1 25%,transparent 25%),linear-gradient(-45deg,#e9e7e1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9e7e1 75%),linear-gradient(-45deg,transparent 75%,#e9e7e1 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;}
.crop-stage.dark{background:var(--ink);}
.crop-stage image-slot{width:100%;height:100%;display:block;}
.crop-hint{font-size:12px;color:var(--muted);text-align:center;margin:11px 20px 0;}
.crop-foot{display:flex;justify-content:flex-end;padding:14px 20px 18px;}
.saved-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:11px;display:flex;gap:9px;align-items:center;opacity:0;transition:opacity .2s,transform .2s;z-index:1400;}
.saved-toast.show{opacity:1;transform:translateX(-50%);}
.saved-toast .icn{width:16px;height:16px;color:var(--spearmint,#5fb98a);}
/* distributor discounts */
.disc-table{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 14px;}
.disc-table th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 14px 9px 0;border-bottom:1.5px solid var(--line-soft);}
.disc-table th:last-child{text-align:right;}
.disc-table td{padding:11px 14px 11px 0;border-bottom:1px solid var(--paper-2);color:var(--ink-2);vertical-align:middle;}
.disc-table td:first-child{color:var(--ink);}
.disc-table td:last-child{text-align:right;}
.disc-table tr.disc-hl td{background:var(--tint-peri,#eceef9);}
.disc-table tr.disc-info td{color:var(--muted);}
.disc-in{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line-soft);border-radius:9px;padding:5px 11px;background:#fff;}
.disc-in input{width:54px;border:0;font:inherit;font-size:15px;font-weight:700;text-align:right;color:var(--ink);background:none;}
.disc-in input:focus{outline:0;}
.disc-in span{font-size:13px;font-weight:700;color:var(--muted);}
.disc-readout{font-size:13px;font-weight:600;color:var(--muted);font-style:italic;}
.disc-note{font-size:12.5px;color:var(--muted);margin:0;}
.cwsets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.cwset{border:1.5px solid var(--line-soft);border-radius:13px;padding:14px;cursor:pointer;background:#fff;position:relative;transition:border-color .14s,box-shadow .14s;}
.cwset:hover{border-color:var(--periwinkle);}
.cwset.on{border-color:var(--periwinkle-deep);box-shadow:0 0 0 1px var(--periwinkle-deep);}
.cwset-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}.cwset-hd b{font-size:14px;color:var(--ink);}
.cwset-name{font:inherit;font-size:14px;font-weight:700;color:var(--ink);border:1px solid transparent;border-radius:6px;padding:2px 5px;margin:-2px 0;background:none;max-width:150px;}
.cwset-name:hover{border-color:var(--line-soft);}
.cwset-name:focus{outline:0;border-color:var(--periwinkle-deep);background:#fff;}
.cwset-tick{width:18px;height:18px;border-radius:50%;background:var(--periwinkle-deep);color:#fff;display:none;place-items:center;font-size:11px;font-weight:800;}
.cwset-tick{position:absolute;bottom:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--periwinkle-deep);color:#fff;display:none;place-items:center;font-size:12px;font-weight:800;}
.cwset.on .cwset-tick{display:grid;}
.cwset-sw{display:flex;gap:6px;}
.cwset-sw i{width:30px;height:30px;border-radius:7px;border:1px solid rgba(0,0,0,.1);}
.cwset-tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:9px;}
.cwset-del{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;display:none;}
.cwset.custom .cwset-del{display:block;}
.cwset-edit{position:absolute;top:7px;right:30px;border:0;background:none;color:var(--ink-3);font-size:18px;font-weight:700;cursor:pointer;line-height:1;}
.cwset:not(.custom) .cwset-edit{right:9px;}
.cwset-edit:hover{color:var(--periwinkle-deep);}
.cwset-del:hover{color:var(--flare);}
.cwform{margin-top:18px;border-top:1px solid var(--line-soft);padding-top:18px;}
.cwfrow{display:flex;flex-direction:column;gap:6px;max-width:300px;margin-bottom:14px;}
.cwfrow label{font-size:12px;font-weight:700;color:var(--ink-3);}
.cwfrow input{font:inherit;font-size:14px;border:1.5px solid var(--line-soft);border-radius:9px;padding:9px 11px;}
.cwfields{display:flex;gap:14px;flex-wrap:wrap;}
.cwfield{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);}
.cwfield input[type=color]{width:64px;height:40px;border:1px solid var(--line-soft);border-radius:9px;background:none;cursor:pointer;padding:2px;}
.fcfg-h{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line-soft);}
#orgProfileMount.op-nologos .op-logos{display:none;}
#orgLogosMount.op-onlylogos .op-view,#orgLogosMount.op-onlylogos .op-foot,#orgLogosMount.op-onlylogos .op-hd>.op-ro{display:none;}
#orgLogosMount.op-onlylogos .op-logos{margin-bottom:0;}
</style>

<script>
const toast=(()=>{ const el=document.getElementById('toast'); let t; return ()=>{ el.classList.add('show'); clearTimeout(t); t=setTimeout(()=>el.classList.remove('show'),1400); }; })();
function relock(){ try{ if(window.MSID&&MSID.relock) MSID.relock(); }catch(e){} try{ if(window.MSTheme&&MSTheme.persist) MSTheme.persist(); }catch(e){} }
const LOGO_KEY='ms-cust-logo', TONE_KEY='ms-cust-logo-tone';
// persist uploaded logo
document.querySelectorAll('.logoslot image-slot').forEach(slot=>{
  slot.addEventListener('ms-slot-change',e=>{ try{ if(e.detail&&e.detail.url) localStorage.setItem(LOGO_KEY,e.detail.url); else localStorage.removeItem(LOGO_KEY); }catch(_){} relock(); toast(); });
});
// tone toggles
document.querySelectorAll('.logomono').forEach(grp=>{
  const drop=document.querySelector('.logoslot-drop image-slot#'+grp.dataset.for);
  const dropWrap=drop?drop.closest('.logoslot-drop'):null;
  grp.querySelectorAll('.logomono-btn').forEach(b=>b.onclick=()=>{
    grp.querySelectorAll('.logomono-btn').forEach(x=>x.classList.toggle('on',x===b));
    if(dropWrap){ dropWrap.classList.remove('mono-white','mono-black'); if(b.dataset.mono!=='original') dropWrap.classList.add('mono-'+b.dataset.mono); }
    try{ localStorage.setItem('ms-logo-tone-'+grp.dataset.for, b.dataset.mono); localStorage.setItem(TONE_KEY, b.dataset.mono); }catch(e){}
    relock(); toast();
  });
  try{ const saved=localStorage.getItem('ms-logo-tone-'+grp.dataset.for); if(saved){ const t=grp.querySelector('[data-mono="'+saved+'"]'); if(t) t.click(); } }catch(e){}
});
// remove
document.querySelectorAll('[data-del-logo]').forEach(btn=>btn.onclick=()=>{
  const id=btn.dataset.delLogo; const slot=document.getElementById(id);
  if(slot){ const rm=slot.shadowRoot&&slot.shadowRoot.querySelector('[data-act="clear"]'); if(rm) rm.click(); }
  try{ localStorage.setItem(LOGO_KEY,''); localStorage.setItem(TONE_KEY,'original'); localStorage.setItem('ms-logo-tone-'+id,'original'); }catch(e){}
  const grp=document.querySelector('.logomono[data-for="'+id+'"]'); if(grp) grp.querySelectorAll('.logomono-btn').forEach(x=>x.classList.toggle('on',x.dataset.mono==='original'));
  const dw=slot?slot.closest('.logoslot-drop'):null; if(dw) dw.classList.remove('mono-white','mono-black');
  relock(); toast();
});
// crop pop-out
let cropRoot=null, cropId=null;
document.querySelectorAll('[data-crop-logo]').forEach(btn=>btn.onclick=()=>{
  const id=btn.dataset.cropLogo, slot=document.getElementById(id);
  if(!slot||!slot.hasAttribute('data-filled')){ toast(); return; }
  cropId=id;
  if(!cropRoot){ cropRoot=document.createElement('div'); cropRoot.className='crop-scrim'; cropRoot.innerHTML='<div class="crop-modal" role="dialog"></div>'; document.body.appendChild(cropRoot); cropRoot.addEventListener('click',e=>{ if(e.target===cropRoot) closeCrop(); }); }
  const tone=localStorage.getItem('ms-logo-tone-'+id)||'original';
  const filt=tone==='white'?'filter:brightness(0) invert(1);':tone==='black'?'filter:brightness(0);':'';
  cropRoot.querySelector('.crop-modal').innerHTML=`
    <div class="crop-hd"><b>Crop — header logo</b><button class="crop-x">×</button></div>
    <div class="crop-stage ${tone==='white'?'dark':''}" style="aspect-ratio:4 / 1"><image-slot id="${id}" shape="rect" fit="contain" data-crop style="width:100%;height:100%;${filt}"></image-slot></div>
    <p class="crop-hint">Drag to reposition · scroll or corner-drag to zoom. Applied to your logo everywhere it appears.</p>
    <div class="crop-foot"><button class="btn" id="cropDone">Apply crop</button></div>`;
  cropRoot.classList.add('open'); document.body.style.overflow='hidden';
  const big=cropRoot.querySelector('image-slot');
  cropRoot.querySelector('.crop-x').onclick=closeCrop;
  cropRoot.querySelector('#cropDone').onclick=closeCrop;
  setTimeout(()=>{ try{ big.dispatchEvent(new MouseEvent('dblclick',{bubbles:true})); }catch(e){} },120);
});
function rasteriseCrop(){ return new Promise(res=>{
  const big=cropRoot&&cropRoot.querySelector('image-slot'); if(!big){ res(); return; }
  let g=null; try{ g=big._geom&&big._geom(); }catch(e){}
  const v=big._view||{s:1,x:0,y:0}; const url=big._userUrl||(big.getAttribute&&big.getAttribute('src'));
  if(!g||!url){ res(); return; }
  const img=new Image(); img.onload=()=>{ try{
    const fw=g.fw,fh=g.fh,k=g.base*(v.s||1),dw=g.iw*k,dh=g.ih*k,cx=fw*(0.5+(v.x||0)/100),cy=fh*(0.5+(v.y||0)/100);
    const cv=document.createElement('canvas'); cv.width=Math.round(fw); cv.height=Math.round(fh);
    cv.getContext('2d').drawImage(img,cx-dw/2,cy-dh/2,dw,dh);
    try{ localStorage.setItem(LOGO_KEY, cv.toDataURL('image/png')); }catch(e){}
  }catch(e){} res(); }; img.onerror=()=>res(); img.src=url;
}); }
function closeCrop(){ if(!cropRoot) return; const s=cropRoot.querySelector('image-slot'); if(s){ try{ s.dispatchEvent(new MouseEvent('dblclick',{bubbles:true})); }catch(e){} } rasteriseCrop().then(()=>{ cropRoot.classList.remove('open'); document.body.style.overflow=''; relock(); }); }

// ---- Distributor discounts (distributor-only) ----
(function(){
  const ROLE = ['cust','dist'].includes(localStorage.getItem('ms-role')) ? localStorage.getItem('ms-role') : 'dist';
  const tabBtn=document.getElementById('tabDiscounts');
  if(ROLE==='dist' && tabBtn) tabBtn.hidden=false;
  document.querySelectorAll('#setTabs .settab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('#setTabs .settab').forEach(x=>x.classList.toggle('active',x===t));
    document.querySelectorAll('.card.sec').forEach(c=>{ c.hidden=!c.classList.contains('sec-'+t.dataset.sec); });
    history.replaceState(null,'','#tab='+t.dataset.sec);
  });
  // deep links from the left menu: #tab=profile|account|branding|discounts (legacy #profile / #account still work)
  function fromHash(){ const h=location.hash, m=(h.match(/tab=(\w+)/)||[])[1]||(/profile/.test(h)?'profile':/account|terms/.test(h)?'account':'');
    const t=m&&document.querySelector('#setTabs .settab[data-sec="'+m+'"]'); if(t&&!t.hidden) t.click(); }
  window.addEventListener('hashchange',fromHash); setTimeout(fromHash,0);
  const KEY='ms-discounts';
  function defaults(){ return { sitewide:5, category:{Tech:10}, customer:{Citrix:7.5}, project:{'Autumn Giveaways':10} }; }
  function load(){ try{ const j=JSON.parse(localStorage.getItem(KEY)||'null'); if(j&&typeof j==='object') return Object.assign(defaults(), j); }catch(e){} return defaults(); }
  function getPath(o,path){ return path.split('.').reduce((a,k)=>(a&&a[k]!=null)?a[k]:null, o); }
  function setPath(o,path,val){ const ks=path.split('.'); let n=o; for(let i=0;i<ks.length-1;i++){ n[ks[i]]=n[ks[i]]||{}; n=n[ks[i]]; } if(val==null||val==='') delete n[ks[ks.length-1]]; else n[ks[ks.length-1]]=val; }
  const cfg=load();
  function renderReadouts(){ document.querySelectorAll('#discTable [data-readout]').forEach(el=>{ const v=getPath(cfg, el.dataset.readout); el.textContent = v!=null ? v+'%' : '—'; }); }
  document.querySelectorAll('#discTable input[data-disc]').forEach(inp=>{
    const v=getPath(cfg, inp.dataset.disc); if(v!=null) inp.value=v;
    inp.addEventListener('change',()=>{ const n=parseFloat(inp.value); setPath(cfg, inp.dataset.disc, (!isNaN(n)&&n>0)?n:null); try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} renderReadouts(); toast(); });
  });
  renderReadouts();
})();
</script>
<script>
(function(){ function mount(){ const el=document.getElementById('orgProfileMount'); if(!el||!window.MSORG) return;
  // one profile, split across two tabs: details in Organisation profile, logos in Platform logos
  el.innerHTML=MSORG.panelHTML('customer'); MSORG.wire(el,'customer',mount); el.classList.add('op-nologos');
  const lg=document.getElementById('orgLogosMount'); if(lg){ lg.innerHTML=MSORG.panelHTML('customer'); MSORG.wire(lg,'customer',mount); lg.classList.add('op-onlylogos'); } }
  mount(); window.addEventListener('ms-identity-change',mount);
  document.addEventListener('ms-slot-change',()=>setTimeout(mount,120),true);
  if(/profile/.test(location.hash)){ const t=document.querySelector('.settab[data-sec="profile"]'); if(t) setTimeout(()=>t.click(),0); } })();
(function(){ const el=document.getElementById('custAcctMount'); if(!el||!window.MSCUSTACCT||!window.ORG_DATA) return;
  const draw=()=>{ const who=(window.MSID&&MSID.current&&MSID.current())||(localStorage.getItem('ms-role')==='cust'?'customer':'distributor');
    const c=(ORG_DATA.customers||[]).find(x=>x.id==='citrix');
    const tab=document.querySelector('.settab[data-sec="account"]'); if(tab) tab.hidden=(who==='supplier');
    if(c) MSCUSTACCT.panel(el,c,who==='distributor'||who==='admin','Mojo Promotions',{only:'summary'}); };
  draw(); window.addEventListener('ms-identity-change',draw);
  if(/account|terms/.test(location.hash)){ const t=document.querySelector('.settab[data-sec="account"]'); if(t) setTimeout(()=>t.click(),0); } })();
</script>

<style>
.cfi{background:#fff;border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;margin-top:6px;} .cfi table{width:100%;border-collapse:collapse;font-size:13.5px;} .cfi th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:11px 14px;background:var(--paper);} .cfi td{padding:12px 14px;border-top:1px solid var(--paper-2,#f2f1ec);vertical-align:middle;} .cfi .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.cfi small{display:block;font-size:11.5px;color:var(--muted);} .cfi-pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;} .cfi-pill.g{background:#ecfdf3;color:#067647;} .cfi-pill.r{background:#fef3f2;color:#b42318;} .cfi-pill.a{background:#fffaeb;color:#b54708;} .cfi-pill.p{background:var(--g100,#f2f4f7);color:var(--g700,#344054);} .cfi-pill.v{background:#f4f3ff;color:#5925dc;}
.cfi-pay{display:inline-flex;align-items:center;font:inherit;font-size:12.5px;font-weight:700;border-radius:9px;padding:7px 12px;background:var(--periwinkle-deep);color:#fff;text-decoration:none;white-space:nowrap;} .cfi-pay:hover{filter:brightness(1.06);color:#fff;}
.cfi-f{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px;} .cfi-f button{font:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--line-soft);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink-3);} .cfi-f button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.cfi-empty{padding:28px;text-align:center;color:var(--muted);}
</style>
<script>/* Customer Finance: Overview (dashboard) · Invoices · Terms & invoicing (moved from Settings) */
(function(){ const CUST='citrix', esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const gbp=n=>(n<0?'−':'')+'£'+Math.abs(+n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}), fD=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
  let inited={}, invF='all';
  function invoices(){ const el=document.getElementById('cfInv'); if(!window.MSFINT){ el.innerHTML='<div class="cfi-empty">Invoices aren’t available.</div>'; return; }
    const R=MSFINT.custRows().filter(r=>(r.o.customer||'citrix')===CUST).sort((a,b)=>(b.issued||0)-(a.issued||0)), un=r=>r.kind!=='Credit note'&&!r.paid;
    const F=[['all','All',()=>true],['unpaid','To pay',un],['overdue','Overdue',r=>r.st==='overdue'],['paid','Paid',r=>!!r.paid],['credit','Credit notes',r=>r.kind==='Credit note']];
    const L=R.filter(F.find(x=>x[0]===invF)[2]), ST={paid:['Paid','g'],overdue:['Overdue','r'],soon:['Due soon','a'],notdue:['Not yet due','p'],credit:['Credit note','v']}, card=window.MSINT&&MSINT.stripe().connected;
    el.innerHTML='<div class="cfi-f">'+F.map(([k,l,fn])=>'<button type="button" class="'+(invF===k?'on':'')+'" data-cff="'+k+'">'+l+' '+R.filter(fn).length+'</button>').join('')+'</div>'
      +'<div class="cfi">'+(L.length?'<table><thead><tr><th>Invoice</th><th>For</th><th>Order</th><th class="r">Total</th><th>Issued</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>'+L.map(r=>'<tr><td><b>'+esc(r.no)+'</b><small>'+esc(r.kind)+'</small></td><td>'+esc(r.what)+(r.proj?'<small>'+esc(r.proj)+'</small>':'')+'</td><td><a class="fx-lk" href="Merchsmith Orders.html#order='+esc(r.o.id)+'">'+esc(r.o.ref)+'</a>'+(r.o.po?'<small>PO '+esc(r.o.po)+'</small>':'')+'</td><td class="r"><b>'+gbp(r.gross)+'</b><small>VAT '+gbp(r.vat)+'</small></td><td>'+fD(r.issued)+'</td><td>'+(r.due?fD(r.due)+(r.st==='overdue'?'<small style="color:#b42318">'+r.odays+' days overdue</small>':''):'—')+'</td><td><span class="cfi-pill '+ST[r.st][1]+'">'+ST[r.st][0]+'</span>'+(r.paid&&r.paid.at?'<small>'+fD(r.paid.at)+'</small>':'')+'</td><td class="r">'+(un(r)&&card?'<a class="cfi-pay" href="'+esc(MSINT.payLink(r.no))+'" target="_blank" rel="noopener">Pay by card</a>':'')+'</td></tr>').join('')+'</tbody></table>':'<div class="cfi-empty">Nothing here.</div>')+'</div>';
    el.querySelectorAll('[data-cff]').forEach(b=>b.onclick=()=>{ invF=b.dataset.cff; invoices(); }); }
  function show(t){ document.querySelectorAll('#cfTabs .settab').forEach(b=>b.classList.toggle('active',b.dataset.cf===t)); document.querySelectorAll('[data-cfp]').forEach(p=>p.hidden=p.dataset.cfp!==t); history.replaceState(null,'','#tab='+t);
    if(t==='overview'&&window.MSDASH) MSDASH.mount(document.getElementById('cfDash'),{page:'finance',role:'customer'});
    if(t==='invoices') invoices();
    if(t==='terms'&&window.MSCUSTACCT&&window.ORG_DATA){ const c=(ORG_DATA.customers||[]).find(x=>x.id===CUST); const who=(window.MSID&&MSID.current&&MSID.current())||'customer'; if(c) MSCUSTACCT.panel(document.getElementById('cfTerms'),c,who==='distributor'||who==='admin','Mojo Promotions',{only:'terms'}); } }
  document.querySelectorAll('#cfTabs .settab').forEach(b=>b.onclick=()=>show(b.dataset.cf));
  const t0=(location.hash.match(/tab=(\w+)/)||[])[1]; show(['overview','invoices','terms'].includes(t0)?t0:'overview');
  addEventListener('hashchange',()=>{ const t=(location.hash.match(/tab=(\w+)/)||[])[1]; if(t) show(t); });
})();</script>
