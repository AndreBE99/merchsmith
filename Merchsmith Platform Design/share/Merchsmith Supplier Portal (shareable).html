  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"47da86b9-810b-428c-ba6b-4b60c5680f88\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"5c991b1c-bb1e-437a-98fb-6e7a641ffbe7\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c5880b8b-d31d-4ef9-b809-46a058cbc918\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"0ba4e100-d69a-44d3-9c33-020ea57cd21f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   MERCHSMITH — design tokens (single source of truth)\n   Link this FIRST on every page:  <link rel=\"stylesheet\" href=\"tokens.css\">\n   Change a brand colour here and every page updates.\n   ============================================================ */\n:root{\n  /* ---- brand palette ---- */\n  --periwinkle:#7B85C5; --periwinkle-deep:#5860A6; --periwinkle-ink:#3C4279;\n\n  /* one horizontal gutter for every full-bleed page: content column, breadcrumb band\n     and footer all use it, so everything shares a single left edge */\n  --page-gutter:clamp(20px,2.5vw,36px);\n  --spearmint:#36C0A0; --flare:#FF2E17; --sky:#0097D8; --blossom:#FFA2A5; --zest:#FFEB3D; --sprout:#9FD792;\n\n  /* ---- neutrals ---- */\n  --ink:#222222; --white:#fff; --paper:#F4F5F8; --paper-2:#E9EBF3;\n  --track:#E4E6EF; --line:rgba(34,34,34,.12); --line-soft:rgba(34,34,34,.07);\n  --muted:#9A9AA6;\n\n  /* ---- extended (was hardcoded; now tokenised) ---- */\n  --ink-2:#44444c;          /* primary body text on cards */\n  --ink-3:#55555c;          /* secondary body text */\n  --slate:#6f7390;          /* unbranded / neutral fill */\n  --text-soft:#6b6b73;      /* captions, meta */\n  --muted-2:#8a8a92;        /* lighter muted text */\n  --hair:#d7d9e3;           /* light outline / borders */\n  --green-deep:#1f8a5b;     /* approved text on tint */\n  --tint-green:#e3f5ee;     /* approved badge bg */\n  --tint-peri:#eceef8;      /* awaiting badge bg */\n  --tint-red:#ffe7e3;       /* feedback badge bg */\n  --brand-black:#1a1a1a;    /* co-brand logos */\n  --shadow-rgb:20,22,45;    /* base for box-shadows: rgba(var(--shadow-rgb),a) */\n\n  /* ---- type ---- */\n  --serif:\"EB Garamond\", Georgia, serif;\n  --sans:\"Mulish\", system-ui, -apple-system, sans-serif;\n}\n\n/* ============================================================\n   COLOURWAY: Woodland  (set <html data-theme=\"woodland\">)\n   Brand accent -> Woodland Green; action -> Dusty Pink;\n   success stays green, error stays red (semantics preserved).\n   ============================================================ */\n:root[data-theme=\"woodland\"]{\n  --periwinkle:#32706B; --periwinkle-deep:#295A56; --periwinkle-ink:#1E423F;\n  --spearmint:#5BA77E; --flare:#E5533D; --sky:#51768C; --blossom:#EAA59B; --zest:#EBCB5B; --sprout:#AED9A3;\n\n  --ink:#222222; --white:#fff; --paper:#F2EDE8; --paper-2:#E7E0D7;\n  --track:#E2DACF; --line:rgba(34,34,34,.12); --line-soft:rgba(34,34,34,.07);\n  --muted:#9C9488;\n\n  --ink-2:#44443e; --ink-3:#57544c; --slate:#51768C; --text-soft:#6d685f; --muted-2:#8d877c;\n  --hair:#ddd5c9; --green-deep:#2E7A57; --tint-green:#E4EFE1; --tint-peri:#E4EEEC; --tint-red:#F7E2DB;\n  --brand-black:#1a1a1a; --shadow-rgb:40,36,30;\n}\n<\u002Fstyle>\n<style>/* components.css — shared visual primitives so a button/card/pill/toast\n   looks the same on every Merchsmith page. Linked after tokens.css.\n   Pages already use these class names (.btn, .card, etc.) — this routes\n   them through one consistent definition tied to the colourway tokens. */\n\n/* buttons */\n.ms-btn,.btn{display:inline-flex;align-items:center;gap:8px;background:var(--periwinkle-deep);color:#fff;border:0;border-radius:11px;\n  padding:11px 17px;font-family:var(--sans);font-weight:700;font-size:14px;cursor:pointer;transition:filter .14s,border-color .14s;line-height:1;}\n.ms-btn:hover,.btn:hover{filter:brightness(1.06);}\n.ms-btn.ghost,.btn.ghost{background:#fff;color:var(--periwinkle-deep);border:1.5px solid var(--line-soft);}\n.ms-btn.ghost:hover,.btn.ghost:hover{filter:none;border-color:var(--periwinkle);}\n.ms-btn.sm,.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px;}\n.ms-btn.danger,.btn.danger{background:var(--flare);}\n\n/* status pills — shared vocabulary */\n.ms-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;letter-spacing:.01em;}\n.ms-pill.ok{background:var(--tint-green);color:var(--green-deep);}\n.ms-pill.info{background:var(--tint-peri);color:var(--periwinkle-ink);}\n.ms-pill.warn{background:#fbeccd;color:#9a6b1f;}\n.ms-pill.bad{background:var(--tint-red);color:var(--flare);}\n.ms-pill.muted{background:var(--paper-2);color:var(--muted);}\n\n/* ===== shared footer (injected by chrome.js) — brand-led editorial =====\n   \"Let's Talk.\" leads at display size; everything else is arranged quietly\n   around it on hairline rules. The newsletter sits in its own band so it does\n   not compete with that headline. Distributor-editable: Settings → Footer.\n   Colour follows --periwinkle-deep, so it tracks the chosen colourway. */\n.ms-footer{color:#fff;margin-top:48px;font-family:var(--sans);\n  /* the palette's own darkest brand tone — themed per colourway alongside the accent,\n     and dark enough to host white body text at full opacity on every theme */\n  background:var(--periwinkle-ink,#3C4279);}\n.ms-footer{--msf-onlight:var(--periwinkle-ink,#3C4279);}\n.ms-footer a{color:#fff;text-decoration:none;}\n/* One footer width everywhere: no cap, sharing the page's gutter (matching .main's\n   clamp), so the footer reads identically on every page regardless of how the content\n   above it is capped. */\n.msf-in{width:100%;max-width:none;margin:0;padding:0 var(--page-gutter,clamp(20px,2.5vw,36px));}\n\n/* hero: lead block + link columns */\n.msf-hero{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:40px;padding:42px 0 38px;align-items:start;}\n@media(max-width:1000px){.msf-hero{grid-template-columns:1fr 1fr;gap:34px;}}\n@media(max-width:620px){.msf-hero{grid-template-columns:1fr;gap:30px;}}\n.msf-eyebrow{display:block;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;}\n.msf-talkbig{display:block;font-family:var(--serif,\"EB Garamond\",Georgia,serif);font-weight:500;font-size:46px;line-height:1.02;letter-spacing:-.015em;margin:-6px 0 14px;}\n.msf-col h4{margin-top:0;}\n@media(max-width:620px){.msf-talkbig{font-size:36px;}}\n.msf-blurb{font-size:13px;line-height:1.6;margin:0 0 16px;max-width:36ch;}\n.msf-contact{display:flex;flex-direction:column;gap:2px;}\n.msf-cline{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:5px 0;}\n.msf-cline:hover{text-decoration:underline;}\n.msf-cline svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none;}\n.msf-exit{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;margin-top:17px;font-size:13px;font-weight:700;border:1.5px solid rgba(255,255,255,.45);border-radius:999px;padding:9px 17px;transition:background .15s,border-color .15s;}\n.msf-exit:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6);}\n.msf-exit svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;}\n\n.msf-col h4{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:8px 0 14px;}\n.msf-col a{display:block;font-size:13.5px;padding:6px 0;}\n.msf-col a:hover{text-decoration:underline;}\n\n/* newsletter band */\n.msf-newsband{border-top:1px solid rgba(255,255,255,.18);padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px 40px;flex-wrap:wrap;}\n.msf-newstext h4{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;}\n.msf-newstext p{font-size:13px;line-height:1.55;margin:0;max-width:56ch;}\n.msf-form{display:flex;gap:8px;flex-wrap:wrap;}\n.msf-form input{width:230px;font-family:var(--sans);font-size:13px;color:#fff;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.26);border-radius:9px;padding:9px 12px;}\n.msf-form input::placeholder{color:rgba(255,255,255,.6);}\n.msf-form input:focus{outline:0;border-color:#fff;background:rgba(255,255,255,.18);}\n.msf-form button{font-family:var(--sans);font-size:13px;font-weight:800;white-space:nowrap;flex:none;color:var(--msf-onlight);background:#fff;border:0;border-radius:9px;padding:9px 18px;cursor:pointer;}\n.msf-form button:hover{opacity:.9;}\n.msf-newsok{font-size:13.5px;font-weight:700;margin:0;}\n\n/* accreditations + social */\n.msf-strip{border-top:1px solid rgba(255,255,255,.18);padding:20px 0;display:flex;align-items:center;justify-content:space-between;gap:18px 34px;flex-wrap:wrap;}\n.msf-accred{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}\n/* placeholder accreditation lockups: emblem + two-line name, so the row reads as real\n   certification marks. Replaced wholesale by artwork when a logo file is uploaded. */\n.msf-acc{display:flex;align-items:center;gap:9px;padding:7px 13px 7px 10px;border-radius:8px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);}\n.msf-mark{width:26px;height:26px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}\n.msf-acctx{display:flex;flex-direction:column;line-height:1.15;text-align:left;}\n.msf-acctx b{font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;}\n.msf-acctx i{font-size:12px;font-style:normal;font-weight:700;letter-spacing:-.005em;}\n/* real logo artwork: no plate, per-logo height set inline (aspect ratios vary 0.6–3.1) */\n.msf-acc.has{background:none;border:0;padding:0;}\n.msf-acc img{height:38px;width:auto;max-width:170px;object-fit:contain;display:block;}\n.msf-accred:has(.has){gap:26px;}\n.msf-social{display:flex;gap:8px;}\n.msf-social a{width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.13);display:grid;place-items:center;transition:background .15s;}\n.msf-social a:hover{background:rgba(255,255,255,.26);}\n.msf-social svg{width:14px;height:14px;}\n\n/* bottom rule */\n.msf-bot{border-top:1px solid rgba(255,255,255,.18);padding:16px 0 26px;display:flex;align-items:center;justify-content:space-between;gap:12px 26px;flex-wrap:wrap;font-size:12px;}\n.msf-bot a:hover{text-decoration:underline;}\n.msf-legal{display:flex;align-items:center;gap:7px 18px;flex-wrap:wrap;}\n.msf-pay{display:flex;align-items:center;gap:7px;}\n.msf-stripe{font-size:11.5px;font-weight:800;margin-right:2px;}\n.msf-card{height:20px;padding:0 7px;border-radius:3px;background:#fff;color:#1a2340;font-size:7.5px;font-weight:800;display:grid;place-items:center;text-transform:uppercase;}\n/* real card marks, white-on-transparent; height per mark since aspects differ */\n.msf-cardimg{height:22px;width:auto;object-fit:contain;display:block;}\n.msf-pay{gap:11px;}\n@media print{.ms-footer{display:none;}}\n\n/* toast (shared) */\n.ms-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink,#23231f);color:#fff;\n  font-family:var(--sans);font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);\n  z-index:2000;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;}\n.ms-toast.on{opacity:1;transform:translateX(-50%);}\n<\u002Fstyle>\n<script src=\"cf23cab1-c5d7-4bff-b61f-541a29ffbd8a\"><\u002Fscript>\n<style>\n*{box-sizing:border-box;}\nbody{margin:0;background:var(--paper,#F4F5F8);font-family:var(--sans);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}\n.icn{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}\n/* breadcrumb band — the project's standard rules (per-page, not in components.css) */\n.crumbband{background:var(--periwinkle);color:#fff;padding:13px var(--page-gutter,clamp(20px,2.5vw,36px));}\n.crumb{font-size:14px;font-weight:600;display:flex;gap:9px;align-items:center;white-space:nowrap;}\n.crumb .sep{opacity:.6;}\n.crumb .here{opacity:.85;font-weight:500;}\n.main{width:100%;max-width:none;padding:26px var(--page-gutter,clamp(20px,2.5vw,36px)) 90px;}\n.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:4px;}\n.ptitle{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.015em;margin:0;}\n.psub{font-size:14px;color:var(--ink-2);margin:6px 0 0;max-width:80ch;}\n\n.notice{display:flex;gap:12px;align-items:flex-start;background:#fbeccd;border-radius:13px;padding:14px 18px;margin:18px 0 0;}\n.notice svg{width:18px;height:18px;stroke:#9a6b1f;fill:none;stroke-width:1.9;flex:none;margin-top:2px;}\n.notice p{margin:0;font-size:13.5px;color:#6f4d13;}\n.notice b{color:#4a3208;}\n\n/* stat bar — matches the admin product database */\n.statbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0;}\n.sb{position:relative;background:#fff;border:1px solid var(--line-soft);border-radius:16px;padding:20px 20px 18px;overflow:hidden;}\n.sb b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(30px,2.8vw,44px);line-height:.98;letter-spacing:-.02em;color:var(--ink);}\n.sb span{display:block;margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}\n\n/* toolbar + view chips — admin product database vocabulary */\n.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px;}\n.search{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line-soft);border-radius:11px;padding:8px 13px;min-width:min(340px,100%);}\n.search .icn{width:17px;height:17px;color:var(--muted);flex:none;}\n.search input{border:0;background:none;font:inherit;font-size:13.5px;width:100%;color:var(--ink);}\n.search input:focus{outline:0;}\n.prod-sel{font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);background:#fff;border:1.5px solid var(--line-soft);border-radius:11px;padding:8px 11px;cursor:pointer;}\n.fbtns{display:flex;gap:0;background:#fff;border:1.5px solid var(--line-soft);border-radius:11px;overflow:hidden;}\n.fbtn{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-3);background:none;border:0;padding:8px 13px;cursor:pointer;border-right:1px solid var(--line-soft);}\n.fbtn:last-child{border-right:0;}\n.fbtn:hover{background:var(--paper);color:var(--periwinkle-deep);}\n.fbtn.on{background:var(--periwinkle-deep);color:#fff;}\n\n/* product table — the admin product-database rules (admin-products.js .prodtbl*) */\n.prodtbl-wrap{overflow:auto;border:1px solid var(--line-soft);border-radius:12px;max-height:calc(100vh - 150px);background:#fff;}\n.prodtbl{min-width:1100px;margin:0;border-collapse:separate;border-spacing:0;font-size:13px;width:100%;}\n.prodtbl thead{position:relative;z-index:3;will-change:transform;}\n.prodtbl thead th{background:var(--paper);box-shadow:0 1px 0 var(--line-soft);text-align:left;font-size:10px;\n  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:800;padding:13px 14px;white-space:nowrap;}\n.prodtbl tbody td{padding:10px 14px;border-bottom:1px solid var(--paper-2);color:var(--ink-2);vertical-align:middle;}\n.prodtbl tbody tr:last-child td{border-bottom:0;}\n.prodtbl tbody tr:hover{background:var(--paper-2);}\n.orgcell{display:flex;align-items:center;gap:12px;min-width:260px;}\n.prodthumb{width:34px;height:34px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--paper-2);\n  color:var(--ink-3);font-family:var(--serif);font-weight:600;font-size:15px;text-transform:uppercase;overflow:hidden;}\n.prodtbl .prodthumb{width:72px;height:72px;font-size:24px;border-radius:10px;}\n.prodthumb img{width:100%;height:100%;object-fit:contain;background:#fff;display:block;}\n.pname{font-weight:700;color:var(--ink);display:block;}\n.pmeta{display:block;font-size:11.5px;color:var(--ink-3);}\n.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;}\n.num{text-align:right;white-space:nowrap;}\n.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap;}\n.b-feat{background:var(--tint-peri,#eceefb);color:var(--periwinkle-deep);}\n.b-rec{background:var(--tint-green,#e2f6ef);color:var(--green-deep,#1c7a5e);}\n.b-pend{background:#fbeccd;color:#9a6b1f;}\n.b-none{background:var(--paper-2);color:var(--ink-3);}\n.b-dec{background:#fbdddd;color:#9a2c2c;}\n.tblfoot{font-size:12.5px;color:var(--ink-3);padding:12px 2px 0;}\n\n.card{background:#fff;border:1px solid var(--line-soft);border-radius:16px;padding:22px 24px;}\n.card + .card{margin-top:14px;}\n.card h2{font-family:var(--serif);font-weight:500;font-size:21px;margin:0 0 4px;}\n.card .ch{font-size:13.5px;color:var(--ink-2);margin:0 0 16px;max-width:78ch;}\n.empty{border:1px dashed var(--line-soft);border-radius:13px;padding:30px;text-align:center;color:var(--ink-3);font-size:13.5px;}\n\n/* approvals */\n.appr{display:grid;gap:12px;}\n.apprrow{border:1px solid var(--line-soft);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:center;}\n@media(max-width:820px){.apprrow{grid-template-columns:64px 1fr;}}\n.apprthumb{width:64px;height:64px;border-radius:11px;background:#fff;border:1px solid var(--line-soft);display:grid;place-items:center;overflow:hidden;font-weight:800;color:var(--muted);}\n.apprthumb img{width:100%;height:100%;object-fit:contain;padding:6px;}\n.apprmain b{display:block;font-size:15.5px;margin-bottom:3px;}\n.apprmain .meta{font-size:12.5px;color:var(--ink-3);}\n.apprterms{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}\n.pill{font-size:11px;font-weight:700;background:var(--paper);border:1px solid var(--line-soft);border-radius:999px;padding:4px 11px;color:var(--ink-2);}\n.pill.fee{color:var(--periwinkle-deep);border-color:var(--periwinkle);}\n.pill.feat{background:var(--tint-peri,#eceefb);border-color:var(--periwinkle);color:var(--periwinkle-deep);}\n.apprbtns{display:flex;gap:8px;flex-wrap:wrap;}\n.btn2{font:inherit;font-size:13px;font-weight:800;border-radius:9px;padding:9px 16px;cursor:pointer;border:1.5px solid transparent;white-space:nowrap;}\n.btn2.go{background:var(--periwinkle);color:#fff;}\n.btn2.go:hover{background:var(--periwinkle-deep);}\n.btn2.gh{background:#fff;color:var(--ink-2);border-color:var(--line-soft);}\n.btn2.gh:hover{border-color:var(--flare);color:var(--flare);}\n\n/* history timeline */\n.tl{display:grid;}\n.tlrow{display:grid;grid-template-columns:118px 22px 1fr;gap:13px;align-items:start;padding:11px 0;}\n.tldate{font-size:11.5px;font-weight:700;color:var(--ink-3);padding-top:2px;}\n.tlmark{position:relative;display:grid;place-items:center;padding-top:5px;}\n.tlmark i{width:9px;height:9px;border-rad
