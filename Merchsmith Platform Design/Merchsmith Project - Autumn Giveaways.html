<script>/* Layout sync (Sep 2026 clean-up). Small "keep X lined up with Y" fixes register here instead of each watching the whole page.
   They run together, once per frame at most, only after real events: load, resize, a click, the product pop-out opening/closing,
   or an explicit __msLayout.run(). Nothing re-triggers itself, so the page can't loop or freeze. */
window.__msLayout=window.__msLayout||(function(){ const fns=[]; let q=0, busy=false;
  const flush=()=>{ q=0; if(busy) return; busy=true; fns.forEach(f=>{ try{ f(); }catch(e){ console.warn('layout sync',e); } }); busy=false; };
  const run=()=>{ if(!q) q=requestAnimationFrame(flush); };
  let ct=0; const later=()=>{ clearTimeout(ct); ct=setTimeout(run,120); };
  addEventListener('resize',run); addEventListener('load',()=>{ run(); setTimeout(run,400); }); document.addEventListener('click',later,true);
  document.addEventListener('DOMContentLoaded',()=>{ const pm=document.getElementById('pmodal'); if(pm) new MutationObserver(()=>{ run(); setTimeout(run,380); }).observe(pm,{attributes:true,attributeFilter:['class']}); run(); });
  return {add(f){ fns.push(f); run(); }, run}; })();
/* kept for older code paths: a debounced, self-quietening watcher */
window.__msObserve=window.__msObserve||(fn=>{ let t=0; const o=new MutationObserver(()=>{ if(t) return; t=setTimeout(()=>{ t=0; try{ fn(); }catch(e){} o.takeRecords(); },120); }); return o; });</script>

html.embed .header,html.embed .crumbband,html.embed .foot,html.embed .tdiv,html.embed .titlerow,html.embed .metabar,

:is(#rows,#pmRowClone) .obwrap .dl-foot{display:flex;justify-content:flex-start;margin-top:2px;} :is(#rows,#pmRowClone) .dl-foot.solo{justify-content:center;}
:is(#rows,#pmRowClone) .obwrap .dl-foot .deadchip{display:inline-block;font-size:11px!important;font-weight:700;padding:2px 7px!important;border-radius:5px;background:var(--tint-red)!important;color:#b4232c!important;white-space:nowrap!important;margin:0!important;width:auto!important;max-width:none!important;line-height:1.4;}

/* title tools: comment count uses the same pink badge as the rows */
html.ui-polish .titletools>.it .badge{background:var(--periwinkle-deep)!important;color:#fff!important;top:-7px!important;right:-7px!important;min-width:18px!important;height:18px!important;font-size:10.5px!important;font-weight:700;line-height:1!important;padding:0 5px!important;box-shadow:0 0 0 2px #fff;border:0!important;}

/* modal open: title row loses View brief / Add Product; the close button takes their place; product row runs full width */

html.pm-isopen .pmodal-panel>.pm-close{display:none!important;}
.tt-close{display:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--g300,var(--line-soft));background:#fff;color:var(--g700,var(--ink-2));place-items:center;cursor:pointer;transition:background .15s,border-color .15s,color .15s;} .tt-close .icn{width:18px;height:18px;} .tt-close:hover{border-color:var(--g400,var(--ink-3));color:var(--ink);background:var(--g50,var(--paper));}
html.pm-isopen .titlerow .tt-close{display:grid;position:relative;z-index:2;pointer-events:auto;}
html.pm-isopen #pmodal .pm-rowbar{padding-right:22px!important;}

/* select tick: top-left corner of the row, clear of the thumbnail */
:is(#rows,#pmRowClone) .prod .chk{top:10px!important;left:10px!important;margin-top:0!important;}

/* title-row flag / comment / more: same tiles as the Orders table */
.titletools .it,.mb-tools .it{width:34px!important;height:34px!important;border-radius:10px!important;background:rgba(255,255,255,.96)!important;border:1px solid var(--line-soft,#e4e7ec)!important;box-shadow:0 1px 3px rgba(20,22,45,.1)!important;display:inline-grid!important;place-items:center;color:var(--ink-3,#5b5f77);cursor:pointer;position:relative;transition:border-color .15s,color .15s,box-shadow .15s,transform .15s;padding:0!important;}
.titletools .it:hover,.mb-tools .it:hover{border-color:var(--periwinkle)!important;color:var(--periwinkle-deep)!important;box-shadow:0 3px 10px rgba(20,22,45,.14)!important;transform:translateY(-1px);}
.titletools .it .icn,.mb-tools .it .icn{width:16px!important;height:16px!important;}
.titletools .it.flagged,.titletools .it.on.flag,.mb-tools .it.flagged{color:var(--flare,#e8552f)!important;border-color:color-mix(in srgb,var(--flare,#e8552f) 35%,#fff)!important;background:color-mix(in srgb,var(--flare,#e8552f) 8%,#fff)!important;}
.titletools .it .badge,.mb-tools .it .badge{position:absolute!important;top:-6px!important;right:-6px!important;min-width:18px;height:18px;border-radius:999px;background:var(--flare,#e8552f)!important;color:#fff!important;font-size:10.5px;font-weight:800;line-height:1;display:grid;place-items:center;padding:0 4px;border:2px solid #fff;}

<style>
:root{ /* palette now in tokens.css */ }
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);font-weight:400;-webkit-font-smoothing:antialiased;}
.icn{width:20px;height:20px;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
a{color:inherit;}

/* ---------- Notification bar ---------- */
.alertbar{background:var(--periwinkle-deep);color:#fff;font-size:13px;font-weight:500;text-align:center;padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:10px;}
.alertbar b{color:var(--zest);font-weight:700;}
.alertbar .x{opacity:.7;cursor:pointer;font-size:18px;line-height:1;}

/* ---------- Header ---------- */
.header{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line-soft);position:relative;z-index:25;}
.brand{display:flex;align-items:center;gap:16px;}
.crt{display:flex;align-items:center;gap:10px;}
.crt-mark{width:36px;height:36px;color:var(--brand-black);flex:none;}
.crt-txt{font-family:var(--sans);font-weight:800;font-size:12px;line-height:1.04;color:var(--brand-black);letter-spacing:.005em;}
.xsep-lg{color:#222;font-size:15px;font-weight:400;margin:0 2px;}
.mojo{font-family:"Fredoka",var(--sans);font-weight:600;font-size:28px;line-height:1;color:var(--brand-black);letter-spacing:.004em;}
.brand .client{font-weight:700;font-size:13px;line-height:1.1;color:var(--ink);letter-spacing:.01em;}
.brand .xsep{color:var(--muted);font-weight:400;font-size:13px;}
.brand .mark{width:26px;height:26px;color:var(--periwinkle);}
.brand .ms-wm{height:19px;}
.topnav{display:flex;gap:6px;align-items:center;}
.topnav a{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:14.5px;color:var(--ink);font-weight:600;white-space:nowrap;padding:8px 13px;border-radius:999px;transition:background .15s,color .15s;}
.topnav a.active{background:rgba(123,133,197,.14);color:var(--periwinkle-deep);font-weight:700;}
.topnav a .icn{width:19px;height:19px;color:var(--periwinkle-deep);}
.headtools{display:flex;align-items:center;gap:9px;color:var(--ink);}
.headtools .it{position:relative;display:inline-flex;cursor:pointer;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;color:var(--ink-3);}
.headtools .it:hover{background:var(--paper-2);color:var(--periwinkle-deep);}
.hsearch{display:flex;align-items:center;gap:9px;background:var(--paper-2);border:1px solid transparent;border-radius:999px;padding:8px 14px;width:194px;transition:border-color .15s,background .15s;}
.hsearch:focus-within{background:#fff;border-color:var(--periwinkle);}
.hsearch .icn{width:17px;height:17px;color:var(--muted);flex:none;}
.hsearch input{border:0;background:none;outline:none;font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink);width:100%;}
.hsearch input::placeholder{color:var(--muted);}
.hsep{width:1px;height:26px;background:var(--line-soft);}
.account{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;border-radius:999px;padding:4px 8px 4px 4px;transition:background .15s;font-family:var(--sans);}
.account:hover{background:var(--paper-2);}
.account .av{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none;background:var(--paper-2);}
.account .av img{width:100%;height:100%;object-fit:cover;}
.account .acc-nm{font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap;}
.account .chev{width:15px;height:15px;color:var(--muted);}
@media(max-width:1120px){.hsearch{width:44px;padding:9px;}.hsearch input{display:none;}.account .acc-nm{display:none;}}
.headtools .badge{position:absolute;top:-7px;right:-8px;background:var(--flare);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;}

.roleswitch{display:inline-flex;background:var(--paper-2);border-radius:999px;padding:3px;gap:2px;}
.roleswitch .rs-opt{border:0;background:none;font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--ink-3);padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s;}
.roleswitch .rs-opt:hover{color:var(--periwinkle-deep);}
.roleswitch .rs-opt.on{background:var(--periwinkle);color:#fff;box-shadow:0 2px 6px rgba(88,96,166,.35);}
@media(max-width:1120px){.roleswitch .rs-opt{padding:6px 10px;font-size:11.5px;}}

/* ---------- Breadcrumb band ---------- */
.crumbband{background:var(--periwinkle);color:#fff;padding:13px var(--page-gutter);}
.crumb{font-size:14px;font-weight:600;display:flex;gap:9px;align-items:center;white-space:nowrap;}
.crumb .sep{opacity:.6;}
.crumb .here{opacity:.85;font-weight:500;}
.crumb .crumb-link{color:#fff;text-decoration:none;}
.crumb .crumb-link:hover{text-decoration:underline;}

/* ---------- Main ---------- */
.main{max-width:none;margin:0;padding:30px var(--page-gutter) 60px;}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.titleleft{display:flex;align-items:center;gap:18px;}
.ptitle{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1;letter-spacing:-.01em;margin:0;white-space:nowrap;flex:none;}
.titleleft{flex:none;}
.avatars{display:flex;align-items:center;}
.avatars .av{width:30px;height:30px;border-radius:50%;border:2px solid #fff;margin-left:-9px;background:var(--paper-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--periwinkle-deep);overflow:hidden;}
.avatars .av img{width:100%;height:100%;object-fit:cover;display:block;}
.avatars .av:first-child{margin-left:0;}
.avatars .add{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--periwinkle);color:var(--periwinkle-deep);margin-left:6px;display:grid;place-items:center;cursor:pointer;}
.titlerow .titletools{display:flex;align-items:center;gap:10px;}
.titletools{display:flex;align-items:center;gap:18px;color:var(--ink);}
.addbtn{display:inline-flex;align-items:center;gap:9px;font:inherit;font-size:14px;font-weight:700;color:#fff;background:var(--periwinkle-deep);border:0;border-radius:999px;padding:11px 19px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 14px rgba(94,104,176,.32);}
.addbtn .icn{width:17px;height:17px;color:#fff;stroke-width:2;}
.titletools .it{position:relative;display:inline-flex;cursor:pointer;color:#555;}
.titletools .it.flag{color:var(--muted);}
.titletools .it.flag.on{color:var(--flare);}
.titletools .it.flag.on .icn{fill:var(--flare);}
.moremenu{position:relative;display:inline-flex;}
.moredrop{position:absolute;top:calc(100% + 10px);right:0;min-width:184px;background:#fff;border:1px solid var(--line-soft);border-radius:12px;box-shadow:0 12px 30px rgba(20,22,45,.16);padding:6px;z-index:40;display:none;flex-direction:column;gap:2px;}
.moredrop.open{display:flex;}
.moredrop .it-row{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;border-radius:8px;padding:10px 12px;font-family:var(--sans);font-weight:600;font-size:14px;color:#3b3b44;cursor:pointer;text-align:left;transition:background .14s,color .14s;}
.moredrop .it-row:hover{background:var(--paper);color:var(--periwinkle-deep);}
.moredrop .it-row .icn{width:18px;height:18px;color:var(--periwinkle-deep);flex:none;}
.titletools .it .badge{position:absolute;top:-6px;right:-7px;background:var(--flare);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:15px;height:15px;display:grid;place-items:center;}
.tdiv{height:1px;background:var(--line);margin:18px 0 0;}
.metabar{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-top:14px;}
.metabar .mi{display:flex;align-items:center;gap:8px;padding:0 18px;font-size:13px;color:var(--ink-3);font-weight:500;}
.metabar .mi:first-child{padding-left:0;}
.metabar .mi+.mi{border-left:1px solid var(--line-soft);}
.metabar .mi .icn{width:15px;height:15px;color:var(--periwinkle-deep);flex:none;}
.metabar .mi b{color:var(--ink);font-weight:700;}
.brief-btn{position:relative;margin-left:0;display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--periwinkle-deep);border-radius:999px;padding:9px 16px;font-family:var(--sans);font-size:14px;font-weight:700;color:var(--periwinkle-deep);cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(94,104,176,.14);transition:background .15s,color .15s,transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s;}
.brief-btn:hover{background:var(--periwinkle-deep);color:#fff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(94,104,176,.3);} .brief-btn.open{background:var(--periwinkle-deep);color:#fff;}
.brief-btn .icn{width:16px;height:16px;transition:transform .2s;} .brief-btn .bb-caret{width:14px;height:14px;}
.brief-btn.open .bb-caret{transform:rotate(180deg);}

/* expandable project brief */
.brief{margin-top:18px;border-top:1px solid var(--line);}
.brief-row{padding:22px 0 18px;border-bottom:1px solid var(--line-soft);}
.brief-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.brief-head h3{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.1;margin:0;color:var(--ink);}
.brief-head h3 .brief-sub{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--muted);}
.brief-act{flex:none;display:inline-flex;color:#9a9aa6;cursor:pointer;padding:5px;border-radius:7px;transition:background .15s,color .15s;}
.brief-act:hover{background:var(--paper-2);color:var(--periwinkle-deep);}
.brief-act .icn{width:18px;height:18px;}
.brief-body{margin:12px 0 0;font-size:15px;line-height:1.6;color:var(--ink-3);font-weight:400;max-width:none;}
.brief-file{display:inline-flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--ink);}
.brief-thumb{width:34px;height:34px;border-radius:8px;background:var(--paper-2);display:grid;place-items:center;color:var(--periwinkle-deep);flex:none;}
.brief-thumb .icn{width:18px;height:18px;}
.brief-file b{font-weight:700;}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px;gap:14px 22px;flex-wrap:wrap;}
.filterbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.fpill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-3);background:none;border:1px solid var(--line-soft);cursor:pointer;transition:background .15s,color .15s,border-color .15s;font-family:var(--sans);}
.fpill:hover{border-color:var(--periwinkle);color:var(--periwinkle-deep);}
.fpill.on{background:var(--periwinkle);border-color:var(--periwinkle);color:#fff;}
.fpill .fc{font-weight:800;opacity:.7;}
.fdiv{width:1px;align-self:stretch;background:var(--line-soft);margin:0 5px;}
.fgl{align-self:center;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:2px;}
.fpill.obover.on{background:var(--flare);border-color:var(--flare);color:#fff;}
.filterbar2{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:-6px 0 16px;}
.fpill.ftog{border-style:dashed;color:var(--muted);}
.fpill.ftog:hover{color:var(--ink);border-color:var(--ink-3);}
.fbadge{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:99px;background:var(--blossom,#f0569f);color:#fff;font-size:10px;font-weight:800;padding:0 4px;}
.ftok{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;font-weight:700;background:var(--tint-peri,#eceefb);color:var(--periwinkle-ink,#3C4279);border:0;border-radius:999px;padding:6px 11px;cursor:pointer;}
.ftok .x{font-size:13px;opacity:.65;}
.ftok:hover .x{opacity:1;}
.ftok-clear{border:0;background:none;font:inherit;font-size:11.5px;font-weight:700;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;}
.ftok-clear:hover{color:var(--ink);}
html.embed #filterBarTok{display:none!important;}
.suptag{display:block;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin-top:3px;}
.lead .flowdiv{margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);align-self:stretch;justify-content:center;}
.supsel{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--ink-3);background:none;border:1px solid var(--line-soft);border-radius:999px;padding:7px 10px;cursor:pointer;}
.supsel:focus{outline:0;border-color:var(--periwinkle);}
.fpill.on .fc{opacity:.95;}
.sortctl{display:inline-flex;align-items:center;gap:7px;background:var(--paper-2);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-3);position:relative;}
.sortctl .icn{width:14px;height:14px;}
.sortctl:hover{color:var(--periwinkle-deep);}
.sortctl.on{color:var(--periwinkle-deep);background:var(--tint-peri);}
.sortmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:60;background:#fff;border:1px solid var(--line-soft);border-radius:11px;box-shadow:0 12px 30px rgba(20,22,45,.18);padding:5px;min-width:172px;display:none;flex-direction:column;gap:1px;}
.sortmenu.open{display:flex;}
.sortmenu button{border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.sortmenu button:hover{background:var(--tint-peri);color:var(--periwinkle-deep);}
.sortmenu button.cur{background:var(--paper-2);font-weight:800;}
.row.dragging{opacity:.45;}
.row.drophint{border-color:var(--periwinkle-deep)!important;box-shadow:0 0 0 1.5px var(--periwinkle-deep)!important;}
/* bulk action bar */
.bulkbar{display:flex;align-items:center;gap:16px;background:var(--periwinkle-ink);color:#fff;border-radius:14px;padding:12px 12px 12px 20px;margin:0 0 16px;}
.bulkbar[hidden]{display:none;}
.bulkbar .bk-count{font-size:14px;font-weight:600;white-space:nowrap;}
.bulkbar .bk-count b{font-weight:800;}
.bk-actions{display:flex;gap:8px;flex-wrap:wrap;}
.bk-actions button{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;padding:8px 15px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer;transition:background .15s;}
.bk-actions button:hover{background:rgba(255,255,255,.3);}
.bk-actions button .icn{width:15px;height:15px;}
.bk-clear{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.85);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;}
.bk-clear:hover{color:#fff;text-decoration:underline;}
.showing{font-size:14px;color:var(--ink-3);}
.showing b{color:var(--ink);font-weight:700;}
.count{font-size:14px;font-weight:600;text-align:center;color:var(--ink-2);}
/* totals summary */
.totalsbar{display:flex;justify-content:flex-end;align-items:center;gap:18px;margin:26px 0 0;}
.tb-note{font-size:12.5px;color:var(--text-soft);max-width:230px;text-align:right;line-height:1.35;}
.tb-card{display:inline-flex;align-items:center;gap:20px;background:var(--periwinkle);color:#fff;border-radius:12px;padding:13px 24px;box-shadow:0 6px 18px rgba(88,96,166,.28);}
.tb-lbl{font-size:13px;font-weight:600;opacity:.92;line-height:1.3;text-align:right;white-space:nowrap;}
.tb-lbl b{font-weight:700;display:block;white-space:nowrap;}
.tb-val{font-family:var(--serif);font-weight:500;font-size:27px;line-height:1;letter-spacing:-.01em;white-space:nowrap;}
.viewtools{display:flex;align-items:center;gap:8px;justify-self:end;color:var(--ink-3);}
.viewtools .it{display:inline-flex;cursor:pointer;padding:7px;border-radius:8px;}
.viewtools .it.active{background:var(--periwinkle);color:#fff;}
.searchbox{display:inline-flex;align-items:center;}
.searchinput{width:0;min-width:0;box-sizing:border-box;opacity:0;border:1.5px solid transparent;border-radius:10px;padding:0;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);background:#fff;outline:none;transition:width .32s cubic-bezier(.22,.61,.36,1),opacity .22s,padding .3s,border-color .2s;}
.searchinput::placeholder{color:var(--muted);font-weight:500;}
.searchbox.open .searchinput{width:210px;opacity:1;padding:8px 12px;border-color:var(--periwinkle);margin-right:6px;}
.searchbox.open .it{background:var(--periwinkle);color:#fff;}
.seg{display:inline-flex;background:var(--paper-2);border-radius:10px;padding:3px;}
.seg .it{padding:6px 9px;border-radius:8px;}
.seg .it.on{background:#fff;color:var(--periwinkle-deep);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.densseg .it{padding:6px 12px;border:0;background:none;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-3);cursor:pointer;}
.filterbtn{display:inline-flex;align-items:center;gap:8px;background:var(--paper-2);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}

/* ---------- Table ---------- */
.thead{display:grid;grid-template-columns:var(--cols);background:var(--paper-2);border-radius:12px;padding:14px 8px;margin-bottom:14px;}
.thead .th{font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--ink-3);text-align:center;border-right:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:color .15s;}
.thead .th:last-child{border-right:0;}
.thead .th .sortbtn{display:inline-flex;align-items:center;opacity:0;transform:translateX(-2px);transition:opacity .15s,transform .15s;color:var(--periwinkle-deep);}
.thead .th .sortbtn .icn{width:14px;height:14px;}
.thead .th:hover{color:var(--periwinkle-deep);}
.thead .th:hover .sortbtn{opacity:1;transform:none;}
:root{--cols:1.95fr 2.45fr 1.15fr 0.95fr 1.0fr 1.05fr 0.6fr 0.6fr;}

.rows{display:flex;flex-direction:column;gap:16px;}
.row{display:grid;grid-template-columns:var(--cols);background:#fff;border:1px solid var(--line-soft);border-radius:14px;padding:22px 8px;align-items:center;position:relative;transition:box-shadow .15s,border-color .15s;}
.row:hover{border-color:var(--periwinkle);box-shadow:0 0 0 1px var(--periwinkle);}
.row.checked{border-color:var(--periwinkle);box-shadow:0 0 0 1px var(--periwinkle);}
.row.paused{opacity:.55;}
.row.archived{opacity:.5;}
.cell{padding:0 18px;border-right:1px solid var(--line-soft);height:100%;display:flex;flex-direction:column;justify-content:center;}
.cell:last-child{border-right:0;}

/* product cell */
.prod{display:flex;align-items:center;gap:12px;border-right:1px solid var(--line-soft);padding:0 12px 0 6px;height:100%;}
.grip{color:#c4c4cc;cursor:grab;flex:none;}
.chk{width:18px;height:18px;border:1.6px solid #c4c4cc;border-radius:5px;flex:none;display:grid;place-items:center;cursor:pointer;transition:border-color .12s;}
.chk:hover{border-color:var(--periwinkle);}
.chk.on{background-color:var(--periwinkle);border-color:var(--periwinkle);color:#fff;}
.chk .icn{width:12px;height:12px;stroke-width:2.4;display:none;}
.chk.on .icn{display:block;}
.pimg{width:74px;height:74px;border-radius:11px;background:#fff;border:1px solid var(--line-soft);display:grid;place-items:center;flex:none;overflow:hidden;color:var(--periwinkle);}
.pimg img{width:100%;height:100%;object-fit:contain;padding:6px;}
.pimg .icn{width:30px;height:30px;opacity:.5;}
.pimg-zoom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,22,45,.42);color:#fff;opacity:0;cursor:zoom-in;transition:opacity .15s;}
.pimg-zoom .icn{width:18px;height:18px;opacity:1;color:var(--ink);}
.pimg{position:relative;}
.pimg:hover .pimg-zoom{opacity:1;}
.lightbox{position:fixed;inset:0;z-index:120;background:rgba(20,22,28,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:40px;}
.lightbox.on{display:flex;}
.lightbox-card{background:#fff;border-radius:18px;max-width:560px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden;}
.lightbox-img{background:var(--paper,#f4f2ec);display:grid;place-items:center;padding:34px;}
.lightbox-img img{max-width:100%;max-height:58vh;object-fit:contain;}
.lightbox-cap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;}
.lightbox-cap b{font-size:16px;}
.lightbox-x{border:0;background:var(--paper-2,#eee);width:34px;height:34px;border-radius:50%;font-size:17px;color:var(--ink);cursor:pointer;line-height:1;}
.pname{font-size:14px;font-weight:600;line-height:1.3;}
.pname.link{color:var(--periwinkle-deep);text-decoration:underline;text-underline-offset:2px;}
.row .pimg.pmopen,.row .pname.pmopen{cursor:pointer;}
.row .pimg.pmopen{transition:border-color .15s,box-shadow .15s;}
.row .pimg.pmopen:hover{border-color:var(--periwinkle);box-shadow:0 2px 10px rgba(88,96,166,.18);}
.row .pname.pmopen:hover{color:var(--periwinkle-deep);text-decoration:underline;text-underline-offset:2px;}

/* actions cell */
.acts{display:flex;flex-direction:column;gap:11px;}
.actrow{display:grid;grid-template-columns:22px 58px 1fr auto auto;align-items:center;gap:10px;}
.actrow .ai{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;}
.ai.done{background:var(--spearmint);color:#fff;}
.ai.urgent{background:var(--flare);color:#fff;}
.ai.pend{border:1.6px solid var(--periwinkle);color:var(--periwinkle-deep);}
.ai.lock{color:var(--muted);}
.ai.pause{color:var(--muted);}
.ai.sampleorder{background:var(--blossom);color:#fff;}
.ai.withacm{border:0;background:none;color:var(--muted);}
.ai.withacm .icn{width:21px;height:21px;}
.statcircle.cf{border:0!important;background:none!important;}
.statcircle.cf .icn{width:100%;height:100%;}
.ai.feedback{background:var(--blossom);color:#fff;}
.ai.awaiting{background:var(--blossom);color:#fff;}
.ai.approved,.ai.instock{background:var(--spearmint);color:#fff;}
.ai.notapproved,.ai.notinstock{background:var(--flare);color:#fff;}
.ai.ordered{border:0;background:none;color:var(--muted);}
.ai.ordered .icn{width:21px;height:21px;}
.ai.unbranded{background:var(--slate);color:#fff;}
.statreorder{font-size:11px;color:var(--periwinkle-deep);text-decoration:underline;text-underline-offset:2px;font-weight:700;cursor:pointer;margin-top:2px;}
.instat{color:var(--periwinkle-deep);position:relative;}
.statcircle{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;}
.statcircle .icn{width:20px;height:20px;}
.statcircle.peri{border:1.8px solid var(--periwinkle);color:var(--periwinkle-deep);}
.statcircle.ink{border:1.8px solid var(--ink);color:var(--ink);}
.statcircle.muted{border:1.8px solid var(--hair);color:var(--muted);}
.statcircle .b{position:absolute;top:-4px;right:-6px;background:var(--flare);color:#fff;font-size:9px;font-weight:700;border-radius:999px;width:16px;height:16px;display:grid;place-items:center;border:2px solid #fff;}
.ai .icn{width:13px;height:13px;stroke-width:2;}
.ai .b{position:absolute;top:-5px;right:-5px;background:var(--flare);color:#fff;font-size:10px;font-weight:800;line-height:1;border-radius:999px;width:14px;height:14px;display:grid;place-items:center;border:1.5px solid #fff;}
.alabel{font-size:13px;color:var(--ink-2);font-weight:500;cursor:pointer;border-radius:5px;transition:color .14s;}
.alabel:hover{color:var(--periwinkle-deep);text-decoration:underline;text-underline-offset:2px;}
.adash{color:var(--muted);font-weight:600;text-align:center;}
.bar{display:flex;gap:5px;}
.seg3{height:9px;border-radius:5px;background:var(--track);flex:1;overflow:hidden;}
.seg3 i{display:block;height:100%;background:var(--periwinkle);border-radius:5px;}
.asub{font-size:12px;font-weight:600;color:var(--ink-2);text-align:right;white-space:nowrap;max-width:0;opacity:0;overflow:hidden;transition:max-width .2s ease, opacity .15s ease;}
.row:hover .asub,.row.checked .asub,.rows.labels-shown .asub{max-width:120px;opacity:1;}
@media (hover:none){.asub{max-width:120px;opacity:1;}}
.asub.link{color:var(--ink-2);font-weight:600;cursor:pointer;}
.asub.muted{color:var(--muted);font-weight:500;}

/* price cell */
.kv .k{font-size:13px;font-weight:700;}
.qtybox{display:inline-block;margin-top:6px;border:1px solid var(--line);border-radius:7px;padding:4px 12px;font-size:13px;font-weight:600;min-width:52px;text-align:center;}
.priceblock{margin-top:16px;}
.priceblock .unit{font-size:17px;font-weight:700;line-height:1.1;}
.priceblock .unit small{font-size:12px;font-weight:600;color:var(--muted-2);}
.priceblock .total{font-size:12px;font-weight:600;color:var(--muted-2);margin-top:3px;display:flex;align-items:center;gap:7px;}
.esttag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--periwinkle-deep);background:var(--paper-2);border-radius:4px;padding:1px 5px;}
.margintag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--green-deep);background:var(--tint-green);border-radius:4px;padding:1px 5px;}

/* order-by cell */
.orderby{display:flex;justify-content:center;align-items:center;text-align:center;}
.obnone{color:var(--muted);font-weight:600;}
.obwrap .obdate{font-size:13px;font-weight:700;white-space:nowrap;}
.obwrap.over .obdate{color:var(--flare);}
.obwrap.soon .obdate{color:#b06f00;}
.obwrap .obref{font-size:10.5px;color:var(--text-soft);margin-top:3px;}

/* lead time cell */
.lead .k{font-size:13px;font-weight:700;}
.leadval{font-size:13px;font-weight:600;margin-top:3px;display:flex;align-items:center;gap:8px;flex-direction:row-reverse;justify-content:flex-end;white-space:nowrap;}
.lead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;}
.lead .leadval{justify-content:center;margin-top:0;}
.lead .leadbadge{order:-1;text-align:center;margin:0 0 3px;}
.lead .leadref{margin-top:0 !important;}
.kv{text-align:center;}
.priceblock{text-align:center;}
.priceblock .total{justify-content:center;}
.leadval .icn{width:20px;height:20px;color:var(--periwinkle-deep);}
.thead .th + .th{border-left:1px solid var(--line-soft);}
.lead .dl{margin-top:16px;}
.urgent-t{color:var(--flare);font-weight:700;}
.choosechip{display:inline-flex;align-items:center;gap:6px;color:var(--periwinkle-deep);font-weight:700;}
.calwrap{position:relative;display:inline-flex;align-items:center;}
.choosechip-row .b,.calwrap .b{position:absolute;top:-5px;right:-5px;background:var(--flare);color:#fff;font-size:10px;font-weight:800;border-radius:999px;width:14px;height:14px;display:grid;place-items:center;border:1.5px solid #fff;}
.daypick{cursor:pointer;display:inline-flex;align-items:center;border-radius:6px;transition:transform .12s;}
.daypick:hover{transform:scale(1.12);}
/* distributor two-line delivery / order-by cells */
.lead .dl2{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:6px;row-gap:2px;font-size:12.5px;font-weight:600;white-space:nowrap;}
.lead .dl2+.dl2,.lead .dl2-note+.dl2{margin-top:6px;}
.dl2 .dk,.obrow .dk{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex-basis:100%;text-align:center;}
.dl2-note{font-size:10.5px;color:var(--text-soft);margin-top:1px;text-align:center;}
.critbtn{border:0;background:none;padding:0;cursor:pointer;font-family:inherit;}
.critbtn:hover span{box-shadow:0 0 0 1.5px currentColor;}
/* tidy distributor delivery / order-by cells */
.dl-tidy{display:flex;flex-direction:column;align-items:stretch;gap:5px;text-align:left;}
.dl-tidy.is-crit{border-left:2.5px solid var(--flare);padding-left:9px;}
.dl-tidy .dl-line{display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.25;white-space:nowrap;}
.dl-tidy .dl-line .dk{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);width:24px;flex:none;}
.dl-tidy .dl-line .dv{font-weight:700;color:var(--ink);}
.dl-tidy .dl-line.over .dv{color:var(--ink);}
.dl-tidy .dl-line.soon .dv{color:var(--ink);}
.dl-tidy .dstat{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;flex:none;border:0;padding:0;cursor:pointer;}
.dl-tidy .dstat .icn{width:11px;height:11px;}
.dl-tidy .dstat.ok{background:var(--tint-green);color:var(--green-deep);}
.dl-tidy .dstat.wait{background:#fdeecb;color:#b06f00;}
.dl-tidy .dstat.bad{background:rgba(255,46,23,.14);color:#d33a22;}
.dl-tidy .dstat.req{background:var(--tint-peri);color:var(--periwinkle-deep);}
.dl-tidy .dstat:hover{box-shadow:0 0 0 1.5px currentColor;}
.dl-tidy .dl-cal{display:flex;justify-content:flex-start;line-height:0;}
:is(#rows,#pmRowClone) .row .leadcell .lead.dl-tidy{display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;align-items:flex-start!important;gap:5px;width:100%;}
:is(#rows,#pmRowClone) .row .leadcell .lead.dl-tidy>*{position:static!important;width:100%;margin:0!important;}
:is(#rows,#pmRowClone) .row .leadcell .dl2-note{white-space:normal!important;}
/* the date line is the only in-flow child, so it centres at the same height as the Order by date; calendar sits above it, tag/lead time below */
:is(#rows,#pmRowClone) .row .leadcell .lead.dl-tidy{position:relative;overflow:visible;}
:is(#rows,#pmRowClone) .row .leadcell .lead.dl-tidy>.dl-cal{position:absolute!important;left:0;bottom:calc(100% + 6px);width:auto;}
:is(#rows,#pmRowClone) .row .leadcell .lead.dl-tidy.is-crit>.dl-cal,:is(#rows,#pmRowClone) .row .leadcell .lead.dl-tidy.is-crit>.dl-foot{left:11px;}
:is(#rows,#pmRowClone) .row .leadcell .lead.dl-tidy>.dl-foot{position:absolute!important;left:0;right:0;top:calc(100% + 6px);width:auto;}
:is(#rows,#pmRowClone) .row>.cell.leadcell{overflow:visible;}
:is(#rows,#pmRowClone) .row .leadcell .dl-foot{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;} :is(#rows,#pmRowClone) .row .leadcell .dl-foot .nofail,:is(#rows,#pmRowClone) .row .leadcell .dl-foot .notcrit{white-space:nowrap!important;flex:none;}
.dl-tidy .daypick{margin-left:0;opacity:.85;transition:opacity .12s;cursor:pointer;display:inline-grid;place-items:center;}
.row:hover .dl-tidy .daypick,.dl-tidy:hover .daypick{opacity:.85;}
.dl-tidy .daypick:hover{opacity:1;}
.dl-tidy .dl-foot{margin-top:1px;}
.dl-tidy .dl-foot .dl2-note{font-size:10.5px;color:var(--text-soft);}
.dl-tidy.obwrap{cursor:default;}
.obwrap .obrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;column-gap:6px;row-gap:2px;font-size:12.5px;font-weight:700;white-space:nowrap;}
.obwrap .obrow+.obrow{margin-top:6px;}
.obwrap .obrow.over{color:var(--flare);}
.obwrap .obrow.soon{color:#b06f00;}
.suppop{position:absolute;z-index:150;display:none;background:#fff;border:1px solid var(--line-soft);border-radius:13px;box-shadow:0 16px 44px rgba(20,22,45,.22);padding:14px;width:272px;}
.suppop.open{display:block;}
.suppop .sp-hd{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
.suppop input{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);border:1.5px solid var(--line-soft);border-radius:9px;padding:8px 10px;width:100%;box-sizing:border-box;background:#fff;margin-bottom:8px;}
.suppop input:focus{outline:0;border-color:var(--periwinkle);}
.suppop .sp-acts{display:flex;align-items:center;gap:10px;}
.suppop .sp-save{font-family:var(--sans);font-size:12.5px;font-weight:800;color:#fff;background:var(--periwinkle-deep);border:0;border-radius:9px;padding:8px 18px;cursor:pointer;}
.suppop .sp-clear{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--periwinkle-deep);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
.suppop .sp-note{font-size:11px;color:var(--text-soft);line-height:1.45;margin-top:9px;}
.suppop .sp-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;margin-bottom:6px;}
.suppop .sp-row b{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap;align-self:center;}
.suppop .sp-row span{font-weight:700;color:var(--ink);text-align:right;}
.nofail{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#d33a22;background:rgba(255,46,23,.12);border-radius:5px;padding:1px 6px;}
.leadbadge{margin-top:5px;}
.missed-date{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--muted);color:var(--ink);font-weight:700;}
.leadbtn{margin-left:8px;font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.02em;border-radius:999px;padding:2px 9px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--periwinkle-deep);transition:background .14s,color .14s,border-color .14s;}
.leadbtn:hover{background:var(--periwinkle);color:#fff;border-color:var(--periwinkle);}
.reject-ref{color:#d33a22 !important;font-weight:700;}
.reject-ref .icn{color:var(--flare) !important;}
.day.rush{position:relative;}
.day.rush::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--flare);}
.day.disabled{opacity:.32;pointer-events:none;}
.dp-legend{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-soft);font-weight:600;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);}
.dp-legend .dot{width:5px;height:5px;border-radius:50%;background:var(--flare);flex:none;}
.dp-mode{display:flex;gap:4px;background:var(--paper-2);border-radius:9px;padding:3px;margin-bottom:8px;}
.dp-modeopt{flex:1;border:0;background:none;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-3);padding:6px;border-radius:7px;cursor:pointer;transition:background .14s,color .14s;}
.dp-modeopt.on{background:#fff;color:var(--periwinkle-deep);box-shadow:0 1px 2px rgba(0,0,0,.1);}
.dp-modeopt.on[data-mode="crit"]{color:#d33a22;}
.dp-modehint{font-size:10.5px;color:var(--text-soft);line-height:1.4;margin-bottom:10px;}
.confirmdate{margin-left:8px;font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--green-deep);background:var(--tint-green);border:1px solid color-mix(in srgb,var(--spearmint) 45%,transparent);border-radius:999px;padding:2px 9px;cursor:pointer;transition:background .14s,color .14s,transform .12s;}
.confirmdate:hover{background:var(--spearmint);color:#fff;transform:translateY(-1px);}
.notcrit{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-soft);background:var(--paper-2);border-radius:5px;padding:1px 5px;margin-left:3px;}
.asaplabel{font-weight:700;color:var(--ink);}
.asaplabel small{font-weight:600;color:var(--muted);font-size:11px;}
.lead .reveal{max-height:0;opacity:0;overflow:hidden;transition:max-height .18s ease,opacity .15s ease,margin .18s ease;}
.lead:hover .reveal{max-height:42px;opacity:1;margin-top:7px;}

.dp-grid .day.empty{visibility:hidden;}ms:center;line-height:1;border:1.5px solid #fff;}

/* status cell */

.statactions{display:flex;justify-content:center;align-items:center;height:100%;}

.statactions .it.flagbtn{color:#c7c7d0;}

.row .expand{position:absolute;top:-1px;right:-1px;background:var(--periwinkle);color:#fff;width:30px;height:30px;border-radius:0 14px 0 12px;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s;}

.orderbtn{transition:transform .18s,box-shadow .18s,background .18s;box-shadow:0 2px 8px rgba(54,192,160,.28);}

.addtoast{position:fixed;right:24px;bottom:92px;z-index:120;width:330px;background:#fff;border:1px solid var(--line-soft);border-radius:14px;box-shadow:0 16px 44px rgba(20,22,45,.22);padding:15px 16px;transform:translateY(18px);opacity:0;pointer-events:none;transition:transform .26s cubic-bezier(.22,.61,.36,1),opacity .26s;}

<script>(function(){ const RX=/\b(\d{1,2})(st|nd|rd|th)\b/g, DAY=/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\./g, EOD=/,\s*(17:00|17:30|18:00|23:59|00:00)\b/g;
  // display-only tidy of dates: no ordinals, no full stop after the day, no time when it's end of day
  const tidy=s=>s.replace(RX,'$1').replace(DAY,'$1').replace(EOD,'');
  const clean=root=>{ const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())){ const v=tidy(n.nodeValue); if(v!==n.nodeValue) n.nodeValue=v; }
    // tint Cus / Sup lines
    root.querySelectorAll&&root.querySelectorAll('.dl-line>.dk').forEach(k=>{ const l=k.parentElement, t=k.textContent.trim().toLowerCase(); l.classList.toggle('dl-cus',t==='cus'); l.classList.toggle('dl-sup',t==='sup'); });
    // a time sits at the end of the date line
    root.querySelectorAll&&root.querySelectorAll('.dl-line .dv, .obwrap .dv').forEach(d=>{ if(d.querySelector('.dt')) return; const n=[...d.childNodes].find(x=>x.nodeType===3&&/,\s*\d{1,2}:\d{2}\s*$/.test(x.nodeValue)); if(!n) return; const m=n.nodeValue.match(/^(.*?),\s*(\d{1,2}:\d{2})\s*$/); n.nodeValue=m[1]; const s=document.createElement('span'); s.className='dt'; s.textContent=m[2]; n.after(s); });
    // calendar icon moves to the end of the first date line
    root.querySelectorAll&&root.querySelectorAll('.lead.dl-tidy>.dl-cal').forEach(c=>{ const l=c.parentElement.querySelector('.dl-line'); if(l) l.appendChild(c); }); };
  addEventListener('DOMContentLoaded',()=>{ ['rows','metabar'].forEach(id=>{ const el=document.getElementById(id); if(!el) return; clean(el); let q=false; const o=new MutationObserver(()=>{ if(q) return; q=true; requestAnimationFrame(()=>{ try{ clean(el); }catch(e){} o.takeRecords(); q=false; }); }); o.observe(el,{childList:true,subtree:true,characterData:true}); }); }); })();</script>
<script>addEventListener('DOMContentLoaded',()=>{ const tr=document.querySelector('.titlerow'); if(!tr) return; const th=document.querySelector('.thead'), pt=tr.querySelector('.ptitle'); const set=()=>{ if(pt) document.documentElement.style.setProperty('--pt-w',pt.offsetWidth+'px'); document.documentElement.style.setProperty('--tr-h',tr.offsetHeight+'px'); if(th) document.documentElement.style.setProperty('--th-h',th.offsetHeight+'px'); }; new ResizeObserver(set).observe(tr); if(th) new ResizeObserver(set).observe(th); set();
  const hh=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ms-headh'))||0;
  // row snapping switches on once the table head is pinned (sitting at its sticky position under the title row)
  const snap=()=>{ const h=document.querySelector('.thead'); if(!h) return; const pin=hh()+tr.offsetHeight; document.documentElement.classList.toggle('row-snap',h.getBoundingClientRect().top<=pin+0.5); };
  addEventListener('scroll',()=>{ if(document.querySelector('#pmodal.open')) return; tr.classList.toggle('stuck',tr.getBoundingClientRect().top<=hh()+0.5&&scrollY>40); snap(); },{passive:true}); snap();
  // with the product pop-out open the page doesn't scroll, its panel does: shrink the title the same way
  /* pop-out open: pm-inset.js drives 'stuck' from the pop-out's own scroll position */
   });</script>

<style id="prodNoBreak">
/* pop-out opened from the gallery: its row uses the list layout, so nothing inside may widen a column */
html.gview #pmRowClone .row>*{min-width:0!important;}
html.gview #pmRowClone .row{display:grid!important;grid-template-columns:var(--cols)!important;grid-template-areas:none!important;}

/* product cell: every thumbnail the same (largest that fits); names wrap only between words */
:is(html:not(.gview) #rows,#pmRowClone) .row>.prod{container-type:inline-size;min-width:0;flex-direction:column!important;align-items:flex-start!important;justify-content:center!important;gap:8px!important;}
:is(html:not(.gview) #rows,#pmRowClone) .row>.prod .pimg{flex:none!important;width:min(148px,calc(100cqi - 30px))!important;height:min(148px,calc(100cqi - 30px))!important;min-width:0!important;max-width:none!important;aspect-ratio:auto;}
:is(html:not(.gview) #rows,#pmRowClone) .row>.prod .pimg img{width:100%!important;height:100%!important;object-fit:contain!important;max-width:none!important;max-height:none!important;}
:is(html:not(.gview) #rows,#pmRowClone) .row>.prod .pname{min-width:0!important;width:100%;overflow-wrap:normal!important;word-break:normal!important;hyphens:none!important;}
:is(html:not(.gview) #rows,#pmRowClone) .row>.prod .pname *{overflow-wrap:normal!important;word-break:normal!important;hyphens:none!important;}
/* drag handle: its own gutter so it doesn't sit on the photo */
:is(html:not(.gview) #rows,#pmRowClone) .row>.prod{padding-left:20px!important;}
:is(html:not(.gview) #rows,#pmRowClone) .row>.prod .grip{left:1px!important;}
:is(html:not(.gview) #rows,#pmRowClone) .row>.prod .chk{left:1px!important;top:12px!important;margin-top:0!important;}
#pmRowClone.pm-noasub .acts .actrow>.asub{display:none!important;}
:is(html:not(.gview) #rows,#pmRowClone) .row>.prod .pimg{width:min(148px,calc(100cqi - 16px))!important;height:min(148px,calc(100cqi - 16px))!important;}
/* pop-out row: Product column is locked to the list's width (set by script), so its thumbnail matches the list */
#pmRowClone .row{grid-template-columns:var(--pm-clone-cols,var(--cols))!important;}
/* Order by + Delivery Date 25% narrower; the space goes to Product */
:root{--cols:2.71fr 1.2fr 1.05fr 1.07fr 1.07fr 1.2fr 0.55fr 0.55fr!important;}

:is(#rows,#pmRowClone) .row .dl-line .dt{position:absolute!important;top:6px!important;right:8px!important;left:auto!important;margin:0!important;white-space:nowrap!important;font-size:10.5px!important;line-height:1.2!important;font-weight:700;}
/* wide windows: name goes back beside the photo, so rows are shorter */
@media (min-width:1560px){
  :is(html:not(.gview) #rows,#pmRowClone) .row>.prod{flex-direction:row!important;align-items:center!important;gap:14px!important;}
  :is(html:not(.gview) #rows,#pmRowClone) .row>.prod .pimg{width:120px!important;height:120px!important;}
  :is(html:not(.gview) #rows,#pmRowClone) .row>.prod .pname{width:auto;flex:1 1 0;}
}

const coloursOf = p => (productVariants[p.name]||{}).colours || ['Standard'];
const sizesOf = p => (productVariants[p.name]||{}).sizes || ['One size'];
const SUPPLIERS=['Veloce Print','Lumen Goods','Fjord Textiles','Baltic Promo Works','Orchard & Co'];
const two2 = p => window.MSTWO?MSTWO.get(p.name,'autumn'):null;
const supplierName = p => { const t=two2(p); if(t) return t.brand; if(supplierOf[p.name]) return supplierOf[p.name];
  let x=0; for(const ch of p.name) x=(x*31+ch.charCodeAt(0))>>>0; return SUPPLIERS[x%SUPPLIERS.length]; };
// two-supplier lines: blank supplier lead + transit to the decorator + decorator lead
const blankLead = p => { const t=two2(p); if(t&&t.blankLead!=null) return t.blankLead; return 6; };
const supLead = p => { const t=two2(p); if(t) return blankLead(p)+t.transit+t.brandLead; return supLeadDays[p.name] || 10; };
window.__leadParts = p => { const t=two2(p); return t?{blank:t.blank,blankLead:blankLead(p),transit:t.transit,brand:t.brand,brandLead:t.brandLead,lieu:window.MSLead?MSLead.lieuFor(t.brand):3}:null; };
const custLeadDays = p => window.MSLead ? MSLead.custLead(supLead(p), supplierName(p)) : supLead(p)+3;
function parseDelivery(p){ return p.deliveryISO ? new Date(p.deliveryISO+'T00:00') : null; }
function triggerMissed(p){ p.deadlineMissed=true; p.sup='none'; p.orderISO=null; p.orderDisplay=null; if(p.confirmData){ p.confirmData.orderRequiredISO=''; p.confirmData.orderRequiredDisplay=''; p.confirmData.proofISO=''; p.confirmData.proofDisplay=''; } p.status={type:'clock',label:'In Progress'}; }
function deliveryReady(p){ if(p.deadlineMissed) return false; if(p.delivery==='asap'||!p.delivery) return true; if(!p.nofail) return true; return p.sup==='confirmed'; }
function normalizeDelivery(){ products.forEach(p=>{ if(!p.delivery || p.delivery==='asap' || !p.deliveryISO) return; if(p.nofail){ if(p.sup==='confirmed' && p.confirmData){ p.orderISO=p.confirmData.orderRequiredISO; p.orderDisplay=p.confirmData.orderRequiredDisplay; } } else if(!p.orderISO && window.MSLead){ const od=MSLead.subWorkingDays(parseDelivery(p), custLeadDays(p)); p.orderISO=MSLead.isoDate(od)+'T17:00'; p.orderDisplay=MSLead.fmtDate(od); } }); }
(function(){ try{ const saved=JSON.parse(localStorage.getItem(STATE_KEY)||'{}'); products.forEach(p=>{ const v=saved[p.name]; if(!v)return; if(v.sts) p.actions.forEach((a,i)=>{ if(v.sts[i]){ a.st=v.sts[i]; syncActionSub(p,i,['design','price','sample','stock'][i]); } }); if(v.status) p.status=v.status; ['design','delivery','deliveryISO','nofail','sup','confirmData','orderISO','orderDisplay','stockReq','stockReservedUntilISO','stockReservedUntilDisplay','deadlineMissed','supManual','flag'].forEach(k=>{ if(k in v) p[k]=v[k]; }); if(v.price && window.MSModal && MSModal.restorePriceState) MSModal.restorePriceState(p, v.price); if(p.design && window.MSModal && MSModal.rollDesign){ p.actions[0].st=MSModal.rollDesign(p); } }); }catch(e){} })();
normalizeDelivery();
(function(){ products.forEach(p=>{ const a=p.actions[3]; if(a && a.st==='instock' && p.stockReservedUntilISO && new Date(p.stockReservedUntilISO) < NOW){ a.st='withacm'; p.stockReservedUntilISO=null; p.stockReservedUntilDisplay=null; } }); })();
products.forEach(p=>{ if(window.MSModal && MSModal.seedDesign) MSModal.seedDesign(p); });
products.forEach(p=>p.actions.forEach((a,i)=>actionLabel(p,i,['design','price','sample','stock'][i])));
(function(){ products.forEach(p=>{ if(p.deadlineMissed) return; if(!['clock','order'].includes(p.status.type)) return; if(p.orderISO && new Date(p.orderISO) < NOW) triggerMissed(p); }); })();
window.persist=function(){ try{ const o={}; products.forEach(p=>{ o[p.name]={sts:p.actions.map(a=>a.st),design:p.design,status:p.status,delivery:p.delivery,deliveryISO:p.deliveryISO,nofail:p.nofail,sup:p.sup,confirmData:p.confirmData,orderISO:p.orderISO,orderDisplay:p.orderDisplay,stockReq:p.stockReq,stockReservedUntilISO:p.stockReservedUntilISO,stockReservedUntilDisplay:p.stockReservedUntilDisplay,deadlineMissed:p.deadlineMissed,supManual:p.supManual,flag:p.flag,price:(window.MSModal&&MSModal.priceState)?MSModal.priceState(p):undefined}; }); localStorage.setItem(STATE_KEY, JSON.stringify(o)); }catch(e){} };

    const bars = `<span class="bar">${a.bars.map(v=>{const w = a.st==='pause' ? v : (v>=0.5?1:0); return `<span class="seg3"><i style="width:${Math.round(w*100)}%;${a.pink?'background:var(--blossom)':''}${a.st==='pause'?'background:#cfd2e0':''}"></i></span>`;}).join('')}</span>`;

function deadchip(p){
  if(p.deadlineMissed) return `<div class="deadchip urgent">Deadline missed</div>`;
  if(!p.orderISO) return '';
  let disp=p.orderDisplay, iso=p.orderISO;
  if(ROLE==='cust' && window.MSLead){ const cd=MSLead.subWorkingHours(new Date(p.orderISO),4); iso=cd; disp=MSLead.fmtDateTime(cd, NOW); }
  const urgent = (new Date(iso) - NOW) < 24*3600*1000;
  return `<div class="deadchip ${urgent?'urgent':''}">${disp}</div>`;
}
function statusHTML(p){
  const s=p.status;
  const chip=(cls,icon,label)=>`<span class="statchip"><span class="statcircle ${cls} ${icon==='ic-clock'?'cf':''}"><svg class="icn"><use href="#${icon}"/></svg></span>${label}</span>`;
  if(s.type==='order') return `<div class="statinner"><button class="orderbtn"><svg class="icn"><use href="#ic-bag"/></svg>Order</button></div>`;
  if(s.type==='clock') return `<div class="statinner">${chip('peri','ic-clock',s.label)}</div>`;
  if(s.type==='bulb') return `<div class="statinner">${chip('peri',s.icon||'ic-bulb',s.label)}</div>`;
  if(s.type==='ordered') return `<div class="statinner">${chip('ink','ic-box','Ordered')}<span class="statreorder">Re-order</span></div>`;
  if(s.type==='archived') return `<div class="statinner">${chip('muted','ic-archive','Archived')}</div>`;
  if(s.type==='pause') return `<div class="statinner">${chip('muted','ic-pause',s.label)}</div>`;
  return '';
}

function orderByDistHTML(p){
  const missed=!!p.deadlineMissed;
  const now=(typeof EMBED!=='undefined'&&EMBED)?Date.now():NOW.getTime();
  let supTs=null, note='', hard=false;
  if(p.orderISO){ supTs=new Date(p.orderISO).getTime(); hard=true;
    if(p.sup==='confirmed') note='Agreed with '+((((p.confirmData||{}).contactNames||[])[0])||'supplier'); }
  else { let t=null; try{ t=obTs(p); }catch(e){} if(t!==null){ supTs=t; note='From lead time'; } }
  if(supTs===null) return missed?'<div class="dl-foot solo"><span class="deadchip urgent">Deadline missed</span></div>':'<span class="obnone">—</span>';
  const custTs=window.MSLead?MSLead.subWorkingHours(new Date(supTs),4).getTime():(supTs-4*3600000);
  const fmt=ts=>{ const d=new Date(ts); return hard&&window.MSLead?MSLead.fmtDateTime(d,NOW):(window.MSLead?MSLead.fmtDate(d):d.toLocaleDateString('en-GB')); };
  const cls=ts=>ts<now?'over':(ts-now<7*86400000?'soon':'');
  return `<div class="obwrap dl-tidy${missed?' is-missed':''}"${note?` title="${note}"`:''}>
    <div class="dl-line ${cls(supTs)}"><span class="dk">Sup</span><span class="dv">${hard&&p.orderDisplay?p.orderDisplay:fmt(supTs)}</span></div>
    <div class="dl-line ${cls(custTs)}"><span class="dk">Cus</span><span class="dv">${fmt(custTs)}</span></div>${missed?'<div class="dl-foot"><span class="deadchip urgent">Deadline missed</span></div>':''}
  </div>`;
}

function orderByHTML(p){
  if(ROLE==='dist') return orderByDistHTML(p);

  let t=null; try{ t=obTs(p); }catch(e){}
  if(t===null) return missed?'<div class="dl-foot solo"><span class="deadchip urgent">Deadline missed</span></div>':'<span class="obnone">—</span>';
  const now=(typeof EMBED!=='undefined'&&EMBED)?Date.now():NOW.getTime();
  const d=new Date(t);
  const disp=window.MSLead?MSLead.fmtDate(d):d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

  return `<div class="obwrap dl-tidy${missed?' is-missed':''}"><div class="dl-line ${cls}"><span class="dv">${disp}</span></div>${missed?'<div class="dl-foot"><span class="deadchip urgent">Deadline missed</span></div>':''}</div>`;
}

function distLeadHTML(p){
  const cal='<svg class="icn" style="width:15px;height:15px;color:var(--periwinkle-deep)"><use href="#ic-cal"/></svg>';
  const isDate=p.delivery&&p.delivery!=='asap';
  const critical=!!p.nofail;
  const badge=`<button class="critbtn" title="Toggle Standard / Critical (no-fail) delivery">${critical?'<span class="nofail">Critical</span>':'<span class="notcrit">Standard</span>'}</button>`;
  let supDisp='<span class="obnone">—</span>', supNote='', supEst=false;
  if(p.sup==='confirmed'&&p.confirmData&&p.confirmData.supplierDeliveryDisplay){
    supDisp=p.confirmData.supplierDeliveryDisplay;
    supNote='Agreed with '+(((p.confirmData.contactNames||[])[0])||'supplier');
  } else if(p.supManual&&p.supManual.display){
    supDisp=p.supManual.display;
    supNote=(p.supManual.by?('Agreed with '+p.supManual.by):'Entered')+' · manual';
  } else if(isDate&&!critical){
    // Standard delivery: supplier date defaults from lead time (customer date − days in lieu)
    const cd=parseDelivery(p); const lieu=window.MSLead?MSLead.lieuFor(supplierName(p)):3;
    if(cd){ const sd=window.MSLead?MSLead.subWorkingDays(cd,lieu):new Date(cd.getTime()-lieu*86400000);
      supDisp=window.MSLead?MSLead.fmtDate(sd):p.delivery; supNote='Estimated from '+custLeadDays(p)+'-day lead time'+(window.__leadParts&&__leadParts(p)?(lp=>' ('+lp.blankLead+' blank + '+lp.transit+' transit + '+lp.brandLead+' branding + '+lp.lieu+' in lieu)')(__leadParts(p)):''); supEst=true; }
  }
  const custDisp=isDate?(p.deadlineMissed?`<span class="missed-date">${p.delivery}</span>`:p.delivery):'<span class="asaplabel">ASAP</span>';
  // supplier confirmation folds into ONE status marker on the supplier line (detail lives in the tooltip / popovers)
  let marker='';
  if(isDate&&critical){
    if(p.sup==='confirmed') marker=`<button class="dstat ok confirmedpick" data-mstip="${(supNote||'Confirmed by supplier')} — click to view / edit the confirmation" title="${(supNote||'Confirmed by supplier')} — click to view / edit"><svg class="icn"><use href="#ic-check"/></svg></button>`;
    else if(p.sup==='rejected') marker=`<button class="dstat bad reqedit" data-mstip="Supplier can’t meet this date — click to review &amp; resend the request" title="Supplier can’t meet — review &amp; resend"><svg class="icn"><use href="#ic-cross"/></svg></button>`;
    else if(p.sup==='sent') marker=`<button class="dstat wait reqview" data-mstip="Awaiting supplier — request sent; click to view the reply" title="Awaiting supplier — click to view reply"><svg class="icn"><use href="#ic-clock"/></svg></button>`;
    else if(!p.deadlineMissed) marker=`<button class="dstat req reqstart" data-mstip="Critical date — click to request confirmation from the supplier" title="Request confirmation from supplier"><svg class="icn"><use href="#ic-plus"/></svg></button>`;
  } else if(supNote&&!supEst) marker=`<span class="dstat ok" data-mstip="${supNote}" title="${supNote}"><svg class="icn"><use href="#ic-check"/></svg></span>`;
  return `<div class="lead dl-tidy${critical&&isDate?' is-crit':''}">
    <div class="dl-line"><span class="dk">Sup</span><span class="dv"${supNote?` title="${supNote}"`:''}>${supDisp}</span>${marker}<span class="daypick sup-pick" title="Set supplier delivery date manually">${cal}</span></div>
    <div class="dl-line"><span class="dk">Cus</span><span class="dv">${custDisp}</span><span class="daypick cust-pick" title="Change customer delivery date">${cal}</span></div>
    <div class="dl-foot">${isDate?badge:`<span class="dl2-note"${window.__leadParts&&__leadParts(p)?(lp=>` title="${lp.blankLead} days ${lp.blank} + ${lp.transit} transit + ${lp.brandLead} branding at ${lp.brand} + ${lp.lieu} in lieu"`)(__leadParts(p)):''}>Lead time: ${custLeadDays(p)} working days${window.__leadParts&&__leadParts(p)?' · 2 suppliers':''}</span>`}</div>
  </div>`;
}

function leadHTML(p){
  if(ROLE==='dist') return distLeadHTML(p);
  const cal='<svg class="icn" style="width:15px;height:15px;color:var(--periwinkle-deep)"><use href="#ic-cal"/></svg>';
  const isDate = p.delivery && p.delivery!=='asap';
  const critical = !!p.nofail;
  const tag = isDate ? `<span class="${critical?'nofail':'notcrit'}">${critical?'Critical':'Standard'}</span>` : '';
  // a critical date's supplier confirmation folds into one read-only status marker (detail in the tooltip)
  let marker='';
  if(isDate && critical){
    if(p.sup==='confirmed') marker=`<span class="dstat ok" data-mstip="Confirmed — the distributor has confirmed this delivery date with production" title="Confirmed"><svg class="icn"><use href="#ic-check"/></svg></span>`;
    else if(p.sup==='rejected') marker=`<span class="dstat bad" data-mstip="Date unavailable — production can’t meet this date; the distributor is arranging an alternative" title="Date unavailable"><svg class="icn"><use href="#ic-cross"/></svg></span>`;
    else marker=`<span class="dstat wait" data-mstip="Awaiting confirmation — the distributor is checking this critical date with production" title="Awaiting confirmation"><svg class="icn"><use href="#ic-clock"/></svg></span>`;
  }
  if(!isDate){
    return `<div class="lead dl-tidy">
      <div class="dl-cal"><span class="daypick choose-action" title="Choose a delivery date">${cal}</span></div>
      <div class="dl-line"><span class="dv"><span class="asaplabel">ASAP</span></span></div>
      <div class="dl-foot"><span class="dl2-note">Lead time: ${custLeadDays(p)} working days</span></div>
    </div>`;
  }
  const dateHTML = p.deadlineMissed ? `<span class="missed-date">${p.delivery}</span>` : p.delivery;
  const pickCls = p.deadlineMissed ? 'daypick choose-action' : 'daypick';
  const pickTitle = p.deadlineMissed ? 'Choose a new date' : 'Change delivery date';
  return `<div class="lead dl-tidy${critical?' is-crit':''}">
    <div class="dl-cal"><span class="${pickCls}" title="${pickTitle}">${cal}</span></div>
    <div class="dl-line"><span class="dv">${dateHTML}</span></div>
    <div class="dl-foot">${tag}${marker}</div>
  </div>`;
}

const obFilters=new Set();
const OBNOW=EMBED?Date.now():null; // embeds live on the real clock (master page's basis); standalone keeps the demo clock
function obTs(p){
  const t=p.status&&p.status.type;
  if(t==='ordered'||t==='archived'||t==='pause') return null;            // already ordered / parked
  if(EMBED){ // same basis as the master page, but a supplier-confirmed deadline wins when present
    if(p.orderISO) return new Date(p.orderISO).getTime();
    const d=(typeof parseDelivery==='function')?parseDelivery(p):null;
    const base=d?d.getTime():(window.__embedDeadline||null); if(base===null) return null;
    let x=0; for(const ch of p.name) x=(x*31+ch.charCodeAt(0))>>>0;
    return base-(10+(x%15))*86400000+43200000; } // noon-normalised so shown date == sort-key date
  if(p.orderISO) return new Date(p.orderISO).getTime();                   // supplier-confirmed hard deadline
  const d=(typeof parseDelivery==='function')?parseDelivery(p):null; if(!d) return null;
  const cl=(typeof custLeadDays==='function')?custLeadDays(p):14;
  const ob=window.MSLead?MSLead.subWorkingDays(d,cl):new Date(d.getTime()-cl*86400000);
  return ob.getTime();
}
function obBucketsOf(p){ const t=obTs(p); if(t===null) return [];
  const now=OBNOW!==null?OBNOW:NOW.getTime();
  if(t<now) return ['ob-over'];
  const d0=new Date(now); d0.setHours(0,0,0,0);
  const d1=d0.getTime()+86400000, d2=d0.getTime()+2*86400000, wk=d0.getTime()+7*86400000;
  const b=[];
  if(t<d1) b.push('ob-today'); else if(t<d2) b.push('ob-tom');
  if(t<wk) b.push('ob-week');
  return b; }
window.__obCascade=modes=>{ obFilters.clear(); (modes||[]).forEach(k=>obFilters.add(k));

// ---- Entrance animations (Web Animations API) ----
// Transform-only (never opacity) so content is ALWAYS visible — even when the
// animation is frozen at frame 0 (offscreen capture / backgrounded tab / PDF
// export). Self-disables for reduced-motion.
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;
  const EASE = 'cubic-bezier(.22,.61,.36,1)';
  const slide = (el, {dy=12, dur=550, delay=0}={}) => {
    if(!el) return;
    el.animate(
      [{transform:`translateY(${dy}px)`},{transform:'none'}],
      {duration:dur, delay, easing:EASE, fill:'backwards'}
    );
  };
  slide(document.querySelector('.header'),   {dy:-8, dur:500});
  slide(document.querySelector('.titlerow'), {dy:10, delay:80});
  slide(document.querySelector('.created'),  {dy:10, delay:120});
  slide(document.querySelector('.toolbar'),  {dy:10, delay:160});
  slide(document.querySelector('.thead'),    {dy:10, delay:200});
  document.querySelectorAll('#rows .row').forEach((row, i) => {
    slide(row, {dy:14, dur:520, delay:230 + i*55});
  });
})();

  return `<span class="pm-secpill ${b.cls}"><svg class="icn"><use href="#${b.icon}"/></svg>${b.label}</span>`;

function wireCard(p, tabKey, secEl){
  const root = secEl || document;
  if(window.MSModal) window.MSModal.wire(p, tabKey, msCtx(p));
  if(tabKey==='stock'){
    const rq=root.querySelector('.js-streq'); if(rq) rq.onclick=()=>openStockReq(p);
    const rp=root.querySelector('.js-strep'); if(rp) rp.onclick=()=>openStockReply(p);
    const ed=root.querySelector('.js-stedit'); if(ed) ed.onclick=()=>openStockReq(p);
    return;
  }
  const cta=root.querySelector('.js-cta');
  if(cta) cta.onclick=()=>{ const curSt=p.actions[FLOWS[tabKey].ai].st; const {idx,setback}=resolveStep(tabKey,curSt);
    if(tabKey==='sample' && curSt==='sampleorder' && typeof addProductToBasket==='function'){ addProductToBasket(p,'sample'); const b=document.getElementById('msBasketCount'); if(b){ b.textContent=(window.MSOrders?MSOrders.getBasket().length:1); b.style.display='grid'; } }
    applyCard(p,tabKey, setback?idx:idx+1, {forward:true}); };
  const sec=root.querySelector('.js-sec');
  if(sec) sec.onclick=()=>applyCard(p,tabKey,0,{setback:true});
}

function openStockReply(p){ if(!window.MSConfirm)return; const v=[(p.stockReq&&p.stockReq.colour),(p.stockReq&&p.stockReq.size)].filter(Boolean).join(' / ');
  MSConfirm.openStockReply({ productName:p.name, supplierName:stockSupplier(p), variant:v, now:NOW, suggestUntilISO:(window.MSLead?MSLead.isoDate(MSLead.addWorkingDays(NOW,10))+'T17:00':''),

function applyCard(p, tabKey, targetIdx, opts={}){
  const f=FLOWS[tabKey]; const last=f.steps.length-1;
  // two-supplier locked prices: can't move the price forward while one supplier's quote is still outstanding
  if(tabKey==='price'&&!opts.setback&&targetIdx>0){ try{ const d=window.MSModal&&MSModal.data?MSModal.data(p):null, lk=d&&d.price&&d.price.locked; if(d&&d.twoSupplier&&lk&&lk.two&&lk.reqState==='partial'){ const q=lk.quote||{}, w=q.product?d.twoSupplier.branding.supplier:d.twoSupplier.product.supplier; if(window.MStoast) MStoast('Waiting for '+w+'’s quote. Both suppliers need to quote before the price can go forward.'); else alert('Waiting for '+w+'’s quote.'); return; } }catch(e){} }
  targetIdx=Math.max(-1,Math.min(last,targetIdx));
  const wasComplete=resolveStep(tabKey,p.actions[f.ai].st).complete;
  let newSt = opts.setback ? (tabKey==='stock'?'notinstock':(tabKey==='design'?'feedback':'notapproved'))
                           : (targetIdx<0 ? 'dash' : f.steps[targetIdx].st);
  p.actions[f.ai].st=newSt;
  syncActionSub(p, f.ai, tabKey);
  const {complete}=resolveStep(tabKey,newSt);
  refreshSection(p, tabKey);
  if(complete && !wasComplete){ const card=document.getElementById('pmsec-'+tabKey); if(card && window.celebrate) celebrate(card); }
  recomputeProductStatus(p);
  updateUnderlyingRow(p);
  if(window.MSlog){ const bb=statusBadgeFor(tabKey,newSt); window.MSlog(p, {type:'status', icon:icnFor(newSt)||'ic-clock', label:`updated ${ACT[f.ai]} to “${bb.label}”`, who:0}); }
  if(window.persist)persist();
}

function recomputeProductStatus(p){
  if(['bulb','pause','archived'].includes(p.status.type)){ updateHeaderStat(p,false); return; }
  const a=p.actions;
  const sampleOK = (p.design&&p.design.sampleCfg&&p.design.sampleCfg.notRequired) ? true : a[2].st==='approved';
  const ready=(a[0].st==='approved'||a[0].st==='unbranded') && a[1].st==='approved' && sampleOK && a[3].st==='instock' && deliveryReady(p);
  const wasOrder=p.status.type==='order';
  p.status = ready ? {type:'order'} : {type:'clock',label:'In Progress'};
  updateHeaderStat(p, ready && !wasOrder);
}
function updateHeaderStat(p, pop){
  const statLabel=p.status.label || ({order:'Ready to Order',ordered:'Ordered',archived:'Archived'}[p.status.type]) || 'In Progress';
  const st=p.status.type; let sIcon='ic-clock', sCls='peri';
  if(st==='bulb'){ sIcon=p.status.icon||'ic-bulb'; sCls='peri'; }
  else if(st==='order'){ sIcon='ic-bag'; sCls='peri'; }
  else if(st==='ordered'){ sIcon='ic-box'; sCls='ink'; }
  else if(st==='archived'){ sIcon='ic-archive'; sCls='muted'; }
  else if(st==='pause'){ sIcon='ic-pause'; sCls='muted'; }
  const el=document.getElementById('pmStat');
  el.innerHTML=`<span class="statcircle ${sCls} ${sIcon==='ic-clock'?'cf':''}"><svg class="icn"><use href="#${sIcon}"/></svg></span>${statLabel}`;
  if(pop){ const c=el.querySelector('.statcircle'); c.classList.add('pm-pop'); setTimeout(()=>c.classList.remove('pm-pop'),420); }
}

function celebrate(card){
  const bar=card.querySelector('#scBar'); if(!bar)return;
  bar.classList.add('celebrate'); setTimeout(()=>bar.classList.remove('celebrate'),950);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors=['#36C0A0','#7B85C5','#FFEB3D','#FFA2A5','#0097D8'];
  const br=bar.getBoundingClientRect(), cr=card.getBoundingClientRect();
  const cx=br.left-cr.left+br.width/2, cy=br.top-cr.top+br.height/2;
  for(let i=0;i<16;i++){
    const s=document.createElement('span'); s.className='pm-spark';
    s.style.background=colors[i%colors.length]; s.style.left=cx+'px'; s.style.top=cy+'px';
    card.appendChild(s);
    const ang=(Math.PI*2*i)/16+(Math.random()*0.6-0.3), dist=55+Math.random()*75;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-10;
    s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.2)`,opacity:0}],{duration:680+Math.random()*260,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();
  }
}

function addProductToBasket(p, kind, opt){ opt=opt||{};

  const cols=(typeof coloursOf==='function'?coloursOf(p):[]).map(c=>({c:c.name||c, hex:c.hex||c.swatch||''}));
  const hexOf = n => (cols.find(c=>c.c===n)||{}).hex||'';
  let rows;
  // colours chosen in the pop-out (Branding → Product Colour & Variant) win; each gets the chosen variant
  const picked=(window.PMStock&&PMStock.chosen?PMStock.chosen(p):[])||[], pv=ch&&ch.variant?' · '+ch.variant:'';
  const hexFor=n=>hexOf(n)||(((window.MSModal&&MSModal.data&&MSModal.data(p)&&MSModal.data(p).colours)||[]).find(c=>c.name===n)||{}).hex||'';
  if(!sels.length&&picked.length){ const per=kind==='sample'?2:(p.qty||100); rows=picked.map((c,i)=>({c:c+pv,hex:hexFor(c),qty:kind==='sample'?per:(i===0?per:0)})); }

    const per = kind==='sample'?2:(p.qty||100);
    rows=[];

      const vs = s.variants.length ? s.variants : ['']; // empty = all variants → single "(all variants)" row

      else { rows.push({c:s.colour+((p.sizes||[]).length>1?' · all variants':''),hex:hexOf(s.colour),qty:per}); }
    });
  } else {
    rows = cols.length ? cols.map((c,i)=>({c:c.c,hex:c.hex,qty:i===0?(kind==='sample'?2:(p.qty||100)):0}))

  const vimg=(p.design&&p.design.visual&&Array.isArray(p.design.visual.images)&&p.design.visual.images[0])||null; const line = { kind, name:p.name, img:p.img, visual:unbranded?null:vimg, project:'Autumn Giveaways',

  if(kind==='product'){ try{ const md=window.MSModal&&MSModal.data?MSModal.data(p):null, AC=((md&&md.price&&md.price.additional)||[]).filter(x=>x&&(+x.unit||0)*(+x.qty||1));

  window.MSOrders.addToBasket(line);

(function(){ const m=document.getElementById('pmodal'); if(!m) return;
  // the title row's close button: added back if the title tools re-render, and it closes the pop-out directly

<script>
/* Design pane snap: nothing until you're past half of the first section, then settle on the nearest section start (below the pinned tabs) */
(function(){ let t=null, busy=false;
  document.addEventListener('scroll',e=>{ const w=e.target; if(!w||w.id!=='pmWork'||busy) return; clearTimeout(t); t=setTimeout(()=>snap(w),140); },true);
  function snap(w){ const secs=[...w.querySelectorAll('.dsg-pane .bb-wrap>.bb-step,.dsg-pane .bb-wrap>.bb-pair')]; if(secs.length<2) return;
    const tabs=w.querySelector('.dsg-tabs'), off=(tabs?tabs.offsetHeight:0)+8, wr=w.getBoundingClientRect();
    const tops=secs.map(s=>s.getBoundingClientRect().top-wr.top+w.scrollTop-off);
    if(w.scrollTop<tops[0]+secs[0].offsetHeight/2) return;
    if(w.scrollTop+w.clientHeight>=w.scrollHeight-4) return;
    let best=tops[0],d=1e9; tops.forEach(y=>{ const k=Math.abs(y-w.scrollTop); if(k<d){ d=k; best=y; } });
    if(d<4||d>w.clientHeight*.6) return; busy=true; w.scrollTo({top:best,behavior:'smooth'}); setTimeout(()=>busy=false,500); }
})();
</script>
