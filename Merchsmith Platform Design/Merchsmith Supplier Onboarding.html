<style>*{box-sizing:border-box;} .sob-tags{display:flex;flex-wrap:wrap;gap:6px;} .sob-tags button{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line-soft);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 14px;cursor:pointer;} .sob-tags button.on{border-color:var(--periwinkle-deep);background:var(--tint-peri);color:var(--periwinkle-deep);} .ob-terms2{background:var(--paper);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;} .ob-terms2 p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2);} .sob-att{display:flex;flex-direction:column;gap:6px;} .sob-af{display:flex;align-items:center;gap:10px;border:1px solid var(--line-soft);border-radius:10px;padding:8px 12px;background:#fff;font-size:13.5px;} .sob-af span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;} .sob-af small{color:var(--muted);white-space:nowrap;} .sob-af button{border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;} .sob-attadd{align-self:flex-start;cursor:pointer;} .ob-stripe textarea{font:inherit;font-size:14px;border:1.5px solid var(--line-soft);border-radius:11px;padding:10px 12px;resize:vertical;width:100%;} .sob-ghost{background:var(--ink);color:#fff;font-size:13px;font-weight:700;text-align:center;padding:8px 16px;} .ob-plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;} @media(max-width:560px){.ob-plans{grid-template-columns:1fr;}} .ob-plan{border:1.5px solid var(--line-soft);background:#fff;border-radius:14px;padding:14px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;} .ob-plan.on{border-color:var(--ob-p);box-shadow:0 0 0 3px color-mix(in srgb,var(--ob-p) 15%,transparent);} .ob-plan b{font-size:16px;} .ob-plan span{font-size:13.5px;font-weight:800;color:var(--ob-p);} .ob-plan small{font-size:12px;color:var(--muted);} .ob-seg{display:flex;background:var(--paper-2);border-radius:10px;padding:3px;width:max-content;} .ob-seg button{border:0;background:none;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink-3);padding:7px 18px;border-radius:8px;cursor:pointer;} .ob-seg button.on{background:#fff;color:var(--ob-p);box-shadow:0 1px 4px rgba(20,22,45,.1);} .ob-stripe{border:1px solid var(--line-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper);} .ob-stripe>small{font-size:11.5px;color:var(--muted);} .ob-dom{display:flex;border:1.5px solid var(--line-soft);border-radius:11px;overflow:hidden;background:#fff;} .ob-dom input{border:0!important;border-radius:0!important;flex:1;min-width:0;} .ob-dom span{padding:0 12px;display:flex;align-items:center;background:var(--paper);color:var(--ink-3);font-size:14px;white-space:nowrap;} .ob-dns{display:flex;flex-direction:column;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;} .ob-dns>div{display:grid;grid-template-columns:60px 130px minmax(0,1fr);gap:10px;padding:9px 12px;border-top:1px solid var(--paper-2);font-size:12.5px;align-items:center;} .ob-dns>div:first-child{border-top:0;} .ob-dns span{font-weight:800;font-size:11px;background:var(--paper-2);border-radius:5px;padding:2px 6px;text-align:center;} .ob-dns code{word-break:break-all;color:var(--ink-2);} .ob-sub small{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);margin-left:6px;} .ob-role{cursor:default;} .ob-brand>div{min-width:0;} .dob-logos{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;} .dob-logos>div{display:flex;flex-direction:column;gap:8px;min-width:0;} .ob-drop{width:100%;margin-top:0!important;} .ob-drop.sq{width:90px;} .ob-drop img,.ob-mono img,.pvh img,.ob-brand-l img{width:auto!important;height:auto;max-width:80%;} .ob-drop img{max-height:62px!important;} .ob-drop.sq img{max-height:64px!important;} .ob-mono img{max-height:32px!important;} .ob-mono span{overflow:hidden;} .ob-brand-l img{max-height:30px;max-width:170px;} .pvh img{max-height:22px;max-width:130px;} a{color:var(--periwinkle-deep);} a:hover{color:var(--ink);}</style>
