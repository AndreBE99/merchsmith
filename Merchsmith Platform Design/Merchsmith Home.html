<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchsmith — Dashboard</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600&family=Fredoka:wght@500;600&family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js?v=10"></script>
<style>
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;}
.icn{width:20px;height:20px;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
a{color:inherit;text-decoration:none;}
/* header */
.crumbband{background:var(--periwinkle);color:#fff;padding:13px var(--page-gutter);}
.crumb{font-size:14px;font-weight:600;display:flex;gap:9px;align-items:center;}
.crumb .sep{opacity:.6;}
.header{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line-soft);position:relative;z-index:25;}
.brand{display:flex;align-items:center;gap:13px;}
.brand .mojo{font-family:"Fredoka",var(--sans);font-weight:600;font-size:26px;color:var(--periwinkle-deep);}
.brand .ctx{font-size:12px;font-weight:700;color:var(--ink-3);border-left:1px solid var(--line-soft);padding-left:13px;line-height:1.1;}
.brand .ctx small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;}
.roleswitch{display:flex;gap:3px;background:var(--paper-2);border-radius:999px;padding:4px;}
.roleswitch button{border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-3);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.roleswitch button.on{background:#fff;color:var(--periwinkle-deep);box-shadow:0 1px 4px rgba(20,22,45,.12);}
.headtools{display:flex;align-items:center;gap:14px;color:var(--ink-3);}
.headtools .it{position:relative;cursor:pointer;}
.headtools .badge{position:absolute;top:-7px;right:-9px;background:var(--flare);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 3px;}
.headtools .av{width:30px;height:30px;border-radius:50%;background:var(--periwinkle);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;}

.main{width:100%;max-width:none;padding:26px var(--page-gutter) 80px;}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:4px;}
.greet h1{font-family:var(--serif);font-weight:500;font-size:32px;margin:0;letter-spacing:-.01em;}
.greet .sub{font-size:13.5px;color:var(--text-soft);margin-top:5px;}
.greet .actions{display:flex;gap:9px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--periwinkle-deep);color:#fff;border:0;border-radius:11px;padding:10px 16px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;}
.btn:hover{filter:brightness(1.06);}
.btn .icn{width:15px;height:15px;}
.btn.ghost{background:#fff;color:var(--periwinkle-deep);border:1.5px solid var(--line-soft);}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0;}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{background:#fff;border:1px solid var(--line-soft);border-radius:16px;padding:17px 18px;box-shadow:0 4px 14px rgba(40,44,80,.04);}
.kpi .lab{font-size:12.5px;color:var(--text-soft);font-weight:600;}
.kpi .val{font-family:var(--serif);font-weight:500;font-size:30px;margin:6px 0 7px;line-height:1;}
.kpi .delta{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;}
.kpi .delta.up{color:var(--green-deep);background:var(--tint-green);}
.kpi .delta.down{color:var(--ink-3);background:var(--paper-2);}
.kpi .delta.warn{color:#9a6b1f;background:#fbeccd;}

/* layout */
.cols{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;}
@media(max-width:980px){.cols{grid-template-columns:1fr;}}
.card{background:#fff;border:1px solid var(--line-soft);border-radius:16px;padding:18px 20px;box-shadow:0 4px 14px rgba(40,44,80,.04);margin-bottom:16px;}
.card h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 4px;}
.card .ch-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-h h3{margin:0;}
.card-h a{font-size:12.5px;font-weight:700;color:var(--periwinkle-deep);}

/* trend chart */
.trend{display:flex;align-items:flex-end;gap:6px;height:120px;}
.trend .bar{flex:1;background:linear-gradient(var(--periwinkle),var(--periwinkle-deep));border-radius:5px 5px 0 0;min-height:6px;opacity:.9;}
.trend .bar:last-child{background:var(--flare);}

/* ranked list */
.rank{display:flex;flex-direction:column;gap:13px;}
.rank .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;}
.rank .r .n{font-size:13.5px;font-weight:600;}
.rank .r .v{font-size:13px;font-weight:800;color:var(--ink);}
.rank .r .track{grid-column:1/-1;height:7px;border-radius:4px;background:var(--paper-2);overflow:hidden;}
.rank .r .track i{display:block;height:100%;border-radius:4px;background:var(--periwinkle);}

/* pipeline */
.pipe{display:flex;gap:10px;}
.pipe .stg{flex:1;background:var(--paper);border-radius:12px;padding:14px 10px;text-align:center;}
.pipe .stg b{font-family:var(--serif);font-weight:500;font-size:24px;display:block;}
.pipe .stg span{font-size:11px;color:var(--muted);font-weight:600;}

/* task / list rows */
.list{display:flex;flex-direction:column;}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--paper-2);}
.lrow:first-child{border-top:0;}
.lrow .dot{width:8px;height:8px;border-radius:50%;background:var(--periwinkle);flex:none;}
.lrow .dot.warn{background:var(--flare);}
.lrow .lt{flex:1;font-size:13.5px;color:var(--ink);}
.lrow .lt small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;}
.lrow .tag{font-size:10.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--periwinkle-deep);background:var(--tint-peri);border-radius:999px;padding:3px 9px;white-space:nowrap;}
.lrow .tag.warn{color:#9a6b1f;background:#fbeccd;}
.lrow .when{font-size:11.5px;color:var(--muted);white-space:nowrap;}
.lrow .av{width:30px;height:30px;border-radius:50%;background:var(--periwinkle);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px;flex:none;}
/* progress rows */
.prow{padding:11px 0;border-top:1px solid var(--paper-2);}
.prow:first-child{border-top:0;}
.prow .ph{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;}
.prow .ph b{font-weight:600;}
.prow .ph .st{color:var(--muted);font-size:12px;font-weight:600;}
.prow .tk{height:7px;border-radius:4px;background:var(--paper-2);overflow:hidden;}
.prow .tk i{display:block;height:100%;border-radius:4px;background:var(--periwinkle);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chips .c{font-size:13px;font-weight:600;color:var(--ink);background:var(--paper-2);border-radius:9px;padding:8px 12px;cursor:pointer;}
.chips .c:hover{background:var(--tint-peri);color:var(--periwinkle-deep);}
.health{display:flex;flex-direction:column;gap:0;}
.hrow{display:flex;justify-content:space-between;font-size:13.5px;padding:10px 0;border-top:1px solid var(--paper-2);}
.hrow:first-child{border-top:0;}
.hrow b{color:var(--green-deep);}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="h-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></symbol>
<symbol id="h-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="h-store" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 5.5 5h13L20 9.5M4 9.5h16v11H4zM4 9.5a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0"/></symbol>
<symbol id="h-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></symbol>

<header class="header">
  <div class="brand" data-identity-lockup></div>
  
  <div class="headtools">
    <span class="it" title="Notifications"><svg class="icn"><use href="#h-bell"/></svg><span class="badge">4</span></span>
    <span class="av" id="hav">JD</span>
  </div>
</header>

<div class="crumbband"><div class="crumb"><span class="crumb-org">Mojo Promotions</span><span class="sep">›</span><span class="here">Dashboard</span></div></div>
