<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Merchsmith — Gallery</title>
<script>/* Layout sync (Sep 2026 clean-up). Small "keep X lined up with Y" fixes register here instead of each watching the whole page.
   They run together, once per frame at most, only after real events: load, resize, a click, the product pop-out opening/closing,
   or an explicit __msLayout.run(). Nothing re-triggers itself, so the page can't loop or freeze. */
window.__msLayout=window.__msLayout||(function(){ const fns=[]; let q=0, busy=false;
  const flush=()=>{ q=0; if(busy) return; busy=true; fns.forEach(f=>{ try{ f(); }catch(e){ console.warn('layout sync',e); } }); busy=false; };
  const run=()=>{ if(!q) q=requestAnimationFrame(flush); };
  let ct=0; const later=()=>{ clearTimeout(ct); ct=setTimeout(run,120); };
  addEventListener('resize',run); addEventListener('load',()=>{ run(); setTimeout(run,400); }); document.addEventListener('click',later,true);
  document.addEventListener('DOMContentLoaded',()=>{ const pm=document.getElementById('pmodal'); if(pm) new MutationObserver(()=>{ run(); setTimeout(run,380); }).observe(pm,{attributes:true,attributeFilter:['class']}); run(); });
  return {add(f){ fns.push(f); run(); }, run}; })();
/* kept for older code paths: a debounced, self-quietening watcher */
window.__msObserve=window.__msObserve||(fn=>{ let t=0; const o=new MutationObserver(()=>{ if(t) return; t=setTimeout(()=>{ t=0; try{ fn(); }catch(e){} o.takeRecords(); },120); }); return o; });</script>
<script>location.replace('Merchsmith Project - Autumn Giveaways.html?view=gallery'+location.hash);</script></head>
<body><p><a href="Merchsmith Project - Autumn Giveaways.html?view=gallery">Open the gallery view</a></p><script>(function(){ const m=document.getElementById('pmodal'); if(!m) return; let was=null; const sync=()=>{ const o=m.classList.contains('open'); if(o===was) return; was=o; document.documentElement.classList.toggle('pm-isopen',o); }; new MutationObserver(sync).observe(m,{attributes:true,attributeFilter:['class']}); sync(); })();</script>
</body></html>
